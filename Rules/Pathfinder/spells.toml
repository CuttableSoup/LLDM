[[entity]]
name = "fireball"
supertype = "spell"
subtype = "evocation"
description = "Hurl a bolt of arcane fire that bursts into flame on impact."
skill = "arcane"
difficulty = 10
# In bands now, not meters -- same single-number range every weapon/ability uses (see
# DM_Movement.py's "Movement and range").
range = 5
# Indiscriminate blast -- side = "all" hits everyone within 5 bands of the target regardless
# of hostility (fire doesn't care who it burns), number = 0 (unlimited) so the blast radius
# alone decides the casualty count, not an arbitrary cap.
targets = { number = 0, aoe = 5, side = "all" }
damage_value = { dice = 5, pips = 0, bonus = 0 }
damage_tags = [ "fire" ]

[[entity]]
name = "splash flow"
supertype = "spell"
subtype = "evocation"
description = "Conjure a sudden torrent of water and slam it into a single target."
skill = "arcane"
difficulty = 10
range = 5
targets = { number = 1, aoe = 0 }
damage_value = { dice = 4, pips = 0, bonus = 0 }
damage_tags = [ "water" ]

[[entity]]
name = "arc lance"
supertype = "spell"
subtype = "evocation"
description = "Channel a crackling lance of lightning through a pinch of iron filings."
skill = "arcane"
difficulty = 10
range = 5
targets = { number = 1, aoe = 0 }
damage_value = { dice = 4, pips = 1, bonus = 0 }
damage_tags = [ "lightning" ]
# Same {item, quantity} shape a craft recipe's own "materials" uses (DM_Crafting.py's
# _has_materials/_consume_materials, reused directly by _resolve_roll's own gate) -- gates the
# cast outright if missing (no roll, "missing_spell_materials"), and is consumed from the
# caster's inventory unconditionally once a real roll happens, success or failure alike, same
# as a craft attempt's own materials.
materials = [ { item = "iron filings", quantity = 1 } ]

[[entity]]
name = "suggestion"
supertype = "spell"
subtype = "enchantment"
description = "Plant a single, reasonable-sounding course of action in a listener's mind -- a successful working leaves them quietly convinced it was their own idea."
skill = "arcane"
difficulty = 10
range = 5
# Enchantment (Compulsion), Language-Dependent, Mind-Affecting (Pathfinder 1e) -- the words
# themselves are the whole mechanism, so a target who can't understand them can't be swayed at
# all. See entity_schema.toml's own "language_dependent" note and DM_Combat.py's
# _ability_requires_language: no shared language means no roll attempted, not a penalized one.
language_dependent = true
# No materials -- Suggestion is verbal/somatic only, no material component in the source rule.
# No on_fail -- a resisted suggestion is just a failed roll, no separate consequence to author.
# "text" is deliberately omitted here -- Program_Interpreter.py's own inject_directive op falls
# back to ctx's own "input" (the caster's raw turn text) when absent, so the actual suggested
# course of action is always whatever the player actually typed, never a fixed scripted line.
# "duration" (in block-clock blocks, DM_Time.py) is this op's own optional expiry -- one block
# (8 hours by rules.toml's own default [time] table) matching the source rule's own "a short
# while" flavor much better than the old no-expiry-at-all default (persisting for the rest of
# the playthrough) did.
on_pass = { do = "inject_directive", entity = "target", duration = 1 }

[[entity]]
name = "summon spectral wolf"
supertype = "spell"
subtype = "conjuration"
description = "Pull a translucent, silver-limned wolf out of raw magic to fight at your side for a short time."
skill = "arcane"
difficulty = 10
# No damage_value/damage_tags at all -- this spell's whole effect is the summon (see "summon"
# below), so _apply_damage_if_hit's own "damage_value" gate (DM_Core.py) correctly skips
# rolling any bonus damage for it. Cast with no current_target at all (no hostile creature
# present), this resolves as a flat, automatic difficulty-0 check (_resolve_roll's own
# no-target branch) -- summoning before a fight starts is trivial. Cast against a live hostile
# current_target, it's an ordinary opposed roll instead: the caster's own arcane vs. the
# target's willpower/arcane, framed as the target's presence disrupting the working -- range is
# set generously high (well past any real scene's own band count) purely so is_in_range never
# blocks the cast on distance alone; a summon isn't "aimed" at the target the way a damaging
# spell is.
range = 10
summon = { name = "spectral wolf", duration = 4 }

# A persistent terrain hazard, not a creature -- summon (_summon_creature, DM_Summoning.py)
# doesn't care what kind of entity it places, so the exact same placement/expiry "summon
# spectral wolf" above already uses (caster's own current band, removed once "duration" combat
# rounds pass) works unchanged for an inanimate object. max_hp exists purely so run_round_upkeep
# doesn't treat it as already-dead (get_current_hp returns 0, and upkeep skips hp <= 0 entities,
# for any entity authoring no hp field at all), NOT so it can meaningfully be fought -- current_
# target has no is_hostile gate (the dart trap's own disarm check already proves a non-hostile
# object can be targeted and rolled against), so without immunity_tags a player could just chop
# this down in a few ordinary swings and cancel the hazard for free. immunity_tags = ["any"] (a
# reserved wildcard, is_immune_to/Combat_Resolution.py) makes it immune to every damage_tags
# value that exists today or gets invented later, matching the real Pathfinder Wall of Fire
# (can't be harmed by mundane means at all) without hand-listing every physical/energy type.
# rules.toml's own "flame wall zone" ([[status]], trigger = "on_round") is what actually makes
# standing here dangerous: matched by this entity's own "name", it applies "burning" to whoever
# shares its band, freshly every round they stay (see docs/combat.md's "Pathfinder-mapping
# engine extensions"). subtype = "spell" (not a physical-object subtype like "trap"/"prop") is
# what marks this as a standing magical effect rather than a mundane hazard -- supertype stays
# "object" (is_hostile's own "objects are never hostile" short-circuit still applies; a live
# spell-catalog entity is never itself instanced into a scene, so there's no real collision
# between the two roles "spell" plays across supertype vs. subtype). "dispel magic" below keys
# on this exact subtype, so ANY future magical effect entity opts into being dispellable the
# same way, just by authoring subtype = "spell" -- not specific to "hazard"-shaped effects.
[[entity]]
name = "flame wall"
supertype = "object"
subtype = "spell"
description = "A sheet of roaring flame hangs in the air, fed by nothing but the magic that conjured it."
max_hp = 20
immunity_tags = [ "any" ]

[[entity]]
name = "wall of fire"
supertype = "spell"
subtype = "evocation"
description = "Conjure a sheet of roaring flame that scorches anyone standing in it."
skill = "arcane"
difficulty = 10
# No damage_value/damage_tags -- same reasoning as "summon spectral wolf" above, this spell's
# whole effect is the summoned hazard, not a direct hit. Generously high range for the same
# reason too: conjuring a wall isn't "aimed" at current_target, so is_in_range should never be
# what blocks the cast.
range = 10
summon = { name = "flame wall", duration = 5 }

# Banishes current_target outright if (and only if) its own supertype/subtype matches "dispel"'s
# {supertypes, subtypes} filter (_apply_dispel_if_hit, DM_Core.py -- the same OR-of-two-lists
# match damage_bonus_vs's own "Holy"/"Bane" shape already uses, matches_supertype_or_subtype in
# Combat_Resolution.py). {supertypes = ["spell"], subtypes = ["spell"]} deliberately covers BOTH
# axes "spell" can appear on: a live spell-catalog entity's own supertype (every spell entity in
# this file), and a conjured effect object's own subtype (ex: "flame wall" above) -- one filter
# for "anything magical", not narrowly scoped to one particular effect shape like "hazard" was.
# Aiming this at anything else (an ordinary creature, a chest) simply does nothing, the same
# "used on the wrong thing just wastes the action" shape the real Pathfinder spell has, rather
# than a hard pre-roll gate. No difficulty authored -- resolves as an ordinary opposed roll
# against current_target's own willpower/arcane, same as any other offensive spell; a mindless
# effect like "flame wall" (no skills of its own at all) offers essentially no resistance, while
# a warded creature's own defenses make it a genuine contested roll.
[[entity]]
name = "dispel magic"
supertype = "spell"
subtype = "abjuration"
description = "Unravel a nearby magical effect, banishing it outright."
skill = "arcane"
range = 5
dispel = { supertypes = [ "spell" ], subtypes = [ "spell" ] }

# Dismisses every one of current_target's own active conditions whose [[condition]] entry
# matches "cure"'s own {supertypes, subtypes} filter -- matches_supertype_or_subtype, reused
# unchanged against the condition catalog instead of the entity one (_apply_cure_if_hit,
# DM_Core.py). The Pathfinder "Remove Disease" shape: the caster doesn't need to name the
# specific affliction, just its kind -- rules.toml's own "filth fever" (subtype = "disease")
# is the shipped target, cured without the spell ever naming it directly. A broader panacea
# would instead author {supertypes = ["affliction"]}, also catching poison/curse. "difficulty"
# forces a flat, unopposed check the same way "dimension door"/"teleport" already do -- a
# beneficial spell cast on a willing, already-sick ally must never roll opposed against that
# ally's own defenses the way an ordinary hostile cast would. Aimed at a target with nothing
# matching simply cures nothing, the same "used on the wrong thing wastes the action" shape
# dispel already has.
[[entity]]
name = "cure disease"
supertype = "spell"
subtype = "conjuration"
description = "Channel divine grace to burn a festering sickness out of the body."
skill = "miracles"
difficulty = 8
range = 5
cure = { subtypes = [ "disease" ] }

# Pathfinder's Baleful Polymorph -- a hostile, permanent transformation into a harmless animal
# (rules.toml's own "polymorphed" condition, form = "coyote"). on_hit_condition applies it
# directly on a successful cast, no [entity.test] detour needed (the same shape "filth fever"'s
# own exposure vector already uses). duration = "permanent" since nothing about the spell
# itself reverses it -- see "break enchantment" below for the one authored way back.
[[entity]]
name = "baleful polymorph"
supertype = "spell"
subtype = "transmutation"
description = "Twist a foe's very shape, folding them down into a lean, harmless coyote."
skill = "arcane"
difficulty = 12
range = 5
targets = { number = 1, aoe = 0 }
on_hit_condition = { condition = "polymorphed", chance = 100, duration = "permanent" }

# The beneficial counterpart, cast on a willing ally rather than a resisting foe -- rules.toml's
# own "wild shape" condition, form = "wild boar". "difficulty" forces a flat, unopposed check
# the same way "dimension door"/"cure disease" already do -- a willing transformation must never
# roll opposed against the target's own defenses the way baleful polymorph's hostile cast does.
# duration = "rounds"/length = 10 keeps this a real Wild Shape, a temporary battle form rather
# than a permanent one like the hostile line above.
[[entity]]
name = "wild shape"
supertype = "spell"
subtype = "transmutation"
description = "Take on the sturdy, tusked shape of a wild boar for the span of a fight."
skill = "arcane"
difficulty = 5
range = 5
on_hit_condition = { condition = "wild shape", chance = 100, duration = "rounds", length = 10 }

# Reverses a standing transmutation on current_target by KIND, not by name -- the same shape
# "cure disease" above uses against "filth fever" (subtype = "disease"), reused here for
# subtype = "transmutation" instead. Cures "polymorphed" (rules.toml) without ever naming it,
# so any future transmutation condition opts into being reversible by this spell for free, just
# by authoring the same subtype. "difficulty" forces a flat, unopposed check -- a beneficial
# cast on a willing, already-transformed ally must never roll opposed against that ally's own
# (polymorphed-into-something-weaker) defenses.
[[entity]]
name = "break enchantment"
supertype = "spell"
subtype = "abjuration"
description = "Unravel a lingering transmutation, restoring the target to their true shape."
skill = "arcane"
difficulty = 10
range = 5
cure = { subtypes = [ "transmutation" ] }