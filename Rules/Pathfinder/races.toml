# Character-creation race templates (see rules.toml's own [character_creation] table for the
# shared point-buy constants every race uses identically: pool_dice, max_allocation_per_skill).
# There is no separate "base_dice" constant -- a race's own [race.skill_dice] table is the
# absolute, authoritative dice count for every single skill, human included (human is simply
# "0 in everything except saves," spelled out here the same as any other race, not an implicit
# default every other race deviates from). Character_Creation.race_baseline_skills reads a
# skill's value straight off this table, floored at 0; a skill genuinely missing from a race's
# own table (a data-authoring mistake, not an intentional case any race below relies on) falls
# back to Character_Creation.UNTRAINED_DICE (0) -- deliberately not the general engine's own
# "missing skill" convention of 1D (resolve_action/roll_initiative), since a chargen'd
# character always gets an explicit entry for every skill either way, never an actually-absent
# one.
#
# Baseline is 0D, not Fantasy's own 2D -- calibrated against a from-scratch Pathfinder 1e level
# 1 conversion (characters.toml's own "kesten varn", a plain Human Fighter built straight from
# the Core Rulebook and converted by creatures.toml's goblin-established method) rather than
# inherited from the Fantasy setting's own "competent adventurer from the start" curve. A
# from-scratch conversion's own touch-AC/save/attack numbers land at roughly 1D (rating 3-5) on
# its handful of actually-trained skills and 0D (untrained) on everything else -- Fantasy's own
# flat 2D-everywhere baseline alone (before a single point-buy die is even spent) already
# exceeds that on every account, which is what let a from-scratch Pathfinder character
# (gladstone, built under the OLD 2D/15-pool numbers) read as a far-higher-tier hero than a
# real level 1 Pathfinder fighter -- see scripts/calibrate_challenge_rating.py's own sibling
# investigation for the simulator evidence (kesten varn vs. creatures.toml's "goblin" tracks
# real Pathfinder low-CR encounter math; gladstone vs. the same goblin doesn't, because
# gladstone's own tier is nowhere near "level 1").
#
# **Saves are the one exception, fixed at 1D6 for every race, no exceptions.** fortitude/
# reflexes/willpower sit outside the 0D baseline and outside each race's own raise/lower flavor
# below -- every playable race gets a guaranteed floor of basic resilience regardless of its own
# combat/skill flavor, a deliberate design floor (not itself derived from kesten varn's own real,
# uneven Fortitude +4/Reflexes +2/Will +0 spread -- that's one specific fighter's own build, not
# a rule every race must reproduce). A race that previously had a save in its own raised/lowered
# list (dwarf's own "Fortitude" racial bonus; elf's own poor Fortitude) loses that slot to the
# shared floor instead of being replaced with a different skill -- dwarf ends up with 3 raised
# skills instead of 4, elf with 3 lowered, rather than inventing a new flavor pick just to hit a
# round number the header note below no longer strictly promises once saves are pulled out of it.
#
# Every non-human race still raises (up to) four *non-save* skills and lowers (up to) four
# others around the 0D baseline, same relative shape Fantasy's own races use, just shifted down
# with it and now save-exempt (3D -> 1D for a raised skill; 1D -> 0D, the same floor the baseline
# already sits at, for a lowered one -- at true level 1 a race's own weak skills and its
# untrained baseline are honestly indistinguishable, only a natural *talent* still shows).
#
# Not loaded by DMCore.load_rules alone -- Character_Creation.load_character_creation_data
# reads this same file independently (skill/race/character_creation keys only), so a character
# can be built *before* a DMCore/scenario exists at all. See DM_CharacterCreation.py's
# apply_character_creation for how a finished character-creation result is later baked into
# the player entity once DMCore does exist.
#
# "language" is this race's own native tongue -- apply_character_creation adds it onto the
# player entity's own "languages" list (an entity field documented in
# reference/entity_schema.toml) alongside whatever it already has, so an elf character knows
# both "common" and "elvish" while a human only ever adds "common" onto "common" (a no-op).
# DM_Dialogue.py's language-barrier check compares the player's own "languages" against
# whoever they're addressing: no overlap at all means the target can't be understood.
# "nonsense_phrase" is a short example of what that tongue sounds like -- not dialogue itself,
# just a style reference LLM_Core.py's own language-barrier prompt hands the model so it
# invents its own gibberish in a similar phonetic key, rather than reusing this phrase
# verbatim. Human has no nonsense_phrase at all: "common" is the one language every shipped
# entity defaults to knowing (see entity_schema.toml), so a human-to-human language barrier
# never actually arises with today's data.

[[race]]
name = "human"
description = "Versatile generalists, equally at home swinging a blade, reading a crowd, or reading the land -- no glaring weakness anywhere, but no singular natural gift either."
language = "common"
nonsense_phrase = "Oping tu stei laik cius go mo men"

[race.skill_dice]
# Saves -- fixed at 1D6 for every race (see this file's own header note).
fortitude = 1
reflexes = 1
willpower = 1
# Raised to 1D, no lowered skills to pay for it -- real Pathfinder humans take no racial ability
# penalty at all (just a free +2 to one ability of the player's own choice, a bonus feat, and a
# bonus skill point/level), unlike every other race here, which trades four skills up for
# roughly as many down. Being human was otherwise purely dominated (every other race gets the
# same 1D6 save floor PLUS its own raised skills, while human sat at the floor everywhere) --
# one skill from each broad domain (combat/social/knowledge/physical), deliberately not two
# combat skills at once, so this reads as breadth, not a stealth combat buff.
athletics = 1
blades = 1
observation = 1
streetwise = 1
# Everything else at the 0D baseline.
acrobatics = 0
appraise = 0
arcane = 0
artistry = 0
axes = 0
brawling = 0
charisma = 0
disguise = 0
dodge = 0
escape = 0
finesse = 0
fly = 0
forgery = 0
gambling = 0
husbandry = 0
intimidation = 0
linguistics = 0
medicine = 0
miracles = 0
missiles = 0
navigation = 0
polearms = 0
psionics = 0
stealth = 0
strength = 0
survival = 0
throwing = 0
trickery = 0

