acrobatics = 1
arcane = 1
observation = 1
stealth = 1
# Lowered to 0D -- the same floor the baseline itself already sits at (see this file's own
# header note: a race's own weak skills and an untrained baseline are indistinguishable at
# true level 1).
brawling = 0
intimidation = 0
strength = 0
# Everything else stays at the human baseline of 0D
appraise = 0
artistry = 0
athletics = 0
