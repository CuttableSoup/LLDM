# Shared polity catalog (see docs/downtime.md's "Terrain, roads, and polities") -- a flat
# Rules/Pathfinder/*.toml file like environments.toml/terrain.toml, referenced by name from
# world_map.toml's own [[region]] "polity" field. A third, independent axis alongside that same
# region's "environment" (encounter tables) and "terrain" (travel speed/passability): "polity"
# only ever seeds a freshly-instanced entity's own default "languages" (DM_Rules.py's
# _instance_entities, only when the entity's own template author left "languages" unset entirely
# -- never overriding an explicit choice) and names itself in arrival narration. No currency field
# here on purpose -- the engine has one flat scalar "currency" per entity and no named-currency
# subsystem at all, so a per-polity currency would be flavor text with no mechanic behind it.
[[polity]]
name = "Varisia"
language = "varisian"
description = "A rugged, sparsely settled frontier region on Golarion's northwest coast, its scattered towns overshadowed by the ruins of a much older empire."
# Enforcement (docs/law.md): an enforcer who recognizes someone with at least arrest_at bounty
# here confronts them; at kill_on_sight_at they attack instead. No polity-wide jail -- each town
# names its own (a location's "jail", found up its return_to chain). Placeholders, like the fines.
arrest_at = 1
kill_on_sight_at = 100

# Laws in force across Varisia (docs/law.md). fine is in gp (value's own unit); acclaim is
# what a filed report adds to the offender's acclaim here (negative = infamy). Placeholder
# numbers, not sourced from Golarion -- tune freely. No bans (magic schools, undead) yet; those
# are a per-setting lore choice.
[[polity.law]]
crime = "theft"
fine = 5
acclaim = -1

[[polity.law]]
crime = "assault"
fine = 10
acclaim = -2

[[polity.law]]
crime = "murder"
fine = 100
acclaim = -6

[[polity.law]]
crime = "resisting_arrest"
fine = 20
acclaim = -2
