# Bestiary 1 (3rd printing) p.238, "Rust Monster", CR 3, XP 800. Its defining trait -- antennae
# that corrode an equipped metal item outright -- now uses the new destroy_equipped ability
# field (Combat_Resolution.py's apply_destroy_equipped -> Inventory_Resolution.py's
# destroy_equipped_item), deliberately simplified from the real stat block's own two-stage
# "half max hp, a second hit destroys" effect down to a single destroy-or-nothing roll (chance =
# 60, a rolled-down approximation of that real DC 15 Reflex-negates). No damage_value at all --
# the antennae themselves deal no HP damage in Pathfinder either, only the rust effect. "bite" is
# kept as a second candidate ability purely so _best_offense_package's own CR scoring (which
# scans every ability regardless of what behavior actually picks) reads a real damage number
# instead of the antennae's own zero -- behavior itself always picks antennae (there's no
# "target still has something equipped" requirement field to gate a fallback on), matching the
# real creature's own single-minded hunger for metal; once a target has nothing left in "rhand",
# a further antennae attack is just a harmless per-round no-op rather than switching to biting.
[[entity]]
name = "rust monster"
supertype = "creature"
subtype = "aberration"
description = "An insectile creature on four legs, a strange propeller-shaped tail and two long, feathery antennae twitching at the air."

max_hp = 27

[[entity.abilities]]
name = "antennae"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
destroy_equipped = { slot = "rhand", chance = 60 }

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 0, pips = 2, bonus = 0 }

[[entity.behavior]]
requirements = [ { field = "hp_per_remain", operator = ">=", value = 0.01 } ]
action = "antennae"

