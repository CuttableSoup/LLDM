# "DR 5/bludgeoning" is the damage_resistance table's own "DR-with-bypass" shape, simplified
# down to its simplest case -- bludgeoning is the ONE type that bypasses it entirely, so it's
# just left out of resistance_tags rather than needing a separate resistance_bypass_tags entry
# (no incoming hit needs an explicit "skip" tag when the type that skips it was never listed as
# reduced in the first place). "+2 armor" (the real stat block's own "broken chain shirt",
# reduced from a real chain shirt's usual bonus) converts to leather armor -- the shipped item
# whose own armor_value happens to match that same +2 numerically. "Immune ... undead traits"
# (no need for food/sleep, immune to death effects/ability drain/etc.) isn't modeled -- broader
# than any tag category this engine tracks, the same scope "wraith" above already left alone.
