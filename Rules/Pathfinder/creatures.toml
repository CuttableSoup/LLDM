# Bestiary 1 (3rd printing) p.197, "Lycanthrope, Wererat" (Wererat, Hybrid Form), CR 2, XP 600.
# Converts the hybrid (combat) form specifically, not the human or dire-rat forms -- the shape
# an actual encounter fights. "Sneak attack +1d6" now uses damage_bonus_if_condition (a
# flanking-agnostic simplification -- it fires whenever the target is already flat_footed for
# any reason, not specifically "flanked"), inlined onto its own copy of "short sword" rather than
# on the shared equipment.toml item (which every other wielder also uses, and shouldn't all get a
# wererat's own sneak attack). "Evasion" now uses the new negates_save_for_half field
# (["reflexes"]), paired with an AoE ability's own save_for_half (ex: spells.toml's "fireball")
# -- negates such a hit outright on a passed Reflex save instead of merely halving it; does
# nothing against an ordinary single-target attack or a save_for_half keyed to a different
# skill. "Curse of lycanthropy" (the bite's real disease-like
# transmission) reuses the already-shipped "filth fever" condition as an honest stand-in for "a
# dangerous bite-borne affliction," the same reuse "dire rat" above already leans on -- not a
# literal disease,
# but the closest existing mechanism to "an infected bite that lingers." "DR 10/silver" ->
# resistance_bypass_tags = ["silver"], same forward-authored tag precedent as "imp"'s own "good"/
# "silver" bypass -- scaled up one step from the undead's own DR 5 (resistance_value 2D0) to
# reflect DR 10.
[[entity]]
name = "wererat"
supertype = "creature"
subtype = "humanoid"
description = "A hunched figure in studded leather, fur creeping across a rat-like face, a long naked tail trailing behind it."

max_hp = 20
negates_save_for_half = [ "reflexes" ]

resistance_value = { dice = 3, pips = 0 }
resistance_tags = [ "slashing", "piercing", "bludgeoning" ]
resistance_bypass_tags = [ "silver" ]

inventory = [ "short sword", "light crossbow", "studded leather armor" ]
# A mix of a catalog-item reference (a bare string) and two inline tables -- entity_schema.toml's
# own "Abilities" comment: all land in the same "abilities" key, but TOML's `[[entity.abilities]]`
# array-of-tables syntax can only ever hold tables, so mixing in a bare-string reference has to
# use the flat-list-with-inline-tables form instead (the first Pathfinder conversion in this file
# to actually need both at once). "short sword" is inlined here (rather than left as a bare
# string like "light crossbow") specifically so its own damage_bonus_if_condition (sneak attack)
# applies only to this entity's copy, not to every other wielder of the shared equipment.toml item.
