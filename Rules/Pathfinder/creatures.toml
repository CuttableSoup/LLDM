# wolf/bandit/giant spider/skeleton warrior/the bone warden used to live here, but every one
# of them was test/placeholder content, not a finished creature meant to be shared across
# scenarios -- each now lives solely as a local [[entity]] table in debug.toml, the one scenario
# file that actually uses it. "fire elemental", "wraith", "troll", and
# "spectral wolf" all stay here -- none is owned by any scenario (all four referenced directly
# by test_unit.py's own tests instead, "spectral wolf" also by spells.toml's own "summon
# spectral wolf"), so there's no scenario file for any of them to move into. "wild boar"/
# "coyote" are here for the same reason environments.toml's "plains" environment references
# them from its own day/night encounter tables (see docs/downtime.md's "Travel") -- a shared,
# setting-wide environment table needs shared, setting-wide creatures to resolve to, regardless
# of which scenario the player is actually in when the roll happens. "pickpocket" is here for the
# same reason -- a generic archetype any scenario/encounter table can reference, the shipped
# worked example for [[entity.behavior]]'s own "steal"/"gift" action (see
# DM_Combat.py's TRANSFER_ACTIONS/_resolve_transfer_behavior). "horse" is here for the
# same "not owned by any one scenario" reason -- it's meant to be addable to any party, in any
# scenario, as overland transport, not tied to wherever it happens to first show up. It's the
# first entity to actually author "travel_speed" (see reference/entity_schema.toml and
# DM_Travel.py's _party_travel_speed) -- that field alone doesn't do anything yet just by sitting
# in the scene or a party's own roster; wiring an owned/ridden horse into the player's own
# effective travel_speed is a follow-up, not part of this entity definition.

[[entity]]
name = "fire elemental"
supertype = "creature"
subtype = "elemental"
description = "A churning column of living flame, molten cracks glowing across its body."

max_hp = 30

# Absolute, tag-matched block -- no roll, fire damage is simply negated (notes.txt's
# "poison damage tagged so undead are immune" example, applied to fire).
immunity_tags = [ "fire" ]
# Partial, rolled reduction against non-fire physical damage -- same shape as an item's
# armor_value/armor_tags, just innate to the creature instead of worn equipment. ("physical" was
# dropped from this list -- no shipped weapon ever tags its own damage that generically, only
# the three specific types below, so it never matched anything.)
resistance_value = { dice = 2, pips = 0 }
resistance_tags = [ "piercing", "bludgeoning", "slashing" ]
# Mirror image of resistance_value/resistance_tags: rolled bonus damage instead of
# reduction, on a matching tag -- a fire elemental takes extra damage from water. Not a real
# Pathfinder Bestiary trait (core elementals are immune to their own element but have no written
# vulnerability to the opposing one) -- kept anyway as deliberate genre flavor, and because
# TestDamageCalculation's own test_immunity_overrides_vulnerability_when_both_tags_present relies
# on this exact fire/water pairing to exercise a real, unrelated engine rule (immunity always wins
# over vulnerability) without a dedicated dummy fixture.
vulnerability_value = { dice = 2, pips = 0 }
vulnerability_tags = [ "water" ]

[[entity.abilities]]
name = "flame touch"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "fire" ]
damage_value = { dice = 3, pips = 0, bonus = 0 }

[entity.skills]
fortitude = { dice = 4, pips = 0 }
willpower = { dice = 3, pips = 0 }
reflexes = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
strength = { dice = 4, pips = 0 }
brawling = { dice = 4, pips = 0 }

[[entity]]
name = "wraith"
supertype = "creature"
subtype = "undead"
description = "A robed, faceless shape of cold shadow, drifting a hand's breadth above the ground."

max_hp = 24

# A wraith is Incorporeal, not DR/silver -- corrected from an earlier version of this entry that
# used "silver" (a lycanthrope trait Pathfinder never gives a wraith) and predates the Pathfinder
# split ever reconciling it against reference/pathfinder_mapping.toml's own condition_pattern "F"/
# "Incorporeal" row. Real Incorporeal creatures are harmed normally by magic weapons/effects but
# have a real chance to shrug off an ordinary one entirely -- resistance_value/resistance_tags/
# resistance_bypass_tags (DM_Combat.py's get_damage_reduction) is this engine's own closest
# working primitive for that (a rolled reduction a matching "magic" tag skips outright), the same
# "don't try to force an exact PF percentage/number" latitude the mapping doc's own "Energy
# Resistance N"/"Vulnerability" rows already claim for their own rolled stand-ins. An enchanted
# blade's own damage_tags would be ["slashing", "magic"] -- the "slashing" tag alone still
# matches resistance_tags below on an ordinary weapon, but "magic" short-circuits the reduction
# entirely once present.
resistance_value = { dice = 3, pips = 0 }
resistance_tags = [ "slashing", "piercing", "bludgeoning" ]
resistance_bypass_tags = [ "magic" ]

[entity.skills]
brawling = { dice = 4, pips = 0 }
dodge = { dice = 3, pips = 0 }
willpower = { dice = 4, pips = 0 }
fortitude = { dice = 3, pips = 0 }

[[entity.abilities]]
name = "chilling claw"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "cold" ]
damage_value = { dice = 2, pips = 0, bonus = 0 }

[[entity.abilities]]
name = "life drain"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "negative" ]
damage_value = { dice = 4, pips = 0, bonus = 0 }

# Checked first (declaration order): favors draining an already-wounded target over its plain
# claw -- opponent_has_condition reads the *target's* own active_conditions, not the wraith's,
# so this only fires once the fight has already gone the wraith's way.
[[entity.behavior]]
requirements = [
    { field = "has_condition:warded", operator = "==", value = false },
    { field = "opponent_has_condition:wounded", operator = "==", value = true },
]
action = "life drain"

# The ordinary fallback attack -- both entries share the same "warded" gate (below), so a
# holy symbol's ward suppresses the wraith's turn entirely rather than just its preferred
# attack, the same "no matching entry = no action" fallback an entity with no behavior list at
# all already gets.
[[entity.behavior]]
requirements = [
    { field = "has_condition:warded", operator = "==", value = false },
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "chilling claw"

[[entity]]
name = "troll"
supertype = "creature"
# Pathfinder's own creature type is "giant", not "monstrous humanoid" -- corrected along with
# skills.toml's own "survival" lore_types (Knowledge (nature) covers giants in Pathfinder, the
# same way it already covers animals), so a lore check on a troll now rolls survival rather than
# the wrong skill entirely.
subtype = "giant"
description = "A gangly, warty brute with a lantern jaw and long, ragged claws -- its wounds already knitting shut as it advances."

max_hp = 40

# Seeded permanently, not gained mid-fight -- a troll simply *is* a regenerator, the same way
# [entity.conditions.locked]/.closed seed a chest's starting state (see DM_Rules.py's
# _instance_entities: active_conditions is copied fresh from this per instance). See
# rules.toml's own "regenerating" [[condition]] entry (upkeep_heal = 2D per round, suppressed
# any round it's tagged "fire" -- the shipped generic-per-round-upkeep-hook example; run_round_
# upkeep, DM_Status.py) and TestRoundUpkeep in test_unit.py for the fire-suppression case.
[entity.conditions.regenerating]
duration = "permanent"

# A troll's temper. Dropping under half HP without having been burned first (recent_damage_tags, the
# same set "regenerating"'s own upkeep_blocked_by_tags already reads) makes it lash out harder;
# "enraged" (rules.toml) is what actually gives that real teeth (a +1D bonus), not just flavor.
[entity.on_damage]
if = { all = [ "target.hp_per_remain < 0.5", "target.has_condition:enraged == false" ] }
then = { do = "condition", entity = "target", name = "enraged", duration = "rounds", length = 5 }

[entity.skills]
strength = { dice = 5, pips = 0 }
brawling = { dice = 4, pips = 0 }
fortitude = { dice = 4, pips = 0 }
dodge = { dice = 2, pips = 0 }

[[entity.abilities]]
name = "rend"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "slashing" ]
damage_value = { dice = 3, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [ { field = "hp_per_remain", operator = ">=", value = 0.01 } ]
action = "rend"

[[entity]]
name = "spectral wolf"
supertype = "creature"
subtype = "elemental"
description = "A translucent, silver-limned wolf conjured from raw magic -- here to fight, and gone once the spell fades."

max_hp = 16

# A non-hostile default is what actually makes this an *ally* rather than a monster: an entity
# with no [entity.attitudes] table at all defaults to hostile unconditionally (see CLAUDE.md's
# "Combat" -- the same reason debug.toml's wolf, with no attitudes table of its own, always
# fights). is_hostile only reaches true hostility at disposition <= -100, so a flat positive
# default here reads as a firm ally instead. spells.toml's "summon spectral wolf" is the only
# thing that ever instances this template (via DM_Summoning.py's _summon_creature); nothing
# else in the shipped data references it.
[entity.attitudes]
default = [ 100, 100, 100 ]

[entity.skills]
brawling = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
fortitude = { dice = 2, pips = 0 }

[[entity.abilities]]
name = "spectral bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "cold" ]
damage_value = { dice = 2, pips = 1, bonus = 0 }

# An ally's own behavior attacks self.current_target, not the player -- see is_hostile's own
# two branches (CLAUDE.md's "Combat"). No "retreat" entry: a conjured spell effect has nothing
# to lose by fighting to the end, unlike debug.toml's wolf (which flees below 40% hp_per_remain
# to value its own life).
[[entity.behavior]]
requirements = [ { field = "hp_per_remain", operator = ">=", value = 0.01 } ]
action = "spectral bite"

[[entity]]
name = "wild boar"
supertype = "creature"
subtype = "animal"
description = "A heavyset, bristling boar, tusks lowered and ready to charge."

max_hp = 20

[[entity.abilities]]
name = "gore"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 2, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.30 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "gore"

[entity.skills]
fortitude = { dice = 3, pips = 0 }
reflexes = { dice = 1, pips = 0 }
dodge = { dice = 1, pips = 0 }
strength = { dice = 3, pips = 0 }
brawling = { dice = 3, pips = 0 }

[[entity]]
name = "coyote"
supertype = "creature"
subtype = "animal"
description = "A lean, rangy coyote, keeping its distance until it senses weakness."

max_hp = 10

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.50 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
reflexes = { dice = 3, pips = 0 }
dodge = { dice = 4, pips = 0 }
strength = { dice = 2, pips = 0 }
brawling = { dice = 3, pips = 0 }

# Pathfinder Bestiary's giant rat -- the shipped disease-vector worked example
# (reference/pathfinder_mapping.toml's Poison/Dying-Stable-Disabled rows):
# on_hit_condition applies rules.toml's own "filth fever" unconditionally on a landed bite (see
# that condition's own comment for why exposure itself is unconditional, with onset/frequency
# doing the real work of "did it actually take hold").
[[entity]]
name = "giant rat"
supertype = "creature"
subtype = "animal"
description = "An oversized, mangy rat, its bite carrying more than just pain."
max_hp = 6

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = 0 }
on_hit_condition = { condition = "filth fever", chance = 100, duration = "permanent" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
brawling = { dice = 2, pips = 0 }
dodge = { dice = 3, pips = 0 }
fortitude = { dice = 1, pips = 0 }

[[entity]]
name = "horse"
supertype = "creature"
subtype = "animal"
description = "A broad-backed saddle horse, ears flicking toward every sound -- calm around a steady hand, quick to bolt from a fight."

max_hp = 24

# Pathfinder's own overland movement table pairs a 50 ft base speed (a combat-trained/heavy
# horse's own) with 40 miles/day at a normal pace -- not simply double rules.toml's own
# [travel] default_speed (24, a 30 ft baseline's own 24 miles/day), a coincidence of the old
# default_speed = 4 this would have equaled 8 under, not a fixed 2x multiplier of whatever
# default_speed happens to be.
travel_speed = 40

# Skittish, not vicious: a positive disposition (won't attack unprovoked, unlike wild boar/
# coyote's unauthored hostile default) paired with a fearful threat axis -- see its own
# "retreat" behavior entry below, which triggers far earlier than a wild predator's.
[entity.attitudes]
default = [ 20, -30, 10 ]

[entity.skills]
strength = { dice = 4, pips = 0 }
fortitude = { dice = 3, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 2, pips = 0 }
brawling = { dice = 2, pips = 0 }

[[entity.abilities]]
name = "kick"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "bludgeoning" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

# Bolts well before it's in real danger -- a wild boar/coyote fights until under 30-50%
# hp_per_remain; a horse breaks and runs at anything less than a clean majority of its health.
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.60 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "kick"

[[entity]]
name = "pickpocket"
supertype = "creature"
subtype = "humanoid"
description = "A quick-fingered street thief, eyes darting for an opening -- not looking for a fight, just an opportunity."

max_hp = 8

# Wary, not hostile -- a pickpocket wants your coin, not a fight, so it authors no attack
# ability at all, only "steal"/"retreat" below. A real (if mild) positive disposition, unlike
# wild boar/coyote's unauthored hostile default, is what actually keeps is_hostile false here.
[entity.attitudes]
default = [ 10, -20, 0 ]

[entity.skills]
stealth = { dice = 4, pips = 0 }
dodge = { dice = 3, pips = 0 }
fortitude = { dice = 1, pips = 0 }

# The shipped worked example for [[entity.behavior]]'s own "steal" action
# (DM_Combat.py's TRANSFER_ACTIONS/_resolve_transfer_behavior) -- "item" = "currency" is the
# same reserved sentinel DM_Inventory.py's player-driven "take"/"trade" already use for money
# rather than a named inventory item; "amount" caps it at a modest sum rather than the
# transfer_currency default of "everything the target has" (too punishing for an ambush a
# player didn't choose to walk into, unlike the player's own deliberate "take"). Retreats the
# instant it's actually hit (hp_per_remain drops below 0.90 on an 8-HP creature -- just about
# any landed blow at all) rather than fighting on, the self-preservation instinct wild boar/
# coyote/the horse above all share, just triggered far earlier -- a pickpocket that gets caught
# runs, it doesn't stick around to trade blows. Declaration order means it only ever tries to
# steal while still fully unengaged; nothing here stops it from trying again next round if the
# player keeps missing -- a persistent thief pressing its luck is the point, not a bug.
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.90 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "steal"
item = "currency"
amount = 10

# The first genuine Pathfinder Bestiary 1 monster-stat-block conversion in this file (as opposed
# to reused Fantasy flavor creatures like wolf/coyote/giant rat above) -- Bestiary 1 (3rd
# printing) p.156, "Goblin" (Goblin warrior 1), CR 1/3, XP 135. Worked example for a general
# stat-block conversion method this file didn't have one for yet (reference/pathfinder_
# mapping.toml's own recipes only cover special mechanics/conditions, not a baseline creature's
# ordinary attack/save/AC numbers):
#   - A flat PF bonus (attack bonus, save bonus, a skill bonus) converts to this engine's own
#     pip-unit rating via rating = bonus + 1, then dice = rating // 3, pips = rating % 3 -- this
#     is exactly the arithmetic equipment.toml's own shipped "AC bonus -> D6 code" table already
#     encodes (bonus=1 -> 0D+2 = rating 2; bonus=9 -> 3D+1 = rating 10), just generalized past
#     armor specifically and past the table's own +1..+9 range. A negative PF bonus (this
#     goblin's own Will -1) floors at untrained (0D+0, simply omitted) rather than a negative
#     rating, the same "a real weak save reads as untrained" precedent Challenge_Rating.py's own
#     save-averaging already leans on.
#   - Melee/ranged attack bonus converts straight to the matching weapon's own skill (short
#     sword +2 -> blades rating 3 = 1D+0; short bow +4 -> missiles rating 5 = 1D+2) -- PF's
#     attack bonus already blends BAB/ability mod/size into one number, exactly the same "how
#     good is this creature at landing this specific attack" role a D6 skill rating plays.
#   - AC splits into two independently-converted layers rather than one combined dodge rating,
#     to avoid double-counting gear this engine already prices separately: touch AC (13 -- Dex/
#     size/deflection only, no armor/shield) converts to dodge (bonus over the baseline 10 -> 3
#     -> rating 4 = 1D+1), while the armor/shield's OWN AC contribution (16 - 13 = 3, exactly
#     matching leather armor's +2 and the light wooden shield's +1) is left to those items' own
#     already-shipped armor_value once actually equipped, not folded into dodge a second time.
#   - Saves convert 1:1 by category (Fort/Ref/Will -> fortitude/reflexes/willpower), no
#     ability-score derivation needed since the category mapping is already exact.
#   - max_hp passes through directly (PF's own small-HD hp pools already sit on roughly the same
#     numeric scale creatures.toml's own giant rat/coyote/horse already use at this tier -- no
#     scaling factor needed, at least not yet at the low end of the CR range).
#   - Both weapons are named abilities (like debug.toml's own bandit), not equipped items --
#     _best_offense_package/get_challenge_rating already reads a resolved ability's own
#     damage_value regardless of equip state, and this is what lets [[entity.behavior]] pick
#     between them by range without an equip-slot conflict (both want "rhand").
[[entity]]
name = "goblin"
supertype = "creature"
subtype = "goblinoid"
description = "A scrawny, wide-headed humanoid barely three feet tall, its short sword and short bow both looking two sizes too big for it."

max_hp = 6

inventory = [ "short sword", "short bow", "leather armor", "light wooden shield" ]
abilities = [ "short bow", "short sword" ]

[entity.equipped]
chest = "leather armor"
lhand = "light wooden shield"

# Goblins are cowardly alone but vicious in numbers (Bestiary 1's own "gang (4-9)"/"warband"
# organization) -- retreats the instant it's actually hurt at all (any real hit against 6 hp),
# the same self-preservation shape debug.toml's own pickpocket already uses for the same reason
# (a lone, low-hp creature with nothing to prove).
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.85 },
]
action = "retreat"

# Favors its short bow at range, falling back to its short sword once a target closes to melee
# -- the exact same distance-gated ranged/melee split debug.toml's own bandit already uses.
[[entity.behavior]]
requirements = [
    { field = "distance_to_target", operator = ">", value = 0 },
]
action = "short bow"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "short sword"

[entity.skills]
blades = { dice = 1, pips = 0 }
missiles = { dice = 1, pips = 2 }
dodge = { dice = 1, pips = 1 }
fortitude = { dice = 1, pips = 1 }
reflexes = { dice = 1, pips = 0 }
stealth = { dice = 3, pips = 2 }

# Bestiary 1 (3rd printing) p.183, "Kobold" (Kobold warrior 1), CR 1/4, XP 100. Same
# stat-block conversion method as "goblin" above -- attack/save bonuses through rating = bonus +
# 1, touch AC (12) to dodge, real AC (+2 armor) to an equipped item, natural armor (+1) skipped
# as too small to matter (the same call already made for the animals below rather than
# inflating every low-CR entry with a token resistance_value). Weakness "light sensitivity"
# (page 301 of the same book) isn't modeled -- the engine has no ambient light-level state for a
# conditional penalty to key off. subtype = "humanoid", not the real "humanoid (reptilian)" --
# no equip_slot entry exists for "reptilian" (rules.toml's own table only recognizes humanoid/
# goblinoid/undead/animal/elemental), and a kobold wears armor and wields weapons exactly like
# any other small humanoid, so the generic slot list already fits.
[[entity]]
name = "kobold"
supertype = "creature"
subtype = "humanoid"
description = "A short, reptilian humanoid with scaled skin, a snout full of tiny teeth, and a long tail."

max_hp = 5

inventory = [ "spear", "sling", "leather armor" ]
abilities = [ "spear", "sling" ]

[entity.equipped]
chest = "leather armor"

# Cowardly and scheming (Bestiary flavor: "never fight fair if they can help it") -- retreats
# the instant it's actually hurt, same shape as goblin's own early retreat.
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.85 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "distance_to_target", operator = ">", value = 0 },
]
action = "sling"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "spear"

[entity.skills]
polearms = { dice = 0, pips = 2 }
missiles = { dice = 1, pips = 1 }
dodge = { dice = 1, pips = 0 }
fortitude = { dice = 1, pips = 0 }
reflexes = { dice = 0, pips = 2 }
stealth = { dice = 2, pips = 0 }

# Bestiary 1 (3rd printing) p.222, "Orc" (Orc warrior 1), CR 1/3, XP 135. Defensive Ability
# "ferocity" (fights on below 0 HP) needs no modeling at all -- reference/pathfinder_
# mapping.toml's own "Ferocity" row calls this the engine's default behavior for any entity
# with no explicit "retreat" entry, which is exactly how this entity is authored (no retreat
# threshold anywhere below). Weakness "light sensitivity" skipped for the same reason as
# kobold's own. subtype = "humanoid" -- orc's real Pathfinder type is bare "humanoid (orc)",
# and there's no "orc" equip_slot entry, so the generic humanoid slot list is what actually
# lets it wear/wield anything.
[[entity]]
name = "orc"
supertype = "creature"
subtype = "humanoid"
description = "A savage, bestial parody of a human, green-gray skin stretched over a heavy brow and greasy black hair."

max_hp = 6

inventory = [ "falchion", "javelin", "studded leather armor" ]
abilities = [ "falchion", "javelin" ]

[entity.equipped]
chest = "studded leather armor"
rhand = "falchion"

[[entity.behavior]]
requirements = [
    { field = "distance_to_target", operator = ">", value = 0 },
]
action = "javelin"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "falchion"

[entity.skills]
blades = { dice = 2, pips = 0 }
throwing = { dice = 0, pips = 2 }
dodge = { dice = 0, pips = 1 }
fortitude = { dice = 1, pips = 1 }
reflexes = { dice = 0, pips = 1 }
intimidation = { dice = 1, pips = 0 }

