# ============================================================================================
# Mind-affecting control -- Phase 1's second batch (see rules.toml's own comment block right
# before its matching new conditions for the shared "why prevents_action, why these names" story).
#
# Effect-value methodology diverges from the damage and buff batches here on purpose: Pathfinder
# gives "you can't act at all" or "your mind is no longer your own" no numeric magnitude the way
# a damage die or a +N attribute bonus has one, so the D6 Fantasy Rulebook's own explicit fallback
# applies instead ("when the spell offers a general effect... the gamemaster will have to make up
# levels of success," p.86) -- Effect = 3 x the spell's own Pathfinder level (floor 1), then scaled
# by a type multiplier: x2.0 for full incapacitation/mind-override (Pattern A prevents_action,
# override_target) since losing your turn outright is as strong an effect as this engine has;
# x1.0 for a Pattern C fear/ability-penalty condition (a modifier, not a full loss of agency);
# x1.5 for a permanent drain or an attitude-shift compulsion (between the two). This is a
# documented authorial judgment call, not derived from a D6 Fantasy table entry the way the
# damage/buff batches' own multipliers were -- flagged here so it reads as a choice, not a fact.
#
# Two real Pathfinder effects were dropped from this batch rather than faked: Dominate Person/
# Monster (the caster names an arbitrary target for the dominated creature to attack, a per-cast
# dynamic value no static TOML condition can express -- pathfinder_mapping.toml's own "Mind-
# affecting control" row already flagged this exact gap) and Suggestion/Charm's own "compels a
# specific course of action" half (modeled here as an ordinary attitude-shift instead, the same
# honest simplification pathfinder_mapping.toml's own row already accepts for Charm-tier effects
# -- real free-form command compliance stays a narrative/ADaM question, not an engine primitive).
# ============================================================================================

