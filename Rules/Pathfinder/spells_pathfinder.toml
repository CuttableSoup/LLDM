# Pathfinder 1e Sorcerer/Wizard spell list, converted to this engine's D6 format using the D6
# Fantasy Rulebook's own point-buy spell-design system (Chapter XII: Magic) as the source of
# each spell's `difficulty`, rather than a hand-picked number the way items.toml's own shipped
# "fireball" was. A separate catalog from spells.toml on purpose, same reason equipment.toml
# split off from items.toml: spells.toml stays the small, hand-authored set the debug scenario
# actually references; this file is the bulk conversion pass.
#
# Scope: only the DIRECT-DAMAGE spells on the Sorcerer/Wizard list (0th-8th level) converted so
# far -- illusions, buffs/debuffs, summons, polymorphs, and utility spells (the large majority of
# the list) are NOT here yet. Each of those needs its own [[condition]]/[[status]] authoring the
# way Rules/Fantasy/reference/pathfinder_mapping.toml's condition_pattern/spell_mechanic sections
# already worked out category-by-category -- a flat damage-dice conversion can't honestly capture
# "makes one person your friend" or "turns you into a Large dragon", so those are left for that
# pass rather than faked here. Two spells from this list are skipped outright because
# Rules/Fantasy/spells.toml already ships an equivalent under the same name: "fireball" and
# "wall of fire" (the latter as the summon-based hazard shape, not a direct-damage spell at all).
# A further handful of damage-*mentioning* spells were excluded even though a plain-text search
# would flag them, because the damage is incidental to a different primary effect this pass
# doesn't yet model: black tentacles/mage's faithful hound (grapple/summon), fire trap (a warding
# trap, not a cast-and-forget spell), the form of the dragon line (polymorph -- see
# pathfinder_mapping.toml's own "form" condition field), mage's sword/clenched fist/crushing hand
# (a force effect that keeps attacking across multiple rounds -- no engine primitive for that, the
# same gap pathfinder_mapping.toml's own "Multiple natural attacks" row already flagged), symbol
# of weakness (a triggered rune/ability-damage trap), and transmute rock to mud (a terrain spell).
#
# ============================================================================================
# Conversion method
# ============================================================================================
#
# Caster level: each spell uses ITS OWN natural Pathfinder minimum caster level for a
# sorcerer/wizard (2 x spell level - 1 -- level 1 for a 1st-level spell, 5 for 3rd-level, 15 for
# 8th-level, etc.), not a flat level. This was a deliberate calibration choice (see conversation
# history): the raw D6 Fantasy formula is accepted as-is rather than compressed, so a spell's
# difficulty naturally follows Pathfinder's own power curve -- a cheap cantrip floors out at the
# system's own minimum difficulty of 10, while a genuinely powerful high-level spell (Sunburst,
# Incendiary Cloud) becomes something a starting character truly cannot cast yet, the same way
# Pathfinder itself gates it behind character level.
#
# Effect: the spell's PF damage dice at that caster level (applying its own "per level, maximum
# NdM" scaling) converted to the nearest D6 {dice, pips} by average damage -- same nearest-average
# method equipment.toml's own header documents, extended past a single die to arbitrary dice
# pools (dice*3.5 + pips vs. the PF average). That D6 code becomes the spell's own damage_value
# AND feeds the D6 Magic formula's own "Effect" line (value = dice*3 + pips, x1.0 for a
# stand-alone damage effect -- see the Vade Mecum's own "Value Characteristic Type Multiplier"
# table).
#
# Range/Speed: PF's own range in feet (at that caster level, for a scaling range like "close
# 25 ft. + 5 ft./2 levels") converted to meters and looked up on the D6 Fantasy "Spell Measures"
# table (rounding UP to the next available code so a real spell's reach is never undersold).
# Speed is always set equal to Range (an instant, accurate hit -- every converted spell here is
# exactly that shape).
#
# Duration: instantaneous unless the spell has a real lingering duration; value 0 for
# instantaneous, matching the rulebook's own stated minimum.
#
# Area Effect: a spell with a burst/spread/cone/line converts its own radius (or length, for a
# cone/line -- both approximated as a sphere-shaped burst of that reach, since this engine's own
# `targets.aoe` doesn't distinguish shapes) to meters, priced at +5 per meter of radius (the
# rulebook's own default sphere cost) and added straight into the Spell Total.
#
# Casting Time / Components (negative modifiers): "1 standard action" -> -4 (the "1 round"
# Spell Measures code); Verbal -> Incantation -1 (a few words); Somatic -> Gesture -1 (simple);
# a Material component -> Components -6 (-3 for an ordinary/common reagent, doubled since it's
# consumed in casting). No spell in this batch has Concentration, Community, Charges, or any of
# the rarer optional aspects, so none of those modifiers appear here.
#
# Final: (Spell Total + Negative Modifiers), floored at 20, divided by 2 and rounded up = this
# entry's own `difficulty`. Multi-instance effects (Magic Missile's extra missiles, Scorching
# Ray's extra rays) are folded into ONE combined damage_value at the natural caster level rather
# than modeled as separate rolls -- the same "approximate with a single ability" precedent
# pathfinder_mapping.toml's own creature_ability section already set for multiple natural
# attacks in one action. A line/cone/persistent-AoE spell (Lightning Bolt's line, Acid Fog's
# per-round lingering damage) is likewise flattened to this engine's ordinary one-shot AoE burst
# shape (`targets = {number=0, aoe, side="all"}`, matching items.toml/spells.toml's own shipped
# "fireball") rather than inventing a new shape or a persistent hazard entity for each one.
#
# engine `range`/`targets.aoe` (in bands) are a SEPARATE conversion from the D6 Magic Range/Area
# values above -- those only ever feed the difficulty formula. The entity's own gameplay range
# uses the same ~16 ft/band scale equipment.toml's own header established (calibrated against
# spells.toml's shipped fireball: range = 5 bands there for its own 20-ft blast radius).

