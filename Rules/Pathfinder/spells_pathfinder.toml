# ============================================================================================
# Attribute/skill buffs -- Phase 1 of the non-damage conversion pass (see the plan this session
# produced: buffs, mind-affecting control, dispel/cure, and triggered wards are the categories
# with an already-built, already-documented engine primitive and no new-creature-content
# dependency; illusions/teleportation/polymorph/summon are separate follow-on batches).
#
# Each casts a rules.toml [[condition]] onto the target via on_hit_condition -- the same
# self-buff shape this file's own sibling spells.toml already ships ("wild shape": a flat,
# unopposed `difficulty` check, no damage_value at all, on_hit_condition firing on any successful
# cast regardless of whether anything was actually "hit"). Difficulty uses the D6 Magic formula's
# own x1.5 "skill modifier" multiplier on the Effect line (a condition.modifier is a modifier to
# an existing skill, not a stand-alone new one -- see the Vade Mecum's own Value Characteristic
# Type Multiplier table), everything else identical to the damage-spell pass: each spell's own
# natural Pathfinder minimum caster level, Range/Duration off the Spell Measures table, Casting
# Time/Gesture/Incantation/Components as negative modifiers, floored at a Final Spell Total of 20.
# A "Mass" variant adds the Multiple Targets aspect (+3 per target, counted at that spell's own
# natural caster level) rather than a second bespoke Effect -- same underlying condition, just
# landing on more targets at once, which is exactly what "mass" means in Pathfinder too.
# ============================================================================================

