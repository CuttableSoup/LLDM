# "suggestion" itself is skipped here -- spells.toml already ships it (difficulty 10).

# ============================================================================================
# Dispel/cure and triggered wards -- Phase 1's third and last batch. Far fewer spells qualified
# here than the original plan estimated: most of Pathfinder's "remove curse/disease/paralysis,
# neutralize poison" cure line turned out to belong to the cleric/druid/paladin/ranger lists, not
# sorcerer/wizard -- the wizard list itself only has Remove Curse. Antimagic Field was looked at
# and dropped: it's a standing zone that suppresses every magical effect within it for its whole
# duration, not a one-shot dispel, and this engine has no "suppress every condition in a radius"
# primitive to approximate that with honestly (a one-shot AoE dispel would drop the "standing
# zone" identity entirely, not just simplify it).
#
# Dispel Magic, Greater has no `difficulty` at all, matching spells.toml's own shipped "dispel
# magic" exactly -- both resolve as an ordinary OPPOSED roll against the target's own defenses
# (arcane's own skills.toml "opposes" list), not a flat D6-Magic-formula check. That's this
# engine's existing, deliberate precedent for `dispel` specifically (a real contest against
# whatever's being unraveled), so it's followed here rather than overridden with a computed
# number the way a flat-check spell gets one.
#
# The seven Symbol of X spells are wards, not direct-cast effects -- each needs the same
# three-part shape spells.toml's own "wall of fire"/"flame wall" pair already established: a
# spell that `summon`s a placed hazard object, a matching [[status]] `on_arrival` trigger that
# lands a condition on whoever sets it off, and `self_dismiss` so it's a one-shot discharge, not
# a repeating trap (items.toml's dart trap's own "armed"/self_dismiss shape). Difficulty reuses
# the mind-affecting batch's own type-multiplier convention against each symbol's own Pathfinder
# level (3 x level x multiplier), but Casting Time here is the real 10-minutes-to-inscribe value
# (-14, not the ordinary standard-action -4) plus a "very rare" destroyed-material cost (-10, not
# the "common" -6 used elsewhere) -- real Symbol spells use powdered gems and rare inks. The two
# together are large enough that every symbol floors at the system's own minimum difficulty of
# 10-11 regardless of how severe its landed effect is. That's a real, worth-naming property of
# the formula at this extreme (a slow, expensive ritual is priced as *easier to actually cast*
# than a snap decision would be, which is the D6 point-buy system's own internal logic, not a
# mistake) -- flagged here rather than quietly accepted, the same way Sunburst's difficulty of 79
# was flagged rather than hidden. Symbol of Death's own "instant death below 150 hp, else 10d6"
# is narrowed to just the 10d6 half -- the same "drop the hp-threshold clause" simplification the
# mind-affecting batch already applied to the Power Word line (excluded from that batch entirely
# for the same reason).
# ============================================================================================

[[entity]]
name = "dispel magic, greater"
supertype = "spell"
subtype = "abjuration"
description = "Unravel several nearby magical effects at once, banishing them outright."
skill = "arcane"
range = 9
targets = { number = 4, aoe = 0 }
dispel = { supertypes = [ "spell" ], subtypes = [ "spell" ] }

[[entity]]
name = "remove curse"
supertype = "spell"
subtype = "abjuration"
description = "Lift a standing curse from a person or object."
skill = "arcane"
difficulty = 10
targets = { number = 1, aoe = 0 }
cure = { subtypes = [ "curse" ] }

[[entity]]
name = "rune of sleep"
supertype = "object"
subtype = "spell"
max_hp = 10
immunity_tags = [ "any" ]

[entity.conditions.armed]
duration = "permanent"

[[status]]
name = "rune of sleep trigger"
trigger = "on_arrival"
requirements = [
    { field = "name", operator = "==", value = "rune of sleep" },
    { field = "has_condition:armed", operator = "==", value = true },
]
apply = { condition = "asleep", duration = "rounds", length = 18, radius = 0, side = "all" }
self_dismiss = "armed"

