name = "spear"
supertype = "object"
subtype = "weapon"
skill = "polearms"
description = "A long-hafted spear, its iron head kept honed for thrusting."
equip_slot = "rhand"
max_hp = 8
# Reach weapon -- usable one band beyond plain melee (see DM_Movement.py's "Movement and
# range"), the one deliberate exception to "melee only works in the same band as the target".
