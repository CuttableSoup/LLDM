# ============================================================================================
# Adventuring gear, alchemical items, tools, clothing, food, and trade goods (Table 6-9 and
# Table 6-3), added in a follow-up pass to the weapons/armor above. Most of this is genuinely
# flavor-only in this engine -- no skill check, damage roll, or condition hooks onto a torch or
# a peasant's outfit -- but it's still worth having as plain [[entity]] objects (bulk + value +
# a subtype) so a shop or loot table can actually stock them, the same role items.toml's own
# "iron ingot"/"leather strip" crafting materials already play.
#
# Renamed on collision with an existing name elsewhere in this setting's own catalog: PF's plain
# "Chest" -> "storage chest" (items.toml's own "chest" is the locked debug-scenario treasure
# chest); PF's plain "Vial" is skipped outright rather than renamed -- items.toml's own
# "glass vial" already covers that exact object (the empty husk left behind by a drunk health
# potion).
#
# subtype is a new, purely descriptive value per category (gear/alchemical/tool/clothing/food/
# trade_good) -- nothing in the engine gates on it, same non-enforcement as "shield" above.
# A few gain a real engine hook where it costs nothing extra to add: "backpack"/"sack"/
# "belt pouch"/"map case"/"storage chest" get container_capacity (this engine's own bounded-
# container primitive, items.toml's own shipped "bag of holding"); "wizard's spellbook" gets
# container_allowed_supertypes = ["spell"] (matching items.toml's own shipped "spellbook", which
# this reuses the exact same restriction from rather than inventing a second one); "signet ring"
# gets equip_slot = "ring" (a real, already-defined slot with nothing else claiming it); clothing
# gets equip_slot = "chest" -- narratively you wear an outfit OR armor, never both, the same
# single-slot contention that's already true of any two chest-slot items.
#
# Out of scope entirely, left for a human call rather than half-modeled:
#   - Mounts and vehicles (horses, carts, ships) -- these aren't inventory objects at all in
#     this engine's own model (see docs/downtime.md's "Mounts and conveyance" -- a mount is a
#     live creature entity with its own "mount" field, a cart/wagon likewise), so converting
#     them belongs with that subsystem, not a flat items.toml-style catalog entry.
#   - "Spellcasting and Services" (hireling wages, tolls, ship's passage, paying an NPC
#     spellcaster) -- pure narrative pricing information, never an object anyone carries.
#   - Multiple lock/manacle quality tiers, masterwork tool variants, and armor special
#     materials (adamantine/mithral/cold iron/darkwood/dragonhide/alchemical silver) -- real
#     PF depth with no engine mechanic to attach to (no crafting-quality axis, no damage-
#     reduction-bypass-by-material distinct from what resistance_bypass_tags/
#     armor_bypass_tags already cover generically) beyond what a GM could already reflavor an
#     existing entry as.
#
# Four alchemical splash weapons (acid, alchemist's fire, holy water, thunderstone) keep a real
# damage_value instead of going flavor-only, converted the same way as an ordinary weapon
# (nearest-average PF-die-to-D6-code, skill = "throwing", range = 1 matching this file's own
# 10 ft -> 1 band anchor) -- an honest simplification of PF's own ranged-touch-vs-flat-AC-5
# mechanic, which this engine has no equivalent of, so it resolves as an ordinary opposed
# throwing check instead. Secondary/recurring effects are dropped rather than half-modeled:
# alchemist's fire's follow-up burn, holy water's undead/evil-outsider-only bonus damage, and
# thunderstone's deafen-on-failed-save (it just deals a small sonic hit here instead). The
# remaining alchemical items (antitoxin, everburning torch, smokestick, sunrod, tanglefoot bag,
# tindertwig) stay flavor-only -- each needs its own bespoke mechanic (a temporary saving-throw
# bonus, a light source, a concealment cloud, an entangle condition) that a flat damage
# conversion can't honestly capture, the same "needs a human call" treatment "net" already got
# in the weapons section above.

# ---- Adventuring gear ----
