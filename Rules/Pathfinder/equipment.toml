# Pathfinder 1e Core Rulebook (Chapter 6: Equipment) weapons/armor/shields, converted to this
# engine's D6 format, PLUS (from the "Merged from items.toml" divider on down) the small,
# hand-curated set of narrative items the debug scenario actually references -- potions, locked
# containers, traps, crafting materials, a spellbook, a bag of holding, a warding glyph. The two
# used to be separate files (items.toml deliberately kept apart from this one's own bulk PF
# conversion pass) but items.toml was never actually Pathfinder-sourced content to begin with --
# every entry in it was written purely to exercise an engine mechanic (a container, a trap, a
# craftable good) for the debug scenario, not converted from any Chapter 6 table the way
# everything above the divider is -- so keeping it a separate top-level catalog stopped making
# sense once this file existed at all, and it was folded in here rather than left as a second,
# smaller "equipment-shaped" file for no real reason. load_rules scans every *.toml under
# Rules/Pathfinder/ (Rules/Pathfinder/reference/ is one directory too deep to be included), so no
# code change was needed for either the original split or this merge.
#
# Eight PF weapons/armor already have a shipped equivalent under the exact same name (longsword,
# spear, long bow, short bow, hand axe, club, dagger, chain mail, all below the "Merged from
# items.toml" divider) and are deliberately NOT duplicated above it -- reuse those instead of
# authoring a second, slightly different "longsword". A few PF weapons (shortsword/shortbow's own
# generic martial-weapon stats) are close enough to an existing reflavor there (rusty shortsword /
# short bow) that a second entry would just be redundant; PF's real "Shortsword"/"Shortbow"
# numbers are covered by the new "short sword" entry below instead, since "rusty shortsword" is a
# deliberately weakened debug-scenario reflavor, not the base weapon. Ammunition (arrows, bolts,
# sling bullets) is out of scope -- this engine has no ammo-tracking mechanic; a ranged weapon
# just works once equipped, the same way "long bow"/"short bow" already ship with no separate
# ammunition item. "Net" (pure entangle, no direct damage) is also out of scope -- it would need a
# bespoke restraining condition, not just a damage_value/armor_value conversion, so it's left as a
# "needs a human call" gap rather than authored badly.
#
# ============================================================================================
# Conversion formulas (weapons & armor/shields only -- see AskUserQuestion decisions this file
# was authored against: weapons+armor scope, this file's own location, value = gp price
# unscaled)
# ============================================================================================
#
# Damage dice: PF's own Medium-creature "Dmg (M)" column (Table 6-4), converted to this engine's
# {dice, pips} by nearest average damage -- D6's pips are a flat +0/+1/+2 per die (not another
# fractional die), so the available averages are 1,2,3.5,4.5,5.5,7,8,9,10.5,11.5,... with real
# gaps between them. Matched as closely as the available codes allow:
#   PF die   avg    D6 code   avg
#   1d2      1.5    0D+1      1     (weakest tier -- unarmed-adjacent gauntlet strikes)
#   1d3      2.0    0D+2      2     (exact)
#   1d4      2.5    0D+2      2     (nearest available; collides with 1d3 -- both "light" tier)
#   1d6      3.5    1D+0      3.5   (exact)
#   1d8      4.5    1D+1      4.5   (exact)
#   1d10     5.5    1D+2      5.5   (exact)
#   1d12     6.5    2D+0      7     (nearest available)
#   2d4      5.0    1D+2      5.5   (nearest available; collides with 1d10)
#   2d6      7.0    2D+0      7     (exact; collides with 1d12)
#   2d8      9.0    2D+2      9     (exact)
# A double weapon's second head (ex: quarterstaff's own 1d6/1d6, dwarven urgrosh's 1d8/1d6) is
# dropped -- this engine has no "attack twice per turn" primitive (see
# reference/pathfinder_mapping.toml's own creature_ability "Multiple natural attacks" row, same
# precedent); only the primary head's own damage converts.
#
# Strength bonus: bonus = "strength_damage" for every melee weapon and every "throwing"-skill
# weapon (PF applies Str to thrown-weapon damage same as melee) and for the missile weapons PF
# itself grants Str to (sling, halfling sling staff, composite longbow, composite shortbow) --
# bonus = 0 for every other "missiles"-skill weapon (ordinary bows, all crossbows, blowgun),
# matching this file's own shipped "long bow"/"short bow" precedent exactly.
#
# Range: PF's range increment (feet) divided by ~16 ft/band and rounded, calibrated against
# this file's own shipped long bow (100 ft -> 6 bands) and short bow (60 ft -> 4 bands) so every
# other weapon's bands line up with what's already in play. A weapon with PF's own "reach"
# property (longspear, glaive, guisarme, lance, ranseur, whip) gets range = 1 outright -- one band
# beyond plain melee -- the same fixed value this file's own shipped "spear" already uses for
# reach, rather than trying to derive a band count from "reach doubles a 5 ft square".
#
# Armor/shield AC bonus -> armor_value: PF's own AC bonus is already a clean small integer, so
# it's a direct lookup rather than an average-matching exercise:
#   AC bonus   D6 code
#   +1         0D+2
#   +2         1D+0
#   +3         1D+1
#   +4         1D+2
#   +5         2D+0
#   +6         2D+1
#   +7         2D+2
#   +8         3D+0
#   +9         3D+1
# armor_tags is always [ "physical", "piercing", "bludgeoning", "slashing" ], matching
# this file's own shipped "chain mail" -- this engine's armor doesn't discriminate by damage
# type the way PF's DR does, it's a flat physical-hit reducer. Shields use equip_slot = "lhand"
# (this engine has no separate shield slot -- rules.toml's own [[equip_slot]] gives a humanoid
# "rhand"/"lhand" only, same as any off-hand item) and subtype = "shield" (new, purely
# descriptive -- nothing in the engine gates on an item's own subtype for equipping, only the
# wearer's supertype/subtype via get_equip_slots, so this needed no code change either).
#
# Skill assignment: blades = swords, kukri, picks, starknife; axes = axes/waraxes; polearms =
# reach/pole weapons + spiked chain + trident; brawling = blunt one- and two-handed weapons
# (matching this file's own shipped "club" -> brawling precedent) + monk-flavor blunt weapons;
# finesse = the dagger family, whip, and the remaining light monk weapons (sai/siangham/kama/
# nunchaku); throwing = weapons PF itself calls out as thrown (dart, javelin, throwing axe,
# light hammer, bolas, shuriken); missiles = every bow/crossbow/sling/blowgun.
#
# max_hp/bulk/[entity.skills].fortitude (the item's own durability, checked by a "sunder"
# attempt) scale by a simple three-tier ladder rather than PF's own per-item weight in lbs,
# matching this file's own shipped weapons/armor below the divider (bulk=1 flat regardless of
# real-world weight): light/one-handed weapons and ranged weapons get bulk=1, two-handed weapons
# and heavy armor/tower shield get bulk=2 -- the one place the weapons/armor above the divider
# diverge from the fully-flat bulk=1 below it, since a full plate suit and a dagger sharing one
# bulk unit loses too much fidelity at this catalog's scale, while still keeping only two tiers
# to match the existing convention's simplicity.
#
# value is the PF gp price entirely unscaled (a fractional gp, ex: a 5 sp dart = 0.5, stays
# fractional rather than rounding) -- the values already shipped below the divider (longsword=15,
# chain mail=15, etc.) don't track PF gp consistently, so no existing conversion ratio was being
# preserved either way; starting-gold/loot-currency amounts elsewhere may need separate
# re-tuning against this file's much larger prices, but that's a one-time constant change, not
# a per-item judgment call.

