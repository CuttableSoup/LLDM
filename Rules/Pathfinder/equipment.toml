[[entity]]
name = "cursed dagger"
supertype = "object"
subtype = "weapon"
skill = "blades"
description = "A wickedly curved dagger, its blade etched with faintly glowing runes that seem to shift when unwatched."
equip_slot = [ "rhand", "lhand" ]
max_hp = 8
damage_value = { dice = 1, pips = 1, bonus = "strength_damage" }
damage_tags = [ "slashing" ]
tags = [ "cursed" ]
bulk = 1
value = 5
[entity.skills]
fortitude = { dice = 2, pips = 0 }

# An arcane check against the item itself (not the chest/scene it's sitting in) -- reachable
# once the dagger is either in the player's own inventory or sitting in an unlocked, open
# container (see DMCore._resolve_item_test_target). blocks_if_condition stops a repeat check
# from re-rolling something already known. "reveal" (apply_test_outcome) marks it "identified"
# but doesn't itself say *what* was revealed -- narration reads that back off the entity's own
# "tags" field once identified, rather than duplicating it here.
[entity.test]
difficulty = 8
skill = [ "arcane" ]
blocks_if_condition = "identified"

[entity.test.pass]
reveal = true

# Makes the curse real, not just flavor. "target" here is the dagger itself (the
# entity this program lives on); "actor" is whoever just equipped it. Equipping an
# *unidentified* cursed dagger actually curses the wearer -- the [entity.test] above (an arcane
# check) becomes something worth doing before putting the thing on, not just flavor text.
[entity.on_interact.equip]
if = "target.has_condition:identified == false"
then = { do = "condition", entity = "actor", name = "cursed", duration = "permanent" }

# Traps: a skill check against the object itself, same [entity.test] mechanism as a chest's
# lock, but "fail" now carries a "damage" key (apply_test_outcome, DM_Status.py) that deals
# real damage to the player via the same calculate_damage/evaluate_statuses path any weapon
# hit takes. "armed" starts active (like a chest's own "locked"); a pass dismisses it (the
# trap is now safe forever); a fail applies "triggered" instead, which blocks_if_condition
# then keeps future attempts from re-rolling and re-damaging the exact same spent trap.
#
# "hidden" starts active too -- unlike "armed" (a mechanical gate on [entity.test]), it's
# purely about the LLM's own narration prompt: while active, this entity is left out of the
# roster _describe_scenario_characters builds (and out of any action's own "defender_details"
# -- see is_hidden/DM_Core.py's _attach_defender_details), so the trap isn't spoiled to the
# player before they'd have any in-fiction reason to know it's there. [entity.notice] is the
# check that clears it: rolled automatically, with no player input, the moment this entity is
# instanced (RulesMixin._auto_roll_notice, DM_Rules.py) -- not player-initiated like
# [entity.test]'s own disarm check below, which still requires "armed" and works whether or
# not "hidden" has cleared yet (a lucky blind stab can disarm something never noticed).
[[entity]]
name = "dart trap"
supertype = "object"
subtype = "trap"
description = "A row of pinprick holes lines the wall at waist height, aimed squarely across the doorway."
max_hp = 5
# Custom XP grant (_award_xp_for_defeat, DM_Combat.py) -- get_challenge_rating would be a poor
# stand-in for a trap, which has no skills/damage-dealing ability the usual way, so this is a
# flat value instead, matching this trap's own test difficulty rather than anything CR-scaled.
exp = 9

[entity.conditions.armed]
duration = "permanent"

[entity.conditions.hidden]
duration = "permanent"

[entity.notice]
skill = "observation"
difficulty = 4

[entity.test]
difficulty = 9
skill = [ "finesse", "acrobatics" ]
requires_condition = "armed"
blocks_if_condition = "triggered"

# xp = true opts this pass outcome into _award_xp_for_defeat -- surviving or disarming a real
# hazard is worth XP the same declarative way loot/reveal/damage already are (see this trap's
# own top-level "exp" above for the actual amount).
[entity.test.pass]
dismiss_condition = "armed"
xp = true

[entity.test.fail]
condition = "triggered"
duration = "permanent"
dismiss = ""
# 3 dice, not 2 -- chain mail's own armor_value/armor_tags already reduces "piercing" by
# 2 dice, and a trap that a full suit of armor shrugs off entirely wouldn't be much of a
# trap. Still less than the scythe trap's own 3 dice against "slashing" armor coverage --
# no difference there, this is just about clearing chain mail's reduction, not escalation.
damage = { dice = 3, pips = 0, bonus = 0 }
damage_tags = [ "piercing" ]

[[entity]]
name = "scythe trap"
supertype = "object"
subtype = "trap"
description = "A rusted blade hangs half-hidden in the shadows overhead, strung on a taut wire across the passage."
max_hp = 8
# Custom XP grant -- see the dart trap's own "exp" comment above for why a trap authors this
# explicitly rather than relying on get_challenge_rating.
exp = 10

[entity.conditions.armed]
duration = "permanent"

[entity.conditions.hidden]
duration = "permanent"

# Overhead, not waist-height like the dart trap -- a step harder to catch on a glance, hence
# the steeper notice difficulty (6 vs. the dart trap's 4).
[entity.notice]
skill = "observation"
difficulty = 6

[entity.test]
difficulty = 10
# reflexes is listed first since it's what gladstone (and any similarly-built character) is
# actually trained in -- 2 dice, vs untrained 1d6 for dodge/acrobatics, which would make this
# trap nearly unbeatable on its own (max roll 6, never clearing a difficulty above 6). "dodge"
# is still included because it's the single most natural verb for evading a swinging blade --
# without it, "I dodge the trap" wouldn't match this test.skill list at all and would
# silently fall through to a harmless, mechanically-meaningless auto-success instead of a
# real (if difficult) attempt.
skill = [ "reflexes", "dodge", "acrobatics" ]
requires_condition = "armed"
blocks_if_condition = "triggered"

[entity.test.pass]
dismiss_condition = "armed"
xp = true

[entity.test.fail]
condition = "triggered"
duration = "permanent"
dismiss = ""
damage = { dice = 3, pips = 0, bonus = 0 }
damage_tags = [ "slashing" ]

