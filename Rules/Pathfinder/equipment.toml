fortitude = { dice = 6, pips = 0 }

[[entity]]
name = "dusty coffer"
supertype = "object"
subtype = "container"
description = "A small, unassuming coffer tucked into a crack in the wall, easy to miss unless you're looking for it."
max_hp = 20
bulk = 3
value = 5
currency = 10
inventory = [ "health potion" ]

[entity.conditions.locked]
duration = "permanent"

[entity.conditions.closed]
duration = "permanent"

[entity.test]
difficulty = 8
skill = [ "finesse" ]
requires_condition = "locked"
blocks_if_condition = "jammed"

[entity.test.pass]
dismiss_condition = "locked"

[entity.test.fail]
condition = "jammed"
duration = "permanent"
dismiss = ""

[entity.skills]
fortitude = { dice = 3, pips = 0 }

# What a health potion becomes once drunk (see its own "replace_with") -- an empty husk left
# in inventory rather than the potion just vanishing outright. Not usable itself (no "usable"
# field), and worth little.
[[entity]]
name = "glass vial"
supertype = "object"
subtype = "trinket"
description = "An empty glass vial, its contents long since consumed."
bulk = 0
value = 1

# Raw crafting material -- no [entity.test]/abilities of its own, just a plain, stackable
# (duplicate-inventory-entries-represent-quantity) good.
[[entity]]
name = "iron ingot"
supertype = "object"
subtype = "material"
description = "A rough-cast bar of iron, still faintly warm from the forge."
bulk = 1
value = 3

[[entity]]
name = "leather strip"
supertype = "object"
subtype = "material"
description = "A length of cured leather, cut for binding a grip or hilt."
bulk = 0
value = 1

# Worked example of [entity.craft] (see CLAUDE.md's "Crafting" and reference/entity_schema.toml)
# -- craftable via either strength or finesse (whichever gladstone is better-trained in gets
# auto-selected), needs the blacksmith's own forge (debug.toml) nearby, and consumes its own
# materials whether the roll succeeds or fails.
[[entity]]
name = "iron dagger"
supertype = "object"
subtype = "weapon"
skill = "blades"
description = "A plain iron dagger, hastily forged but serviceable."
equip_slot = [ "rhand", "lhand" ]
max_hp = 6
damage_value = { dice = 1, pips = 0, bonus = "strength_damage" }
damage_tags = [ "slashing" ]
bulk = 1
value = 8

[entity.craft]
skill = [ "strength", "finesse" ]
difficulty = 10
requires_station = "forge"
materials = [
    { item = "iron ingot", quantity = 2 },
    { item = "leather strip", quantity = 1 },
]

# Spell component -- same [entity.craft]-style "materials" shape, just consumed by a named
# ability's own cast (DM_Core.py's _resolve_roll/_consume_spell_materials_if_rolled) instead of
# a craft attempt. See spells.toml's "arc lance".
[[entity]]
name = "iron filings"
supertype = "object"
subtype = "material"
description = "A small pouch of fine iron filings, faintly magnetic."
bulk = 0
value = 2

# Worked example of container_capacity (see docs/inventory-items.md's "Carry capacity (bulk)"
# and reference/pathfinder_mapping.toml's magic_item table, "Bag of Holding / Handy
# Haversack / Portable Hole") -- get_current_bulk never recurses into an item's own nested
# "inventory" in the first place, so whatever's stored inside already doesn't count against
# whoever's carrying this bag; container_capacity is what actually bounds how much can go
# into the bag itself, enforced by transfer_item/place_new_item.
[[entity]]
name = "bag of holding"
supertype = "object"
subtype = "container"
description = "A worn leather bag, its inside somehow far roomier than its outside."
bulk = 2
value = 50
container_capacity = 40
inventory = [ "health potion" ]

# Worked example of container_allowed_supertypes (see reference/pathfinder_mapping.toml's
# magic_item table) -- a spellbook only ever holds spell entities; transfer_item/
# place_new_item refuse "wrong_item_type" for anything else, whether that's a player-driven
# give/take/trade, a loot sweep, or an ad hoc ADaM placement.
[[entity]]
name = "spellbook"
supertype = "object"
subtype = "container"
description = "A leather-bound spellbook, its pages dense with arcane notation."
bulk = 1
value = 30
container_allowed_supertypes = [ "spell" ]
inventory = [ "fireball" ]

# The "on_arrival" shipped worked example (reference/pathfinder_mapping.toml's
# "Delayed/triggered magic" row -- Glyph of Warding/Magic Mouth): an ordinary hazard, placed
# permanently like any other room prop (or conjured via "summon", same as spells.toml's "flame
# wall"), with no mechanism of its own beyond the [[status]] entry (rules.toml's own "warding
# glyph shock") that matches it by name. subtype = "spell" (not "trap") marks it as a standing
# magical effect the same way "flame wall" does -- "dispel magic" already banishes any entity
# sharing that subtype, so no separate dispel wiring is needed here. immunity_tags = ["any"]
# for the same reason "flame wall" carries it: current_target has no is_hostile gate, so a
# non-hostile object can be targeted/attacked like anything else -- a glyph shouldn't be
# choppable down by an ordinary weapon, only dispelled or its own [entity.conditions.armed]
# flag cleared some other way.
[[entity]]
name = "warding glyph"
supertype = "object"
subtype = "spell"
description = "Faint silver sigils are scratched into the stone underfoot, waiting for an unworthy footstep."
max_hp = 10
immunity_tags = [ "any" ]

[entity.conditions.armed]
duration = "permanent"
