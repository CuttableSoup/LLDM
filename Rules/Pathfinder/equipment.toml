name = "spiked gauntlet"
supertype = "object"
subtype = "weapon"
skill = "brawling"
equip_slot = [ "rhand", "lhand" ]
max_hp = 6
damage_value = { dice = 0, pips = 2, bonus = "strength_damage" }
damage_tags = [ "piercing" ]
bulk = 1
value = 5
[entity.skills]
fortitude = { dice = 2, pips = 0 }

