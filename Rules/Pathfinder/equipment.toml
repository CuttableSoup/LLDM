# ============================================================================================
# Merged from items.toml -- the small, hand-curated set of narrative items the debug scenario
# actually references (locked containers, traps, a spellbook, a bag of holding, crafting
# materials, a warding glyph, and the handful of weapons/armor named as "shipped" precedent
# throughout the header above). This was never actually Pathfinder-sourced content -- nothing
# below this divider was converted from a Chapter 6 table the way everything above it was, it
# was written purely to exercise engine mechanics (a container, a trap, a curse, a craft recipe)
# for the debug scenario to demonstrate against. Keeping it in a separate items.toml file made
# sense back when this setting had no equipment catalog of its own to fold it into; once this
# file existed, splitting "real Pathfinder gear" from "everything else objects can do" stopped
# reflecting any actual difference in kind, so the two were merged into this one catalog instead.
# ============================================================================================

[[entity]]
name = "longsword"
supertype = "object"
subtype = "weapon"
skill = "blades"
description = "A well-balanced steel blade, kept sharp and ready."
# A single candidate slot, or a list -- resolve_equip_slot (DM_Inventory.py) picks the first
# one valid for the equipping entity's own supertype/subtype (rules.toml's [[equip_slot]]).
# One-handed, so either hand will do.
equip_slot = [ "rhand", "lhand" ]
max_hp = 10
# No "range" field at all -- melee, usable only in the same band as the target (see
# DM_Movement.py's "Movement and range"; is_in_range treats a missing range as 0).
damage_value = { dice = 1, pips = 2, bonus = "strength_damage" }
damage_tags = [ "slashing" ]
bulk = 1
value = 15
[entity.skills]
fortitude = { dice = 3, pips = 0 }

