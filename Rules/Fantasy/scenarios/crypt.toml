[[location.room]]
key = "entrance"
name = "Entrance Hall"
description = "A low, dusty antechamber. Something about the far wall doesn't look quite right."
bands = 2
enclosed = true
entities = [
    { name = "dart trap", band = 2 },
]

[[location.room.exit]]
band = 2
direction = "forward"
destination = "hall_of_webs"
arrival_band = 1

[[location.room]]
key = "hall_of_webs"
name = "The Hall of Webs"
description = "Thick sheets of webbing span the corridor from floor to ceiling, swaying faintly though there's no wind down here."
bands = 2
enclosed = true
entities = [
    { name = "giant spider", band = 1 },
]

[[location.room.exit]]
band = 1
direction = "forward"
destination = "guard_chamber"
arrival_band = 1

[[location.room.exit]]
band = 1
direction = "back"
destination = "entrance"
arrival_band = 2

[[location.room]]
key = "guard_chamber"
name = "The Guard Chamber"
description = "A small stone room with a rotted table and a single iron chest against the wall, long abandoned by whoever once stood watch here. A narrow side passage breaks off to the right partway across."
bands = 3
enclosed = true
# The chest sits at band 3, not band 1 -- advance_or_retreat moves the player *toward*
# current_target and is a no-op once already tied with it (see DM_Movement.py's own
# docstring), so a chest sitting at the player's own arrival band would leave them with no
# ordinary way to reach band 2 at all. With it at band 3, "advance" from the entrance
# naturally passes through band 2 (where the branch's own "right" exit lives) on the way to
# the chest and the main path's "forward" exit, both at band 3.
entities = [
    { name = "iron chest", band = 3 },
]

[[location.room.exit]]
band = 1
direction = "back"
destination = "hall_of_webs"
arrival_band = 1

# The branch: from band 2, "right" peels off into a small optional side room instead of
# continuing the main path -- reaching it means actually advancing to band 2 first (ordinary
# intra-room advance/retreat, unrelated to this exit list), not just saying a direction.
[[location.room.exit]]
band = 2
direction = "right"
destination = "hidden_alcove"
arrival_band = 1

[[location.room.exit]]
band = 3
direction = "forward"
destination = "collapsed_passage"
arrival_band = 1

[[location.room]]
key = "hidden_alcove"
name = "The Hidden Alcove"
description = "A cramped, easy-to-miss nook off the main passage. A small coffer sits half-buried in the rubble."
bands = 1
enclosed = true
entities = [
    { name = "dusty coffer", band = 1 },
]

[[location.room.exit]]
band = 1
direction = "back"
destination = "guard_chamber"
arrival_band = 2

[[location.room]]
key = "collapsed_passage"
name = "The Collapsed Passage"
description = "Rubble narrows the way ahead to a single crawlspace. A faint metallic glint catches the light overhead."
bands = 2
enclosed = true
entities = [
    { name = "scythe trap", band = 2 },
]

[[location.room.exit]]
band = 2
direction = "forward"
destination = "bone_gallery"
arrival_band = 1

[[location.room.exit]]
band = 1
direction = "back"
destination = "guard_chamber"
arrival_band = 3

[[location.room]]
