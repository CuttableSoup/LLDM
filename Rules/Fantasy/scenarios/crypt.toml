# A multi-room dungeon crawl, all one [[location]] (see CLAUDE.md's "Scenarios and rooms") --
# unlike arena/tavern/field/dungeon (one location wrapping one room each), this location
# declares several [[location.room]] tables plus its own start_room. The location's own
# "entities" lists whoever persists across the *whole* dungeon (the player, thane, anne) -- a
# room's own "entities" list never repeats them, only its own local creatures/traps/chests (see
# DM_Rules.py's _populate_room). The player moves between rooms with a direction word
# ("forward"/"back"/"left"/"right" -- NLPCore.DIRECTION_PHRASES) matched against the current
# room's own [[location.room.exit]] list, each of which is only usable from the specific band
# it's declared at -- guard_chamber below is the one room with a real branch (an exit "right"
# at band 2 into a side room, another "forward" at band 3 continuing the main path), not just a
# linear forward/back corridor. This whole dungeon never declares a [[location.exit]] of its
# own -- nothing outside it exists in this scenario.
[scenario]
name = "The Sunken Crypt"
description = "A crypt long since swallowed by the earth, its passages choked with rubble and the smell of old stone."
start_location = "crypt"

[[location]]
key = "crypt"
name = "The Sunken Crypt"
description = "A crypt long since swallowed by the earth, its passages choked with rubble and the smell of old stone."
start_room = "entrance"
entities = [
    { name = "player", band = 1 },
    { name = "thane", band = 1 },
    { name = "anne", band = 1 }
]

# Local copies of every npc/creature entity this whole dungeon references (see DM_Rules.py's
# load_scenario_definition/"Scenarios and rooms" in CLAUDE.md), so this one file is
# self-contained and doesn't need creatures.toml/characters.toml to actually be playable.
# "thane" is also duplicated into arena.toml, which references it too; kept in sync by hand
# since duplication (not a shared file) is the whole point here.
