# A multi-room dungeon crawl (see DM_Rules.py's "Scenario instancing"/room-graph notes) --
# unlike arena/tavern/field/dungeon (one flat room each), this declares several [[room]]
# tables plus start_room. [scenario].entities lists only whoever persists across the *whole*
# dungeon (today, just the player) -- a room's own "entities" list never repeats the player,
# only its own local creatures/traps/chests (see DM_Rules.py's _populate_room). The player
# moves between rooms with a direction word ("forward"/"back"/"left"/"right" --
# NLPCore.DIRECTION_PHRASES) matched against the current room's own [[room.exit]] list, each
# of which is only usable from the specific band it's declared at -- guard_chamber below is
# the one room with a real branch (an exit "right" at band 2 into a side room, another
# "forward" at band 3 continuing the main path), not just a linear forward/back corridor.
[scenario]
name = "The Sunken Crypt"
description = "A crypt long since swallowed by the earth, its passages choked with rubble and the smell of old stone."
start_room = "entrance"
entities = [
    { name = "gladstone", band = 1 },
    { name = "thane", band = 1 }
]

[[room]]
key = "entrance"
name = "Entrance Hall"
description = "A low, dusty antechamber. Something about the far wall doesn't look quite right."
bands = 2
enclosed = true
entities = [
    { name = "dart trap", band = 2 },
]

[[room.exit]]
band = 2
direction = "forward"
destination = "hall_of_webs"
arrival_band = 1

[[room]]
key = "hall_of_webs"
name = "The Hall of Webs"
description = "Thick sheets of webbing span the corridor from floor to ceiling, swaying faintly though there's no wind down here."
bands = 2
enclosed = true
entities = [
    { name = "giant spider", band = 1 },
]

[[room.exit]]
band = 1
direction = "forward"
destination = "guard_chamber"
arrival_band = 1

[[room.exit]]
band = 1
direction = "back"
destination = "entrance"
arrival_band = 2

[[room]]
key = "guard_chamber"
name = "The Guard Chamber"
description = "A small stone room with a rotted table and a single iron chest against the wall, long abandoned by whoever once stood watch here. A narrow side passage breaks off to the right partway across."
bands = 3
enclosed = true
# The chest sits at band 3, not band 1 -- advance_or_retreat moves the player *toward*
# current_target and is a no-op once already tied with it (see DM_Movement.py's own
# docstring), so a chest sitting at the player's own arrival band would leave them with no
# ordinary way to reach band 2 at all. With it at band 3, "advance" from the entrance
# naturally passes through band 2 (where the branch's own "right" exit lives) on the way to
# the chest and the main path's "forward" exit, both at band 3.
entities = [
    { name = "iron chest", band = 3 },
]

[[room.exit]]
band = 1
direction = "back"
destination = "hall_of_webs"
arrival_band = 1

# The branch: from band 2, "right" peels off into a small optional side room instead of
# continuing the main path -- reaching it means actually advancing to band 2 first (ordinary
# intra-room advance/retreat, unrelated to this exit list), not just saying a direction.
[[room.exit]]
band = 2
direction = "right"
destination = "hidden_alcove"
arrival_band = 1

[[room.exit]]
band = 3
direction = "forward"
destination = "collapsed_passage"
arrival_band = 1

[[room]]
key = "hidden_alcove"
name = "The Hidden Alcove"
description = "A cramped, easy-to-miss nook off the main passage. A small coffer sits half-buried in the rubble."
bands = 1
enclosed = true
entities = [
    { name = "dusty coffer", band = 1 },
]

[[room.exit]]
band = 1
direction = "back"
destination = "guard_chamber"
arrival_band = 2

[[room]]
key = "collapsed_passage"
name = "The Collapsed Passage"
description = "Rubble narrows the way ahead to a single crawlspace. A faint metallic glint catches the light overhead."
bands = 2
enclosed = true
entities = [
    { name = "scythe trap", band = 2 },
]

[[room.exit]]
band = 2
direction = "forward"
destination = "bone_gallery"
arrival_band = 1

[[room.exit]]
band = 1
direction = "back"
destination = "guard_chamber"
arrival_band = 3

[[room]]
key = "bone_gallery"
name = "The Bone Gallery"
description = "Alcoves line both walls, each holding the remains of the dead -- except one, which is standing."
bands = 2
enclosed = true
entities = [
    { name = "skeleton warrior", band = 1 },
]

[[room.exit]]
band = 1
direction = "forward"
destination = "sanctum"
arrival_band = 1

[[room.exit]]
band = 1
direction = "back"
destination = "collapsed_passage"
arrival_band = 2

[[room]]
key = "sanctum"
name = "The Sanctum"
description = "A small, reverent chamber untouched by the collapse elsewhere in the crypt. An ornate reliquary sits at its center."
bands = 2
enclosed = true
entities = [
    { name = "ornate reliquary", band = 1 },
]

[[room.exit]]
band = 1
direction = "forward"
destination = "boss_chamber"
arrival_band = 1

[[room.exit]]
band = 1
direction = "back"
destination = "bone_gallery"
arrival_band = 1

[[room]]
key = "boss_chamber"
name = "The Warden's Vault"
description = "A vast circular chamber, its walls carved with warnings in a script no living tongue still speaks. Something vast rises from the dark at its center."
bands = 3
enclosed = true
entities = [
    { name = "the bone warden", band = 1 },
]

[[room.exit]]
band = 1
direction = "back"
destination = "sanctum"
arrival_band = 1
