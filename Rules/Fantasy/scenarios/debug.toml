# The single developer/test scenario -- collapses what used to be 12 separate scenario files
# (arena/character_test/crypt/dungeon/field/npc_generation_test/plains/scenario_entity_test/
# shop/tavern/tavern_random/town) into one connected hub-and-spoke [[location]] graph, so both
# the GUI's Scenario -> Load... picker and `python LLDM.py <scenario>` offer one real "start
# here" option instead of a wall of test fixtures. `lost_coast.toml` is deliberately NOT part of
# this merge -- it's kept as its own real shipped scenario, not a test fixture. Every area below
# keeps its own original location/room/entity keys unchanged (so every existing test's own
# start_location override still lands exactly where it used to), just reachable from a shared
# `debug_hub` via an ordinary [[location.exit]] each way, using `return_to` for the trip back
# (see docs/movement-scenarios.md's "Location-to-location travel"). `character_test.toml`'s own
# former "testing_grounds" location is not carried over at all -- its only two consumers
# (a character-creation-rename check and a live custom-character combat conversation) never
# actually needed an isolated room of their own; both now just point at `arena_grounds`, which
# already has everything either one needs (a scenario-local "wolf" to collide-rename against /
# fight). `trailhead`/`border_stones` (from plains.toml) keep their own `grid` fields and are
# NOT wired into the [[location.exit]] graph the same way -- a gridded location's own outgoing
# travel skips that graph entirely (DM_Movement.py's _resolve_travel_intent), so they're reached
# from the hub by one ordinary exit in, then named/grid travel between each other from there.
[scenario]
name = "The Debug Room"
description = "A bare stone chamber lined with unmarked doors, each leading to a different testing ground."
start_location = "debug_hub"
known_locations = [ "trailhead", "border_stones" ]

[[location]]
key = "debug_hub"
name = "The Debug Room"
description = "A bare stone chamber lined with unmarked doors, each leading to a different testing ground."
entities = []

[[location.exit]]
destination = "arena_grounds"
aliases = [ "arena" ]

[[location.exit]]
destination = "crypt"
aliases = [ "crypt" ]

[[location.exit]]
destination = "cellar"
aliases = [ "cellar", "forgotten cellar" ]

[[location.exit]]
destination = "field_grounds"
aliases = [ "field", "open field" ]

[[location.exit]]
destination = "trailhead"
aliases = [ "plains", "trailhead", "open plains" ]

[[location.exit]]
destination = "generation_grounds"
aliases = [ "generation grounds" ]

[[location.exit]]
destination = "vault"
aliases = [ "vault", "sealed vault" ]

[[location.exit]]
destination = "general_store"
aliases = [ "shop", "store", "general store" ]

[[location.exit]]
destination = "tavern_floor"
aliases = [ "tavern", "rusty tankard" ]

[[location.exit]]
destination = "tavern_tonight"
aliases = [ "tavern tonight", "busy tavern" ]

[[location.exit]]
destination = "town_square"
aliases = [ "town", "millbrook", "market square" ]

# ---------------------------------------------------------------------------------------------
# arena_grounds -- formerly arena.toml. Also now the target of character_test.toml's own two
# former consumers (TestCharacterCreationRename's "wolf" scenario-local-collision check, and
# TestCreatedCharacterConversation's live custom-character combat) -- both only ever needed a
# scenario-local "wolf" to exist somewhere, which this room already has.
[[location]]
key = "arena_grounds"
name = "The Arena"
description = "A large arena. Dried blood spatters paint the dirt. The crowd demands to be entertained."
start_room = "grounds"
entities = [
    { name = "player", band = 1 },
    { name = "thane", band = 1 }
]
return_to = "debug_hub"

[[location.room]]
key = "grounds"
name = "The Arena"
description = "A large arena. Dried blood spatters paint the dirt. The crowd demands to be entertained."
bands = 4
enclosed = true
entities = [
    { name = "wolf", band = 1 },
    { name = "wolf", band = 1 },
]

