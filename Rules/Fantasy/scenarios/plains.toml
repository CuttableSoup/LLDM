# A grid-based overworld scenario (see docs/downtime.md's "Travel") -- two freeform locations,
# both mapped onto Rules/Fantasy/world_map.toml's own "the open plains" region, far enough apart
# (grid distance 24 miles, at rules.toml's own [travel] default_speed of 24 miles/block -- see
# that file's own "1 grid unit = 1 mile" comment) to cost exactly one block of travel time.
# Neither location authors a [[location.exit]] at all: an optional
# "grid" field replaces the authored exit graph entirely for this coordinate-bearing subset --
# from either one, naming the other by its own "name" (or an "aliases" entry) resolves directly
# once it's actually known (self.known_locations), the same "any known location reachable by
# name" model docs/downtime.md's "Travel" section describes. known_locations below seeds both as
# already known from the very first turn -- "some other in-fiction means" (a map the player
# starts with), since neither could otherwise ever be named before being visited once.
[scenario]
name = "The Open Plains"
description = "Flat grassland stretching to the horizon in every direction, broken only by a distant treeline."
start_location = "trailhead"
known_locations = [ "trailhead", "border_stones" ]

[[location]]
key = "trailhead"
name = "the trailhead"
description = "A weathered signpost marks where a cart track gives way to open grass."
grid = { x = 0, y = 0 }
entities = []

[[location]]
key = "border_stones"
name = "the border stones"
aliases = [ "the standing stones", "the stones" ]
description = "A ring of half-sunken standing stones, worn smooth by wind and time."
grid = { x = 24, y = 0 }
entities = []
