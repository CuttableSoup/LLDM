[scenario]
name = "The Open Field"
description = "Rolling grassland stretches to the horizon under a gray sky. A wolf stalks through the tall grass, and farther off a bandit lurks at the treeline, bow in hand."
# Unenclosed -- unlike the arena/tavern/dungeon, retreat here is never capped at "bands" (see
# DM_Movement.py's "Movement and range"). Something can actually get away by outrunning
# whatever's chasing it, which an enclosed room can never allow.
bands = 8
enclosed = false
entities = [
    { name = "player", band = 1 },
    { name = "wolf", band = 3 },
    # Starts at gap 4 from the player -- exactly the short bow's own range = 4 (items.toml), so
    # the very first round already demonstrates its "distance_to_target" behavior favoring the
    # bow over its sword (creatures.toml).
    { name = "bandit", band = 5 },
]

# Local copies of every npc/creature entity this scenario references (see DM_Rules.py's
# load_scenario_definition/"Scenarios and rooms" in CLAUDE.md), so this file is self-contained
# and doesn't need creatures.toml to actually be playable. "wolf" also still lives in
# creatures.toml, kept there on purpose for character_test.toml's own deliberate shared-data
# reuse (see its own docstring) -- this copy simply wins for this scenario, loaded after
# load_rules. "bandit"'s own abilities/inventory still name real items.toml entities directly
# ("short bow"/"rusty shortsword") -- items are out of this self-containment pass, unlike
# npc/creature entities.
[[entity]]
name = "wolf"
supertype = "creature"
subtype = "animal"

max_hp = 16

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
willpower = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 6, pips = 0 }
strength = { dice = 2, pips = 0 }
brawling = { dice = 5, pips = 0 }

[[entity]]
name = "bandit"
supertype = "creature"
subtype = "humanoid"
description = "A road-worn brigand in mismatched leathers, a short bow slung across their back and a rusty shortsword at their hip."

max_hp = 18
currency = 12
inventory = [ "short bow", "rusty shortsword" ]

abilities = [ "short bow", "rusty shortsword" ]

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "distance_to_target", operator = ">", value = 0 },
]
action = "short bow"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "rusty shortsword"

[entity.skills]
missiles = { dice = 4, pips = 0 }
blades = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
fortitude = { dice = 2, pips = 0 }
strength = { dice = 2, pips = 0 }
