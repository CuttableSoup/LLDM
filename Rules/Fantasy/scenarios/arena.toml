[scenario]
name = "The Arena"
description = "A large arena. Dried blood spatters paint the dirt. The crowd demands to be entertained."
start_location = "arena_grounds"

# A single location wrapping one [[location.room]] -- see CLAUDE.md's "Scenarios and rooms" for
# the [[location]] shape. This scenario has no real reason for more than one place, so it never
# declares any [[location.exit]] at all.
[[location]]
key = "arena_grounds"
name = "The Arena"
description = "A large arena. Dried blood spatters paint the dirt. The crowd demands to be entertained."
start_room = "grounds"
# Whoever persists across the whole location -- the player and thane -- never the room's own
# local creatures (see DM_Rules.py's _populate_room: a room's own "entities" never repeats them).
entities = [
    { name = "player", band = 1 },
    { name = "thane", band = 1 }
]

[[location.room]]
key = "grounds"
name = "The Arena"
description = "A large arena. Dried blood spatters paint the dirt. The crowd demands to be entertained."
# Walled combat ring -- enclosed = true, so retreat is capped at band "bands" rather than
# unbounded (see DM_Movement.py's "Movement and range"). 4 bands gives room to kite before
# hitting the wall.
bands = 4
enclosed = true
entities = [
    { name = "wolf", band = 1 },
    { name = "wolf", band = 1 },
]

# Local copies of every npc/creature entity this scenario references (see DM_Rules.py's
# load_scenario_definition/"Scenarios and rooms" in CLAUDE.md), so this file is self-contained
# and doesn't need creatures.toml/characters.toml to actually be playable. "wolf" also still
# lives in creatures.toml, kept there on purpose for character_test.toml's own deliberate
# shared-data reuse (see its own docstring) -- this copy simply wins for this scenario, loaded
# after load_rules. "thane" is also duplicated into crypt.toml, which references it too; kept
# in sync by hand since duplication (not a shared file) is the whole point here.
[[entity]]
name = "wolf"
supertype = "creature"
subtype = "animal"

max_hp = 16

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
willpower = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 6, pips = 0 }
strength = { dice = 2, pips = 0 }
brawling = { dice = 5, pips = 0 }

[[entity]]
name = "thane"
supertype = "creature"
subtype = "humanoid"
description = "A grizzled mercenary who fights at gladstone's side."
is_party = true
follow_offset = 0

max_hp = 24

[entity.attitudes]
default = [ 40, 40, 40 ]

[entity.qualities]
race = "human"

[entity.skills]
acrobatics = { dice = 2, pips = 0 }
appraise = { dice = 2, pips = 0 }
arcane = { dice = 2, pips = 0 }
artistry = { dice = 2, pips = 0 }
athletics = { dice = 4, pips = 0 }
axes = { dice = 2, pips = 0 }
blades = { dice = 4, pips = 0 }
brawling = { dice = 4, pips = 0 }
charisma = { dice = 2, pips = 0 }
disguise = { dice = 2, pips = 0 }
dodge = { dice = 3, pips = 0 }
escape = { dice = 2, pips = 0 }
finesse = { dice = 2, pips = 0 }
fly = { dice = 2, pips = 0 }
forgery = { dice = 2, pips = 0 }
fortitude = { dice = 3, pips = 0 }
gambling = { dice = 2, pips = 0 }
husbandry = { dice = 2, pips = 0 }
intimidation = { dice = 4, pips = 0 }
linguistics = { dice = 2, pips = 0 }
medicine = { dice = 2, pips = 0 }
miracles = { dice = 2, pips = 0 }
missiles = { dice = 2, pips = 0 }
navigation = { dice = 2, pips = 0 }
observation = { dice = 2, pips = 0 }
