# Magnimar's Alabaster District, one of the city's nine districts (see lost_coast.toml's own
# "magnimar" location, which exits to each district hub below it, and this directory's own
# magnimar_*.toml siblings for the other eight) -- split one file per district because the
# source material ("Magnimar, City of Monuments", Settings/Fantasy/) organizes the whole city
# that way itself (each district gets its own stat block and lettered gazetteer, exactly like
# sandpoint.toml's flat "Exploring Sandpoint" numbered list, just one level deeper), and even a
# single district's worth of named villas/NPCs already runs long enough to want its own file.
# Pulled from the book's own extracted text (its RAG chunk cache), not general foreknowledge of
# the setting: each landmark description below is an original paraphrase, never the book's own
# copyrighted prose, though names/addresses/NPCs/rumor and quest hooks are drawn directly from
# its real content. Alabaster District (A1-A13 in the book's own gazetteer) is Magnimar's
# aristocratic quarter -- the great families' villas, its public hippodrome, and the district's
# own Pathfinder lodge.

[[location]]
key = "alabaster_district"
name = "Alabaster District"
aliases = [ "the Marble District", "the Stylobate" ]
description = "A hillside quarter of walled villas and marble facades where Magnimar's oldest and richest families keep their estates."
return_to = "magnimar"
entities = []

[[location.exit]]
destination = "fort_indros"
aliases = [ "fort indros", "the fortress" ]

[[location.exit]]
destination = "kaddren_villa"
aliases = [ "kaddren villa" ]

[[location.exit]]
destination = "nirodin_villa"
aliases = [ "nirodin villa" ]

[[location.exit]]
destination = "alabaster_park"
aliases = [ "the park", "alabaster park" ]

[[location.exit]]
destination = "serpents_run"
aliases = [ "the serpent's run", "the hippodrome" ]

[[location.exit]]
destination = "vanderale_villa"
aliases = [ "vanderale villa" ]

[[location.exit]]
destination = "scarnetti_villa"
aliases = [ "scarnetti villa" ]

[[location.exit]]
destination = "mindurian_villa"
aliases = [ "mindurian villa" ]

[[location.exit]]
destination = "valdemar_villa"
aliases = [ "valdemar villa" ]

[[location.exit]]
destination = "versade_villa"
aliases = [ "versade villa" ]

[[location.exit]]
destination = "derexhi_villa"
aliases = [ "derexhi villa" ]

[[location.exit]]
destination = "heidmarch_manor"
aliases = [ "heidmarch manor", "the pathfinder lodge" ]

[[location.exit]]
destination = "house_of_lords"
aliases = [ "the house of lords" ]

[[location]]
key = "fort_indros"
name = "Fort Indros"
description = "A basalt fortress bristling with siege engines at the district's northern point, watching Magnimar's eastern waters against pirate raids."
entities = [
    { name = "Vanns Wynmerd" },
]
return_to = "alabaster_district"

[[location]]
key = "kaddren_villa"
name = "Kaddren Villa"
description = "The founding Kaddren family's estate, its scholars and mages sent abroad for training and recalled home to serve the family's magical interests."
entities = [
    { name = "Zimandi Kaddren" },
]
return_to = "alabaster_district"

[[location]]
key = "nirodin_villa"
name = "Nirodin Villa"
description = "A fine estate whose mistress patronizes Magnimar's artists, trailed by rumors of a lingering fondness for Korvosan fashion."
entities = [
    { name = "Cheiskaia Nirodin" },
]
return_to = "alabaster_district"

[[location]]
key = "alabaster_park"
name = "Alabaster Park"
description = "A small public garden beside the Serpent's Run, where crowds linger to talk over whatever just happened inside."
entities = []
return_to = "alabaster_district"

[[location]]
key = "serpents_run"
name = "Serpent's Run"
description = "A vast snake-motif hippodrome seating thousands, hosting decathlons, races, golem battles, and mock gladiatorial bouts several times a month."
entities = [
    { name = "Jorston Droaeb" },
]
return_to = "alabaster_district"

[[location]]
key = "vanderale_villa"
name = "Vanderale Villa"
description = "Seat of the trade-minded Vanderale family, whose fleet and Merchants' Guild connections built one of Magnimar's great fortunes."
entities = [
    { name = "Mivonis Vanderale" },
]
return_to = "alabaster_district"

[[location]]
key = "scarnetti_villa"
name = "Scarnetti Villa"
description = "The shipbuilding Scarnetti family's estate, formally led by a humorless son but truly run by his shrewder, watchful mother."
entities = [
    { name = "Gradon Scarnetti" },
    { name = "Urtilia Mendion Scarnetti" },
]
return_to = "alabaster_district"

[[location]]
key = "mindurian_villa"
name = "Mindurian Villa"
description = "Home of the stonemason family who carved much of early Magnimar and parlayed the work into an aristocratic title."
entities = [
    { name = "Filuvia Mindurian" },
]
return_to = "alabaster_district"

[[location]]
key = "valdemar_villa"
name = "Valdemar Villa"
description = "A once-great shipping and fishing family's villa, its fortunes fallen and its current heir hiding a darker secret behind polite manners."
entities = [
    { name = "Kaleb Valdemar" },
]
return_to = "alabaster_district"

[[location]]
key = "versade_villa"
name = "Versade Villa"
description = "The Versade estate, famous for the district's most lavish parties, thrown by a hostess who fears a dull evening more than an empty coffer."
entities = [
    { name = "Savasha Versade" },
]
return_to = "alabaster_district"

[[location]]
key = "derexhi_villa"
name = "Derexhi Villa"
description = "Home of a mercenary aristocratic family whose adventuring scions hire out to solve other nobles' dangerous problems."
entities = [
    { name = "Randred Derexhi" },
    { name = "Luma Derexhi" },
]
return_to = "alabaster_district"

[[location]]
key = "heidmarch_manor"
name = "Heidmarch Manor"
description = "A retired adventuring couple's manor, opened as Varisia's first Pathfinder Society lodge, with a library and visiting explorers in residence."
entities = [
    { name = "Sheila Heidmarch" },
    { name = "Canayven Heidmarch" },
    { name = "Almya Gorangal" },
    { name = "Joadric Heimurl" },
]
return_to = "alabaster_district"

[[location]]
key = "house_of_lords"
name = "House of Lords"
description = "A stately public hall where representatives of the great families field grievances and favors so the aristocrats themselves need not."
entities = []
return_to = "alabaster_district"

