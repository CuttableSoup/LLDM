# Sandpoint, one of two towns in the "lost_coast" scenario (see this directory's own
# lost_coast.toml for the [scenario] table and the scenario's overall docstring) -- split into
# its own file because it grew past comfortably fitting alongside Magnimar in one document (see
# DM_Rules.py's scenario_component_files for how a scenario's own [[location]]/[[entity]] tables
# merge across every *.toml sibling in its directory). Nothing in here needs its own [scenario]
# table -- only one component file may define it, and lost_coast.toml already does.
#
# The 52 numbered "Exploring Sandpoint" landmarks from the Paizo sourcebook "Sandpoint, Light
# of the Lost Coast" (Settings/Fantasy/), pulled from the book's own extracted text (its RAG
# chunk cache) rather than general foreknowledge of the setting -- flat hub-and-spoke off
# sandpoint itself, exactly like debug.toml's own debug_hub, since sandpoint already carries a
# grid for the Magnimar road trip and _resolve_travel_intent now tries a location's own named
# exits before falling back to grid travel. Each landmark below is its own freeform
# [[location]] (no rooms -- a town crawl needs no band positioning) with return_to = "sandpoint";
# each description is an original paraphrase, never the book's own copyrighted prose, though
# names/addresses/NPCs/rumor and quest hooks are drawn directly from the book's real content.

[[location]]
key = "sandpoint"
name = "Sandpoint"
aliases = [ "the town of Sandpoint" ]
description = "A small, rebuilt fishing town on the Lost Coast, its streets of shops, taverns, and noble manors overlooked by the glassworks and the ruined Old Light."
grid = { x = 150, y = 0 }
entities = []

