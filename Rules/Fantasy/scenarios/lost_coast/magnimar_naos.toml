# Magnimar's Naos district (see magnimar_alabaster.toml's own docstring for why this scenario
# splits one file per district). Pulled from "Magnimar, City of Monuments" (Settings/Fantasy/)
# via its own extracted text -- descriptions below are original paraphrases, never the book's own
# copyrighted prose. Naos (N1-N13 in the book's own gazetteer), disparagingly called the
# "New-Money District," is Magnimar's military and merchant-aristocrat quarter, home to the
# towering Arvensoar and the lord-mayor's own estate.

[[location]]
key = "naos"
name = "Naos"
aliases = [ "Grand Arch", "the New-Money District", "Vista" ]
description = "A well-kept district of new-money merchants and military garrisons beneath the towering Arvensoar, its street signs deliberately left unmarked."
return_to = "magnimar"
entities = []

[[location.exit]]
destination = "osprey_club"
aliases = [ "the osprey club" ]

[[location.exit]]
destination = "cathedral_of_abadar"
aliases = [ "the cathedral of abadar" ]

[[location.exit]]
destination = "kaijitsu_villa"
aliases = [ "kaijitsu villa" ]

[[location.exit]]
destination = "deverin_villa"
aliases = [ "deverin villa" ]

[[location.exit]]
destination = "house_of_welcome"
aliases = [ "the house of welcome" ]

[[location.exit]]
destination = "defiants_garden"
aliases = [ "defiant's garden" ]

[[location.exit]]
destination = "arvensoar"
aliases = [ "the arvensoar" ]

[[location.exit]]
destination = "temple_of_iomedae"
aliases = [ "the temple of iomedae" ]

[[location.exit]]
destination = "founders_flame"
aliases = [ "founder's flame" ]

[[location.exit]]
destination = "the_guardians"
aliases = [ "the guardians" ]

[[location.exit]]
destination = "bastion_of_the_nail"
aliases = [ "the bastion of the nail" ]

[[location.exit]]
destination = "borias"
aliases = [ "boria's", "the wine shop" ]

[[location.exit]]
destination = "triodea"
aliases = [ "the triodea" ]

[[location]]
key = "osprey_club"
name = "Osprey Club"
description = "An invitation-only tavern and gambling den behind a wrought-iron fence, its faerie-fire glow marking Magnimar's most prestigious nightspot."
entities = [
    { name = "Kayasi Zivatchi" },
]
return_to = "naos"

[[location]]
key = "cathedral_of_abadar"
name = "Cathedral of Abadar"
description = "Magnimar's largest temple, functioning as the city's primary bank and moneylender for all of western Varisia."
entities = [
    { name = "Jyronn Imikar" },
]
return_to = "naos"

[[location]]
key = "kaijitsu_villa"
name = "Kaijitsu Villa"
description = "The Kaijitsu family's Magnimar estate, quietly falling into disrepair as the family's attention shifts to their holdings in Sandpoint."
entities = []
return_to = "naos"

[[location]]
key = "deverin_villa"
name = "Deverin Villa"
description = "Home of Magnimar's most easygoing aristocratic family, its patient, well-loved patriarch nicknamed the Simple Lord."
entities = [
    { name = "Hobart Deverin" },
]
return_to = "naos"

[[location]]
key = "house_of_welcome"
name = "House of Welcome"
description = "Magnimar's most exclusive and expensive brothel, occupying a villa its current madam wishes she'd inherited as a home instead."
entities = [
    { name = "Remeka Abantiir" },
]
return_to = "naos"

[[location]]
key = "defiants_garden"
name = "Defiant's Garden"
description = "A lavish, city-owned diplomatic estate the lord-mayor claimed for himself, its four staffed floors far grander than his old public residence."
entities = [
    { name = "Haldmeer Grobaras" },
    { name = "Khonderian" },
]
return_to = "naos"

[[location]]
key = "arvensoar"
name = "The Arvensoar"
description = "Magnimar's tallest structure, a four-hundred-foot tower garrisoning the city watch and military, connecting the Shore to the Summit."
entities = [
    { name = "Ismeir Odinburge" },
    { name = "Acacia Uriana" },
]
return_to = "naos"

[[location]]
key = "temple_of_iomedae"
name = "Temple of Iomedae"
description = "A fortresslike temple sounding a daily call to glory, preaching honor and sacrifice to Magnimar's laity."
entities = [
    { name = "Tira Ronnova" },
]
return_to = "naos"

[[location]]
key = "founders_flame"
name = "Founder's Flame"
description = "A perpetual fountain of magical fire, a founding-era gift to the city, its colors cycling in an arcane rhythm."
entities = []
return_to = "naos"

[[location]]
key = "the_guardians"
name = "The Guardians"
description = "Twin two-hundred-foot statues of young heroes forming a great arch over the road into the district."
entities = []
return_to = "naos"

[[location]]
key = "bastion_of_the_nail"
name = "Bastion of the Nail"
description = "A small, tenacious Hellknight garrison invited into the city by frustrated justices, now here to stay whether the Ushers like it or not."
entities = [
    { name = "Darean Halst" },
]
return_to = "naos"

[[location]]
key = "borias"
name = "Boria's"
description = "A deliberately unremarkable wine shop whose real trade, sold only to those it trusts, is rare and deadly poison."
entities = [
    { name = "Todoban Boria" },
]
return_to = "naos"

[[location]]
key = "triodea"
name = "The Triodea"
description = "Magnimar's most renowned playhouse, its three halls hosting opera, concerts, and solo performance under one roof."
entities = [
    { name = "Durstin Versade" },
    { name = "Kassiel Iylmrain" },
]
return_to = "naos"

