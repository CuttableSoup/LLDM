# A minimal scenario dedicated to exercising the generic "player" placeholder (see
# DM_Rules.py's PLAYER_PLACEHOLDER/_instance_entities) and apply_character_creation's own
# name/race/skill override (DM_CharacterCreation.py) -- deliberately not one of the "real"
# scenarios above (arena/tavern/field/dungeon/crypt), so a future rebalance of those can't
# accidentally change what this is testing, and so tests that boot a freshly-created,
# arbitrarily-named character aren't coupled to any of that content either. "player" resolves
# to whichever entity is currently self.player_name -- characters.toml's untouched "gladstone"
# by default, or a freshly-created character's own chosen name -- not a literal template
# lookup, which is exactly the mechanism this scenario exists to exercise. "wolf" gives every
# test here a real hostile target to roll an opposed check/combat round against -- its own
# local [[entity]] copy below, not creatures.toml (which no longer carries one; see its own
# comment), so this file stays fully self-contained too.
[scenario]
name = "The Testing Grounds"
description = "A bare, featureless room built only to exercise the game engine."
bands = 4
enclosed = true
entities = [
    { name = "player", band = 1 },
    { name = "wolf", band = 1 },
]

[[entity]]
name = "wolf"
supertype = "creature"
subtype = "animal"

max_hp = 16

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
willpower = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 6, pips = 0 }
strength = { dice = 2, pips = 0 }
brawling = { dice = 5, pips = 0 }
