# A [[location]]-graph scenario (see CLAUDE.md's "Scenarios and rooms" / location_schema.toml)
# -- an open, non-linear town in place of arena/tavern/field/dungeon/crypt's own single
# location. town_square and blacksmith are freeform (no [[location.room]] at all -- nothing in
# either ever needs real positioning); old_well opts into [[location.room]] instead, since its
# own goblin den is a genuine two-room fight. Every location's entities/creatures are defined
# locally below, same self-containment convention every other scenario file already follows.
[scenario]
name = "Millbrook"
description = "A small, unremarkable market town -- a square, a smithy, and an old well nobody quite trusts."
start_location = "town_square"

[[location]]
key = "town_square"
name = "The Market Square"
description = "A wide cobbled square ringed with stalls, the smell of woodsmoke and bread drifting from every corner."
kind = "district"
entities = [
    { name = "town crier" },
    { name = "market stall" },
]

[[location.encounter]]
name = "town square encounter"
trigger = "on_enter"
encounter = [
    { "A ragged child tugs at your sleeve, asking if you've seen their missing cat." = 30 },
    { "A street performer juggles knives for scattered coin." = 30 },
    { "generated_beggar" = 10 },
    { "nothing" = 30 },
]

[[location.exit]]
destination = "blacksmith"
aliases = [ "smithy", "forge" ]

[[location.exit]]
destination = "old_well"
aliases = [ "well" ]

[[location]]
key = "blacksmith"
name = "The Sooted Anvil"
description = "Heat rolls off the forge in the back; every surface is dark with soot and old iron."
kind = "building"
entities = [
    { name = "blacksmith" },
]
return_to = "town_square"

[[location]]
key = "old_well"
name = "The Old Well"
description = "A stone well, its rope ladder disappearing into darkness below."
kind = "district"
start_room = "shaft"
return_to = "town_square"

[[location.room]]
key = "shaft"
name = "The Well Shaft"
description = "A narrow stone shaft, the ladder groaning underfoot."
bands = 2
enclosed = true

[[location.room.encounter]]
name = "well shaft encounter"
trigger = "on_enter"
encounter = [
    { "goblin scout" = 30 },
    { "giant rat" = 25 },
    { "nothing" = 45 },
]

[[location.room.exit]]
band = 2
direction = "forward"
destination = "den"
arrival_band = 1

[[location.room]]
key = "den"
name = "The Goblin Den"
description = "A cramped, foul-smelling burrow lit by a single guttering torch."
bands = 2
enclosed = true
entities = [
    { name = "goblin", band = 1 },
]

[[location.room.exit]]
band = 1
direction = "back"
destination = "shaft"
arrival_band = 2

# ---------------------------------------------------------------------------------------------
# Entities -- local copies of every npc/creature this scenario references (see DM_Rules.py's
# load_scenario_definition/"Scenarios and rooms" in CLAUDE.md), so this one file is
# self-contained and doesn't need creatures.toml/characters.toml to actually be playable.

[[entity]]
name = "town crier"
supertype = "creature"
subtype = "humanoid"
description = "A booming-voiced man in a faded municipal sash, bellowing the day's news to anyone who'll listen."

max_hp = 12
currency = 2

languages = [ "common" ]
memories = [ "Has read the same three proclamations for a week straight" ]
quotes = [ "Hear ye! The miller's prices are up again!", "No news from the capital today, sadly." ]

[entity.attitudes]
default = [ 20, 0, 10, 0, 0, 0 ]

[entity.qualities]
body = "wiry"
gender = "male"
race = "human"
age = 41

[entity.skills]
charisma = { dice = 3, pips = 0 }
artistry = { dice = 2, pips = 0 }
observation = { dice = 2, pips = 0 }

[[entity]]
name = "market stall"
supertype = "object"
subtype = "prop"
description = "A wooden stall heaped with root vegetables, bundled herbs, and a crate of clucking hens."

[[entity]]
name = "blacksmith"
supertype = "creature"
subtype = "humanoid"
description = "Broad-shouldered and soot-streaked, hammer never far from hand."

max_hp = 22
currency = 30
inventory = [ "dagger" ]

languages = [ "common" ]
memories = [ "Apprenticed under the previous smith for a decade", "Refuses to work on feast days" ]
quotes = [ "Need something forged, or just looking?", "Careful, that edge is still hot." ]

[entity.attitudes]
default = [ 15, 10, 20, 0, 0, 0 ]

[entity.qualities]
body = "broad"
gender = "female"
race = "dwarf"
age = 47

[entity.skills]
strength = { dice = 4, pips = 0 }
appraise = { dice = 3, pips = 0 }
streetwise = { dice = 2, pips = 0 }
brawling = { dice = 3, pips = 0 }

[[entity]]
name = "goblin"
supertype = "creature"
subtype = "humanoid"
description = "A wiry, yellow-eyed creature in scavenged scraps of armor, baring filed teeth."

max_hp = 12

[[entity.abilities]]
name = "rusty knife"
supertype = "innate"
subtype = "weapon"
skill = "blades"
damage_tags = [ "slashing" ]
damage_value = { dice = 1, pips = 1, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "rusty knife"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
reflexes = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
strength = { dice = 2, pips = 0 }
blades = { dice = 3, pips = 0 }

[[entity]]
name = "goblin scout"
supertype = "creature"
subtype = "humanoid"
description = "Leaner and quicker than its kin, more interested in fleeing with plunder than fighting for it."

max_hp = 9

[[entity.abilities]]
name = "sharpened stick"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.50 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "sharpened stick"

[entity.skills]
fortitude = { dice = 1, pips = 0 }
reflexes = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
strength = { dice = 1, pips = 0 }
brawling = { dice = 2, pips = 0 }
stealth = { dice = 3, pips = 0 }

[[entity]]
name = "giant rat"
supertype = "creature"
subtype = "animal"
description = "A rat the size of a dog, matted fur bristling, incisors yellowed and long."

max_hp = 6

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
fortitude = { dice = 1, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 2, pips = 0 }
strength = { dice = 1, pips = 0 }
brawling = { dice = 2, pips = 0 }

# ---------------------------------------------------------------------------------------------
# entity_template -- the town square's own [[location.encounter]] result, fit to the player's
# own live challenge rating at instancing time (see CLAUDE.md's "NPC generation").
[[entity_template]]
name = "generated_beggar"
supertype = "creature"
subtype = "humanoid"
hint = "a down-on-their-luck beggar working the market square, asking for coin"
target_cr = "player"
cr_multiplier = 0.3

currency = { min = 0, max = 3 }

[entity_template.attitudes]
default = [
    { min = 0, max = 30 },   # disposition -- neutral to warm; never hostile
    0,                        # trust -- neutral
    -20,                      # confidence -- a little downtrodden
    0,                        # respect -- neutral
    0,                        # obligation -- neutral
    0,                        # intimacy -- neutral
]

[entity_template.qualities]
race = [
    { "human" = 60 },
    { "halfling" = 20 },
    { "dwarf" = 10 },
    { "elf" = 10 },
]
gender = [ { "male" = 50 }, { "female" = 50 } ]
age = { min = 25, max = 65 }
