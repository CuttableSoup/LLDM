[[entity]]
name = "wolf"
supertype = "creature"
subtype = "animal"

max_hp = 16

[[entity.abilities]]
name = "bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing" ]
damage_value = { dice = 1, pips = 0, bonus = "user.strength_damage" }

# Checked in order; the first entry whose requirements are all met is what the wolf
# does on its turn. An animal values its own life -- once it's taken real injury
# (hp_per_remain under 0.40, the same cutoff rules.toml's own "wounded" tier bottoms out
# at) it turns and runs rather than keep pressing a losing fight; only once it's
# effectively dead (hp_per_remain 0) does neither entry match and it simply stops acting.
# "action" names either a reserved movement word ("advance"/"retreat", resolved via
# move_toward_or_away) or one of the wolf's own abilities (below) -- an ability name is
# resolved the same way a player naming a technique directly is (resolve_named_ability).
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "bite"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
willpower = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 6, pips = 0 }
strength = { dice = 2, pips = 0 }
brawling = { dice = 5, pips = 0 }

[[entity]]
name = "fire elemental"
supertype = "creature"
subtype = "elemental"
description = "A churning column of living flame, molten cracks glowing across its body."

max_hp = 30

# Absolute, tag-matched block -- no roll, fire damage is simply negated (notes.txt's
# "poison damage tagged so undead are immune" example, applied to fire).
immunity_tags = [ "fire" ]
# Partial, rolled reduction against non-fire physical damage -- same shape as an item's
# armor_value/armor_tags, just innate to the creature instead of worn equipment.
resistance_value = { dice = 2, pips = 0 }
resistance_tags = [ "physical", "piercing", "bludgeoning", "slashing" ]
# Mirror image of resistance_value/resistance_tags: rolled bonus damage instead of
# reduction, on a matching tag -- a fire elemental takes extra damage from water.
vulnerability_value = { dice = 2, pips = 0 }
vulnerability_tags = [ "water" ]

[[entity.abilities]]
name = "flame touch"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "fire" ]
damage_value = { dice = 3, pips = 0, bonus = 0 }

[entity.skills]
fortitude = { dice = 4, pips = 0 }
willpower = { dice = 3, pips = 0 }
reflexes = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
strength = { dice = 4, pips = 0 }
brawling = { dice = 4, pips = 0 }

[[entity]]
name = "giant spider"
supertype = "creature"
subtype = "animal"
description = "An abdomen swollen to the size of a barrel, bristling with coarse hair, skitters along webbing strung wall to wall."

max_hp = 14

# Common trope, and a real payoff for gladstone's own "fireball" -- fire is the one thing
# this thing has no answer for.
vulnerability_value = { dice = 2, pips = 0 }
vulnerability_tags = [ "fire" ]

[[entity.abilities]]
name = "venomous bite"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "piercing", "poison" ]
damage_value = { dice = 2, pips = 0, bonus = "user.strength_damage" }

# Same self-preservation cutoff as the wolf's own -- see its comment above.
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "venomous bite"

[entity.skills]
fortitude = { dice = 2, pips = 0 }
willpower = { dice = 1, pips = 0 }
reflexes = { dice = 3, pips = 0 }
dodge = { dice = 4, pips = 0 }
strength = { dice = 1, pips = 0 }
brawling = { dice = 4, pips = 0 }

[[entity]]
name = "skeleton warrior"
supertype = "creature"
subtype = "undead"
description = "A yellowed skeleton in tattered mail, empty sockets fixed forward, a notched blade held in a bony grip."

max_hp = 20

# Undead -- poison means nothing to something with no blood left to poison (notes.txt's
# own "poison damage tagged so undead are immune" example, realized here for real).
immunity_tags = [ "poison" ]
# Old bones shatter under blunt force more readily than they resist a cutting edge.
vulnerability_value = { dice = 2, pips = 0 }
vulnerability_tags = [ "bludgeoning" ]

[[entity.abilities]]
name = "notched blade"
supertype = "innate"
subtype = "weapon"
skill = "blades"
damage_tags = [ "slashing" ]
damage_value = { dice = 2, pips = 1, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "notched blade"

[entity.skills]
fortitude = { dice = 3, pips = 0 }
willpower = { dice = 3, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 2, pips = 0 }
strength = { dice = 3, pips = 0 }
blades = { dice = 4, pips = 0 }

[[entity]]
name = "the bone warden"
supertype = "creature"
subtype = "undead"
description = "A towering, armor-fused skeleton bound in chains of dark iron, its ribcage packed with cold blue witchfire that never quite goes out."

max_hp = 50

immunity_tags = [ "poison" ]
# 1 die, not 2 -- live-tested at 2 dice against gladstone's longsword (1d+2 pips, roughly
# 4-9 raw) and it came out even or ahead almost every swing, netting 0 damage nearly every
# round and making melee-only play effectively unwinnable rather than just weaker than the
# fire/arcane approach. 1 die still meaningfully blunts a physical hit without walling it off.
resistance_value = { dice = 1, pips = 0 }
resistance_tags = [ "physical", "piercing", "slashing" ]
# The one thing this crypt's own guardian never learned to withstand -- gladstone's
# "fireball" is a real answer here, not just flavor.
vulnerability_value = { dice = 2, pips = 0 }
vulnerability_tags = [ "fire" ]

[[entity.abilities]]
name = "bone claw"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "slashing" ]
damage_value = { dice = 3, pips = 0, bonus = "user.strength_damage" }

[[entity.abilities]]
name = "grave chill"
supertype = "innate"
subtype = "weapon"
skill = "brawling"
damage_tags = [ "cold" ]
damage_value = { dice = 4, pips = 1, bonus = 0 }

# Escalates once badly hurt -- checked in order, first-match-wins (same convention
# rules.toml's own wound ladder and choose_behavior's docstring already use): a plain
# claw above 40% HP, a much harder desperate strike from 40% down to death.
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.4 },
]
action = "bone claw"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "grave chill"

[entity.skills]
fortitude = { dice = 6, pips = 0 }
# 3, not 5 -- at 5 dice this all but auto-beat gladstone's own 2-dice arcane on "fireball"'s
# opposed roll (arcane opposes willpower), making the one approach the vulnerability_tags
# above is supposed to reward a near-guaranteed whiff in practice. 3 is still a real defense.
willpower = { dice = 3, pips = 0 }
reflexes = { dice = 2, pips = 0 }
dodge = { dice = 2, pips = 0 }
strength = { dice = 5, pips = 0 }
brawling = { dice = 5, pips = 0 }

[[entity]]
name = "bandit"
supertype = "creature"
subtype = "humanoid"
description = "A road-worn brigand in mismatched leathers, a short bow slung across their back and a rusty shortsword at their hip."

max_hp = 18
currency = 12
inventory = [ "short bow", "rusty shortsword" ]

# Named directly rather than as [[entity.abilities]] inline tables -- "short bow"/"rusty
# shortsword" are real items.toml entities (see resolve_ability: a plain string ability entry
# is looked up in self.entities the same way an equipped item or a spells.toml/techniques.toml
# name is, items included), so their own skill/range/damage_value/damage_tags are used as-is,
# no duplication needed.
abilities = [ "short bow", "rusty shortsword" ]

# The worked "distance_to_target" example CLAUDE.md's own "Status and conditions" section and
# Rules/Fantasy/reference/entity_schema.toml describe, made real: a bandit favors its bow while
# there's any gap at all to its target, and only draws its sword once that gap closes to zero
# -- checked ahead of the plain "always attack" entry, the same declaration-order,
# first-match-wins convention every other behavior list uses. If the target is out past the
# short bow's own range = 4, resolve_behavior_action's own implicit fallback (no entry needed
# here) closes the distance instead of loosing an arrow that can't land. A bandit values its
# own life same as the wolf/giant spider above -- self-preservation, not loyalty, is what
# brought it here -- so it flees rather than fights to the death once badly hurt.
[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<", value = 0.40 },
]
action = "retreat"

[[entity.behavior]]
requirements = [
    { field = "distance_to_target", operator = ">", value = 0 },
]
action = "short bow"

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "rusty shortsword"

[entity.skills]
missiles = { dice = 4, pips = 0 }
blades = { dice = 3, pips = 0 }
dodge = { dice = 3, pips = 0 }
fortitude = { dice = 2, pips = 0 }
strength = { dice = 2, pips = 0 }