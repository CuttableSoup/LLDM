# Shared environment catalog (see docs/downtime.md's "Travel") -- a flat Rules/Fantasy/*.toml
# file like npc_keywords.toml, referenced by name from world_map.toml's own [[region]] entries,
# never instanced or entered directly itself.
#
# Each environment owns a day and a night encounter table -- the exact same weighted-choice
# [ { "choice" = weight }, ... ] shape [[location.encounter]]'s own "encounter" field already
# uses (a real [[entity]]/[[entity_template]] name, the reserved "nothing", or a flavor-only
# string; see DM_Encounters.py), resolved via the same _resolve_one_encounter -- just once per
# block of travel actually spent inside this environment (DM_Travel.py), rather than once on
# location entry. Neither table carries a "trigger"/"name" field the way [[location.encounter]]
# does -- travel is the only thing that ever rolls these, so there's nothing to gate on.
#
# watch_difficulty is the flat-difficulty "observation" check rolled against a hostile night
# block -- see docs/downtime.md's "Night watch and surprise" for the shipped mechanic
# (DM_Travel.py's _roll_night_watch, shared by both travel and rest).
[[environment]]
name = "plains"
watch_difficulty = 9
day_encounter = [
    { "wild boar" = 15 },
    { "coyote" = 15 },
    { "A hawk wheels lazily overhead on a thermal, uninterested in you." = 20 },
    { "nothing" = 50 },
]
night_encounter = [
    { "coyote" = 25 },
    { "A distant howl carries across the dark grassland." = 20 },
    { "nothing" = 55 },
]

# Golarion's Lost Coast -- referenced only by world_map.toml's own "the Lost Coast" region, which
# in turn is only ever reached from lost_coast.toml (see that scenario's own docstring). "goblin"
# is that scenario's own local entity, the same "environment names a scenario-local encounter"
# precedent "plains" above already sets with wild boar/coyote, just scoped to one scenario instead
# of shared across every scenario in the setting.
[[environment]]
name = "lost_coast_wilds"
watch_difficulty = 9
day_encounter = [
    { "goblin" = 20 },
    { "wild boar" = 10 },
    { "Gulls wheel and shriek over the tideline, indifferent to your passing." = 20 },
    { "nothing" = 50 },
]
night_encounter = [
    { "goblin" = 25 },
    { "A cook-fire's cackling laughter drifts from somewhere in the scrub, then cuts off." = 15 },
    { "nothing" = 60 },
]
