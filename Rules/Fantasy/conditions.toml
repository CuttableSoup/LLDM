# Status/condition definitions for the Fantasy setting -- split out of rules.toml so
# the (large) [[condition]] catalog lives on its own. load_rules merges every *.toml in a
# setting directory by top-level key, so nothing else changes: a [[condition]] table
# must simply appear in exactly one file here (a second file authoring "condition" would
# overwrite this one, not extend it).

[[condition]]
name = "stunned"
modifier = { dice = -1, pips = 0, bonus = 0 }

# Applied by DM_Travel.py's own _roll_night_watch (docs/downtime.md's "Night watch and
# surprise") to every is_party member when a night block's own hostile encounter catches a
# failed (or unattempted, for a solo traveler) watch -- a heavier penalty than "stunned" since
# it represents being caught asleep/unprepared, not just dazed mid-fight. Applied with
# duration = "rounds", length = 1, so run_round_upkeep's own generic condition tick
# (Combat_Resolution.tick_condition_durations) clears it the first round it's carried into.
[[condition]]
name = "surprised"
modifier = { dice = -2, pips = 0, bonus = 0 }

[[condition]]
name = "wounded"
modifier = { dice = -1, pips = 0, bonus = 0 }

[[condition]]
name = "severe"
modifier = { dice = -2, pips = 0, bonus = 0 }

[[condition]]
name = "incapacitated"
modifier = { dice = -3, pips = 0, bonus = 0 }

[[condition]]
name = "mortal"
modifier = { dice = -3, pips = 0, bonus = 0 }

[[condition]]
name = "dead"
modifier = { dice = 0, pips = 0, bonus = 0 }

[[condition]]
name = "locked"
modifier = { dice = 0, pips = 0, bonus = 0 }

[[condition]]
name = "jammed"
modifier = { dice = 0, pips = 0, bonus = 0 }

# A per-round upkeep effect, not a roll modifier -- run_round_upkeep (DM_Status.py) rolls
# upkeep_heal once per combat round for every entity carrying this condition and heals it,
# unless upkeep_blocked_by_tags overlaps whatever damage tags it was hit with this same round
# (recorded by calculate_damage, DM_Combat.py -- see creatures.toml's "troll", which seeds this
# permanently via its own [entity.conditions.regenerating]). The Pathfinder "Regeneration
# 10 (fire)" shape: heals every round, except a round it's touched by fire at all.
[[condition]]
name = "regenerating"
upkeep_heal = { dice = 2, pips = 0, bonus = 0 }
upkeep_blocked_by_tags = [ "fire" ]

# The conditions maneuvers.toml's universal abilities apply via their own on_pass programs --
# what gives "shaken"/"prone"/"sundered_weapon" real mechanical teeth rather than
# narrated-only flavor, the same way "stunned"/"wounded" already work.
[[condition]]
name = "shaken"
modifier = { dice = -1, pips = 0, bonus = 0 }

[[condition]]
name = "prone"
modifier = { dice = -1, pips = 0, bonus = 0 }

# "disarmed" is deliberately NOT a [[condition]] -- being disarmed is dropping your weapon, an
# instantaneous equipment change (unequip + place in the room), not a lasting debuff to model as
# a condition. maneuvers.toml's own "disarm" maneuver is commented out until that unequip/drop
# program op actually exists; no [[condition]] entry is needed until it applies one again.

[[condition]]
name = "sundered_weapon"
modifier = { dice = -1, pips = 0, bonus = 0 }

# maneuvers.toml's own "bull rush"/"grapple"/"dirty trick"/"feint" -- Pathfinder's own CMB
# maneuvers, each applying its own real dice penalty via its on_pass program the same way
# trip/disarm/sunder already do.
[[condition]]
name = "staggered"
modifier = { dice = -1, pips = 0, bonus = 0 }

[[condition]]
name = "grappled"
modifier = { dice = -2, pips = 0, bonus = 0 }

# "applies_to" (a list of skill names) scopes this condition's own modifier to only those
# skills' rolls -- get_condition_modifier (Combat_Resolution.py) skips it entirely for any
# other skill. Pathfinder's Dazzled is sight-only; without "applies_to" this would otherwise
# be an ordinary global Pattern C penalty (see pathfinder_mapping.toml's condition_pattern "C").
[[condition]]
name = "dazzled"
modifier = { dice = -1, pips = 0, bonus = 0 }
applies_to = [ "observation" ]

[[condition]]
name = "flat_footed"
modifier = { dice = -1, pips = 0, bonus = 0 }

# maneuvers.toml's own "pin" -- only ever applied to an already-"grappled" target. Pathfinder's
# real "pinned" condition doesn't just penalize a roll, it stops the target from acting at all
# (beyond trying to escape) -- prevents_action = true is the generic mechanism for that
# (is_action_prevented, DM_Status.py), checked by DM_Core.py's _resolve_roll (the player's own
# turn -- ActionPreventedOutcome, no roll) and DM_Combat.py's resolve_behavior_action (a
# creature/ally's own turn -- treated exactly like "no behavior currently matches"). "pinned"
# is the first (and, today, only) [[condition]] to author this; the modifier stays too, in
# case a future mechanism (ex: an opposed escape attempt) ever rolls against a pinned target
# directly rather than just skipping their turn outright.
[[condition]]
name = "pinned"
modifier = { dice = -4, pips = 0, bonus = 0 }
prevents_action = true

# A presence flag only, same "no modifier at all" shape "locked"/"jammed" already use -- being
# cursed (items.toml's cursed dagger, via its own on_interact.equip) is a narrative/mechanical
# fact read elsewhere (a future curse-specific check), not itself a dice penalty.
[[condition]]
name = "cursed"
modifier = { dice = 0, pips = 0, bonus = 0 }

# creatures.toml's troll applies this to itself via its own on_damage program once it drops
# below half HP without having been burned first -- see creatures.toml's own "A troll's temper".
[[condition]]
name = "enraged"
modifier = { dice = 1, pips = 0, bonus = 0 }

# A per-round upkeep effect (Pattern E, same shape "regenerating" already uses), applied by
# "flame wall zone" below to whoever currently shares spells.toml's "flame wall" own band --
# duration = "rounds"/length = 1 there is what makes this a zone rather than a one-time hit: it
# lapses the instant an entity is no longer co-band, reapplied fresh each round they stay put.
[[condition]]
name = "burning"
upkeep_damage = { dice = 2, pips = 0, bonus = 0 }

# Pathfinder's Filth Fever (Core Rulebook) -- the "periodic_test" shipped worked example
# (Rules/Pathfinder/reference/pathfinder_mapping.toml's Poison/Dying-Stable-Disabled rows), applied
# by creatures.toml's "giant rat" bite. Real Filth Fever: Fortitude DC 12; onset 1d3 days;
# frequency 1/day; 1d3 Dex/1d3 Con damage on a failed save; cured by 2 CONSECUTIVE successes.
# "onset" is flattened from "1d3 days" to a fixed 2 -- the same "flatten a die roll into one
# authored number" precedent get_concealment's own miss_chance already sets; the engine also
# doesn't separately model Pathfinder's own "initial exposure save" (whether you catch it at
# all on the bite that exposes you) -- on_hit_condition's exposure is unconditional, and the
# onset-then-first-save flow below is the first real chance to shake it off, an honest
# simplification of the same shape rather than a second, redundant roll. Dex/Con ability damage
# is mapped onto "finesse"/"fortitude" -- literal skills, not a whole [[skill_group]] drained at
# once, the same precedent the shipped "energy drained" condition already sets (a [[skill_group]]
# is for a roll-time modifier scoped across a cluster of rolls, not a permanent stat loss).
# supertype/subtype classify this as an "affliction"/"disease" -- matches_supertype_or_subtype
# (reused unchanged against the condition catalog, not just the entity one) is what lets
# spells.toml's "cure disease" remove whichever disease is active without naming it.
[[condition]]
name = "filth fever"
supertype = "affliction"
subtype = "disease"

[condition.periodic_test]
skill = "fortitude"
difficulty = 12
cure_after_successes = 2

[condition.periodic_test.onset]
unit = "days"
length = 2

[condition.periodic_test.interval]
unit = "days"
length = 1

[condition.periodic_test.on_fail]
drain = [
    { skill = "finesse", dice = 1, pips = 0 },
    { skill = "fortitude", dice = 1, pips = 0 },
]

# Pathfinder's Polymorph/Baleful Polymorph line -- the "form" field (Combat_Resolution.py's own
# _apply_form_override) is the "form override" mechanism Rules/Fantasy/reference/
# pathfinder_mapping.toml's own Polymorph row used to flag as having no engine equivalent: on
# first gain it snapshots FORM_OVERRIDE_FIELDS (name/description/supertype/subtype/skills/
# abilities/max_hp/medium/damage_value/damage_tags/tags/resistance_*/immunity_tags/
# vulnerability_*) off the target, overwrites them with the named entity's own values, and
# dismiss_condition restores the exact snapshot the moment this condition ends -- gear,
# inventory, currency, attitudes, and current hp all stay with the person, not the form (see
# FORM_OVERRIDE_FIELDS' own comment). subtype = "transmutation" classifies this by KIND, the
# same way "filth fever" above classifies itself as a "disease" -- spells.toml's own "break
# enchantment" targets {subtypes = ["transmutation"]} without ever naming either condition
# below directly, the same trick "cure disease" already uses against filth fever.
[[condition]]
name = "polymorphed"
subtype = "transmutation"
form = "coyote"

# A beneficial counterpart sharing the exact same mechanism, authored as its own condition (a
# fixed "form" per condition rather than a caster's free choice of any creature -- the engine
# has no per-cast form-picking UI, the same static-TOML-spell simplification already accepted
# elsewhere) so the same primitive covers both directions of a Polymorph line, not just the
# hostile one.
[[condition]]
name = "wild shape"
subtype = "transmutation"
form = "wild boar"
