[[entity]]
name = "longsword"
supertype = "object"
subtype = "weapon"
skill = "blades"
description = "A well-balanced steel blade, kept sharp and ready."
# A single candidate slot, or a list -- resolve_equip_slot (DM_Inventory.py) picks the first
# one valid for the equipping entity's own supertype/subtype (rules.toml's [[equip_slot]]).
# One-handed, so either hand will do.
equip_slot = [ "rhand", "lhand" ]
max_hp = 10
# No "range" field at all -- melee, usable only in the same band as the target (see
# DM_Movement.py's "Movement and range"; is_in_range treats a missing range as 0).
damage_value = { dice = 1, pips = 2, bonus = "strength_damage" }
damage_tags = [ "slashing" ]
bulk = 1
value = 15
[entity.skills]
fortitude = { dice = 3, pips = 0 }

[[entity]]
name = "spear"
supertype = "object"
subtype = "weapon"
skill = "polearms"
description = "A long-hafted spear, its iron head kept honed for thrusting."
equip_slot = "rhand"
max_hp = 8
# Reach weapon -- usable one band beyond plain melee (see DM_Movement.py's "Movement and
# range"), the one deliberate exception to "melee only works in the same band as the target".
range = 1
damage_value = { dice = 1, pips = 1, bonus = "strength_damage" }
damage_tags = [ "piercing" ]
bulk = 1
value = 12
[entity.skills]
fortitude = { dice = 3, pips = 0 }

[[entity]]
name = "long bow"
supertype = "object"
subtype = "weapon"
skill = "missiles"
description = "A polished longbow, strung and ready to loose an arrow."
equip_slot = "rhand"
max_hp = 5
# In bands, not meters -- reaches every band a typical room/field has (see the "bands"
# scenario field), same "no per-tier accuracy modifier, just in-range-or-not" rule every
# ranged ability follows now.
range = 6
damage_value = { dice = 2, pips = 2, bonus = 0 }
damage_tags = [ "piercing" ]
bulk = 1
value = 10
[entity.skills]
fortitude = { dice = 1, pips = 0 }

[[entity]]
name = "short bow"
supertype = "object"
subtype = "weapon"
skill = "missiles"
description = "A stubby hunting bow, its string frayed but still taut."
equip_slot = "rhand"
max_hp = 4
# Shorter reach than the long bow -- still well past melee, just not the same all-room
# coverage (see DM_Movement.py's "Movement and range").
range = 4
damage_value = { dice = 1, pips = 2, bonus = 0 }
damage_tags = [ "piercing" ]
bulk = 1
value = 6
[entity.skills]
fortitude = { dice = 1, pips = 0 }

[[entity]]
name = "rusty shortsword"
supertype = "object"
subtype = "weapon"
skill = "blades"
description = "A pitted, poorly maintained blade, more intimidating than sharp."
equip_slot = [ "rhand", "lhand" ]
max_hp = 6
damage_value = { dice = 1, pips = 1, bonus = "strength_damage" }
damage_tags = [ "slashing" ]
bulk = 1
value = 3
[entity.skills]
fortitude = { dice = 2, pips = 0 }

[[entity]]
name = "chain mail"
supertype = "object"
subtype = "armor"
description = "A shirt of interlocking steel rings, worn for protection in battle."
equip_slot = "chest"
max_hp = 20
armor_value = { dice = 2, pips = 0 }
armor_tags = [ "physical", "piercing", "bludgeoning", "slashing" ]
bulk = 1
value = 15
[entity.skills]
fortitude = { dice = 5, pips = 0 }

[[entity]]
name = "health potion"
supertype = "object"
subtype = "potion"
# Nondescript on purpose -- "healing" (below) is a hidden property revealed only once
# identified, same mechanism as the cursed dagger's own [entity.test] ("reveal" -> tags
# read back once is_identified is true). The description here still needs to be non-empty
# (an empty one gets silently dropped from a container's "contents" -- see the items.toml
# comment history), just not one that gives away the answer up front.
description = "A small glass vial holding a swirl of murky liquid. Whatever it does isn't obvious just by looking."
tags = [ "healing" ]
# Opts into DMCore._resolve_use_intent's generic "use" handling (see the module note there --
# gated on this flag, not subtype, so a future non-potion usable item, ex: a wand, doesn't
# need a "potion" subtype just to qualify). No "charges" field -- absent means single-use,
# spent entirely on the one use (see _consume_charge). "replace_with" is what's left in
# inventory afterward: an empty vial, not nothing.
usable = true
replace_with = "glass vial"
bulk = 0
value = 15
[entity.skills]
healing = { dice = 5, pips = 0 }
fortitude = { dice = 1, pips = 0 }

# Untrained-friendly on purpose (difficulty 4, vs the cursed dagger's 8) -- neither appraise
# nor medicine is anything gladstone starts trained in, and a mundane potion shouldn't need
# real expertise to eventually work out, unlike confirming a magical curse.
[entity.test]
difficulty = 4
skill = [ "appraise", "medicine" ]
blocks_if_condition = "identified"

[entity.test.pass]
reveal = true

[[entity]]
name = "chest"
supertype = "object"
subtype = "container"
description = "A stout, iron-bound chest, padlocked shut."
max_hp = 50
bulk = 5
value = 10
currency = 20
inventory = [ "cursed dagger" ]

[entity.conditions.locked]
duration = "permanent"

[entity.conditions.closed]
duration = "permanent"

[entity.test]
difficulty = 12
skill = [ "finesse" ]
requires_condition = "locked"
blocks_if_condition = "jammed"

[entity.test.pass]
dismiss_condition = "locked"

[entity.test.fail]
condition = "jammed"
duration = "permanent"
dismiss = ""

[entity.skills]
fortitude = { dice = 5, pips = 0 }

[[entity]]
name = "cursed dagger"
supertype = "object"
subtype = "weapon"
skill = "blades"
description = "A wickedly curved dagger, its blade etched with faintly glowing runes that seem to shift when unwatched."
equip_slot = [ "rhand", "lhand" ]
max_hp = 8
damage_value = { dice = 1, pips = 1, bonus = "strength_damage" }
damage_tags = [ "slashing" ]
tags = [ "cursed" ]
bulk = 1
value = 5
[entity.skills]
fortitude = { dice = 2, pips = 0 }

# An arcane check against the item itself (not the chest/scene it's sitting in) -- reachable
# once the dagger is either in the player's own inventory or sitting in an unlocked, open
# container (see DMCore._resolve_item_test_target). blocks_if_condition stops a repeat check
# from re-rolling something already known. "reveal" (apply_test_outcome) marks it "identified"
# but doesn't itself say *what* was revealed -- narration reads that back off the entity's own
# "tags" field once identified, rather than duplicating it here.
[entity.test]
difficulty = 8
skill = [ "arcane" ]
blocks_if_condition = "identified"

[entity.test.pass]
reveal = true

# Traps: a skill check against the object itself, same [entity.test] mechanism as a chest's
# lock, but "fail" now carries a "damage" key (apply_test_outcome, DM_Status.py) that deals
# real damage to the player via the same calculate_damage/evaluate_statuses path any weapon
# hit takes. "armed" starts active (like a chest's own "locked"); a pass dismisses it (the
# trap is now safe forever); a fail applies "triggered" instead, which blocks_if_condition
# then keeps future attempts from re-rolling and re-damaging the exact same spent trap.
#
# "hidden" starts active too -- unlike "armed" (a mechanical gate on [entity.test]), it's
# purely about the LLM's own narration prompt: while active, this entity is left out of the
# roster _describe_scenario_characters builds (and out of any action's own "defender_details"
# -- see is_hidden/DM_Core.py's _attach_defender_details), so the trap isn't spoiled to the
# player before they'd have any in-fiction reason to know it's there. [entity.notice] is the
# check that clears it: rolled automatically, with no player input, the moment this entity is
# instanced (RulesMixin._auto_roll_notice, DM_Rules.py) -- not player-initiated like
# [entity.test]'s own disarm check below, which still requires "armed" and works whether or
# not "hidden" has cleared yet (a lucky blind stab can disarm something never noticed).
[[entity]]
name = "dart trap"
supertype = "object"
subtype = "trap"
description = "A row of pinprick holes lines the wall at waist height, aimed squarely across the doorway."
max_hp = 5

[entity.conditions.armed]
duration = "permanent"

[entity.conditions.hidden]
duration = "permanent"

[entity.notice]
skill = "observation"
difficulty = 4

[entity.test]
difficulty = 9
skill = [ "finesse", "acrobatics" ]
requires_condition = "armed"
blocks_if_condition = "triggered"

[entity.test.pass]
dismiss_condition = "armed"

[entity.test.fail]
condition = "triggered"
duration = "permanent"
dismiss = ""
# 3 dice, not 2 -- chain mail's own armor_value/armor_tags already reduces "piercing" by
# 2 dice, and a trap that a full suit of armor shrugs off entirely wouldn't be much of a
# trap. Still less than the scythe trap's own 3 dice against "slashing" armor coverage --
# no difference there, this is just about clearing chain mail's reduction, not escalation.
damage = { dice = 3, pips = 0, bonus = 0 }
damage_tags = [ "piercing" ]

[[entity]]
name = "scythe trap"
supertype = "object"
subtype = "trap"
description = "A rusted blade hangs half-hidden in the shadows overhead, strung on a taut wire across the passage."
max_hp = 8

[entity.conditions.armed]
duration = "permanent"

[entity.conditions.hidden]
duration = "permanent"

# Overhead, not waist-height like the dart trap -- a step harder to catch on a glance, hence
# the steeper notice difficulty (6 vs. the dart trap's 4).
[entity.notice]
skill = "observation"
difficulty = 6

[entity.test]
difficulty = 10
# reflexes is listed first since it's what gladstone (and any similarly-built character) is
# actually trained in -- 2 dice, vs untrained 1d6 for dodge/acrobatics, which would make this
# trap nearly unbeatable on its own (max roll 6, never clearing a difficulty above 6). "dodge"
# is still included because it's the single most natural verb for evading a swinging blade --
# without it, "I dodge the trap" wouldn't match this test.skill list at all and would
# silently fall through to a harmless, mechanically-meaningless auto-success instead of a
# real (if difficult) attempt.
skill = [ "reflexes", "dodge", "acrobatics" ]
requires_condition = "armed"
blocks_if_condition = "triggered"

[entity.test.pass]
dismiss_condition = "armed"

[entity.test.fail]
condition = "triggered"
duration = "permanent"
dismiss = ""
damage = { dice = 3, pips = 0, bonus = 0 }
damage_tags = [ "slashing" ]

