[strength_damage]
skill = "strength"
divisor = 2

# [[skill_group]] -- lets a [[condition]]'s own "applies_to" or an item's own
# "equipped_skill_bonus.skill" (get_skill_group_members, Combat_Resolution.py) address a whole
# cluster of skills by one shared name, standing in for the attribute layer this engine
# deliberately doesn't have: Pathfinder's Bull's Strength (+4 Str) buffs every Strength-based
# skill/check at once, not one named skill -- authoring "strength" here is how the same shape
# is expressed without building a real attribute stat. A name that matches no group here is
# still just a literal skill name, unchanged -- this table is purely additive.
[[skill_group]]
name = "strength"
skills = [ "strength", "athletics", "blades", "axes", "brawling" ]

[[skill_group]]
name = "dexterity"
skills = [ "finesse", "acrobatics", "dodge", "escape" ]

# Carry-capacity formula -- get_max_bulk (DM_Rules.py) reads this once per lookup: min_bulk plus
# this entity's own "skill" dice times mod_multiplier (ex: a 2D strength character here carries
# 3 + 2*2 = 7 bulk before "take"/"trade"/a ground "take" starts refusing with reason
# "bulk_exceeded" -- DM_Inventory.py's own _bulk_would_be_exceeded, checked against
# get_current_bulk's live sum of every entity_schema.toml "bulk" value currently in the player's
# own inventory). Absent entirely (ex: Rules/Zombie/, which authors no [bulk] table of its own)
# means get_max_bulk returns None and the cap is never enforced at all -- same "a setting that
# never opts in just doesn't get the mechanic" precedent [[equip_slot]] already sets.
[bulk]
skill = "strength"
min_bulk = 3
mod_multiplier = 2
# Whether a mounted rider's own carried inventory bulk (get_current_bulk(rider)) also counts
# against their mount's own load, on top of the rider's own flat "bulk" (body weight) --
# see entity_schema.toml's own "mount"/"bulk" comments and DM_Rules.py's get_current_bulk.
# Absent defaults to true. A setting that wants a mount to only ever answer for rider bodies,
# never gear, sets this false.
count_rider_gear = true

# Seeing someone commit a crime (DM_Law.py) -- applied to each witness except the victim (who
# already gets theft/assaulted), toward the offender, scaled by [law].witness_severity for that
# crime. Fear and coldness, not a fight: even a murder witness lands frightened, not hostile.
[[attitude_event]]
name = "witnessed_crime"
disposition = -60
threat = -60
familiarity = -20

# Law enforcement (DM_Enforcement.py). "resisted_arrest" goes to every enforcer present when the
# player resists or flees an arrest, "wanted_dead" to an enforcer who recognizes someone wanted
# past the polity's kill_on_sight_at. Both carry assaulted's own cap, so they reach is_hostile's
# -100 and the existing combat machinery takes over. "refused_bribe" is an enforcer turning a
# bribe down -- insulted, not provoked.
[[attitude_event]]
name = "resisted_arrest"
disposition = -200
threat = -20
familiarity = -10
cap = 200

[[attitude_event]]
name = "wanted_dead"
disposition = -200
threat = -20
familiarity = 0
cap = 200

[[attitude_event]]
name = "refused_bribe"
disposition = -15
threat = 0
familiarity = -5

# Laws (docs/law.md). Which laws apply is a polity's own [[polity.law]] list (polities.toml),
# plus a location's own [[location.law]]; this table holds what every polity shares:
#   witness_skill / disguise_skill -- a witness's observation roll must beat a disguise's own
#     quality (the "disguise" roll that made it) to see through it.
#   recognition_skill -- what a witness rolls to recognize who someone is when no skill's
#     lore_types covers them (a person, not a creature kind).
#   spell_identify_base -- a witness identifies a cast spell with the lore_types skill covering
#     spells (arcane) against this plus the spell's own "level", if authored.
#   [[law.recognition]] -- how hard someone is to recognize, by |base acclaim| + |polity
#     acclaim| (highest band reached wins). "automatic" needs no roll at all; below every band
#     (or 0 acclaim) nobody can recognize them.
[law]
witness_skill = "observation"
disguise_skill = "disguise"
recognition_skill = "streetwise"
spell_identify_base = 15
# How hard witnessing each crime hits a witness's attitude toward the offender -- the
# "witnessed_crime" [[attitude_event]]'s magnitude (0..1).
witness_severity = { theft = 0.25, assault = 0.5, murder = 1.0, banned_ability = 0.4, banned_presence = 0.3 }
# Enforcement (DM_Enforcement.py; docs/law.md "Enforcement"):
#   jail_blocks_per_unit -- a surrender that can't cover the bounty serves the rest as jail time,
#     this many blocks per unit of value unpaid (rounded up, at least 1).
#   bluff_witnessed_modifier -- added to a bluff's difficulty when the enforcer saw the crime.
#   [[law.bribe]] -- how an offer's share of the bounty shifts a bribe's difficulty (the
#     highest min_share reached wins); below every band the offer is refused out of hand.
jail_blocks_per_unit = 0.2
bluff_witnessed_modifier = 5

[[law.recognition]]
min_acclaim = 1
tier = "very difficult"

[[law.recognition]]
min_acclaim = 3
tier = "difficult"

[[law.recognition]]
min_acclaim = 6
tier = "moderate"

[[law.recognition]]
min_acclaim = 10
tier = "easy"

[[law.recognition]]
min_acclaim = 15
tier = "very easy"

[[law.recognition]]
min_acclaim = 20
tier = "automatic"

[[law.bribe]]
min_share = 1.0
modifier = -5

[[law.bribe]]
min_share = 0.5
modifier = 0

[[law.bribe]]
min_share = 0.25
modifier = 5

# XP award formula -- _award_xp_for_defeat (DM_Combat.py) reads this once per kill, the moment a
# hostile-to-the-player entity's HP first reaches 0 (calculate_damage's own "previous_hp > 0,
# now 0" check). The base amount is the defeated entity's own "exp" field if it authored one
# (entity_schema.toml), else its live get_challenge_rating -- same "decided live, not fixed at
# creation time" value get_party_challenge_rating already reflects. That base is multiplied by
# xp_multiplier, then either split evenly across every current is_player/is_party member
# (divide_between_party = true, floor division) or credited to each one in full
# (divide_between_party = false, the shipped Fantasy default -- undivided XP mirrors how
# loot_entity/transfer_currency already hand a defeated/looted entity's full currency to
# whoever loots it, never splitting it first). Absent entirely defaults to xp_multiplier = 1,
# divide_between_party = false -- XP tracking itself isn't gated behind authoring this table the
# way [bulk]'s own cap is; a setting that never authors [xp] still accumulates XP on its party
# members' own "exp" field, just at the plainest possible rate.
[xp]
xp_multiplier = 1
divide_between_party = false

# The block clock underlying downtime (see docs/downtime.md) -- DMCore.current_block is a single
# monotonic counter of 8-hour "blocks" elapsed since the scenario started; DMCore.get_time_state
# derives day/block-in-day/hour/is_day from it against these three tunables alone, nothing else
# stored redundantly. hours_per_day and blocks_per_day are independent (a day doesn't have to
# divide evenly among its blocks, though it does by default: 24 / 3 = an 8-hour block).
# daylight_hours is read against elapsed hours *within* the current day, not block index parity --
# a block counts as daytime if it starts before daylight_hours (16 here, so the first two 8-hour
# blocks are day and the third, starting at hour 16, is night). Absent entirely defaults to
# exactly these three values, the same "still works with nothing authored" fallback [xp] gets.
# starting_year is the calendar year (see [[calendar_month]] below) day 0 falls in -- 4726 AR,
# Golarion's current year as of the Age of Lost Omens (Pathfinder 2e core).
[time]
hours_per_day = 24
daylight_hours = 16
blocks_per_day = 3
starting_year = 4726

# Golarion's own real-world calendar (Pathfinder core) -- 12 months, 365 days, no leap year, in
# calendar order. get_calendar_date/get_time_state (DM_Time.py) convert get_time_state()'s own
# absolute "day" counter (days elapsed since the scenario started, day 0 = [time]'s own
# starting_year's Abadius 1 -- 4726 AR above) into {year, month, day_of_month} against this
# table, wrapping into a new year once every month's own "days" (summed, not hardcoded to 365)
# has been used up. Entirely optional, the same "still works unauthored" fallback every other
# optional rules.toml table already follows -- absent entirely (ex: Rules/Zombie/, which
# authors no calendar at all), get_calendar_date returns None and get_time_state's own
# "date_label" falls back to the bare "day N" text it always used before this existed.
[[calendar_month]]
name = "Abadius"
days = 31

[[calendar_month]]
name = "Calistril"
days = 28

[[calendar_month]]
name = "Pharast"
days = 31

[[calendar_month]]
name = "Gozran"
days = 30

[[calendar_month]]
name = "Desnus"
days = 31

[[calendar_month]]
name = "Sarenith"
days = 30

[[calendar_month]]
name = "Erastus"
days = 31

[[calendar_month]]
name = "Arodus"
days = 31

[[calendar_month]]
name = "Rova"
days = 30

[[calendar_month]]
name = "Lamashan"
days = 31

[[calendar_month]]
name = "Neth"
days = 30

[[calendar_month]]
name = "Kuthona"
days = 31

# Overworld travel speed (see docs/downtime.md's "Travel") -- distinct from combat's own
# per-band-action "speed" (DM_Movement.py's advance_or_retreat), which never applies outside a
# room's own band line. Grid units (world_map.toml's own region bounds, a [[location]]'s own
# "grid") covered per block of travel time; an entity may override this with its own
# "travel_speed" field (ex: a race with a slower or faster gait), else falls back to
# default_speed here. A party paces to its slowest is_player/is_party member currently present
# (see DM_Travel.py's _party_travel_speed), not just the player's own value.
#
# 24 -- not an arbitrary round number, but the one that lets a grid unit read as a literal mile:
# Pathfinder's own core rule is 3 miles/hour of normal (x1) overland movement, and an 8-hour
# block (see [time] above, blocks_per_day = 3) is 24 miles at that pace. Every gridded
# [[location]]/[[region]]/[[road]] in Rules/Fantasy/ is placed under this same "1 unit = 1 mile"
# convention (see docs/downtime.md's "Terrain, roads, and polities").
[travel]
default_speed = 24

# Point-buy constants for character creation (Character_Creation.py/DM_CharacterCreation.py).
# A new character's starting dice come entirely from whichever race is picked -- every race
# in races.toml spells out an absolute dice count for every skill (human's own is a flat 2D
# everywhere; there's no separate "base_dice" constant here for any race to fall back to).
# What every race *does* share is how much is left to spend on top: pool_dice free dice to
# allocate across skills however the player likes, capped at max_allocation_per_skill in any
# single skill (so a 15D pool can't all pile into one skill).
# Narration-driven population. A location that opts in (population = "narrated") gets its
# scene-setting narration (scenario intro, arrival, move) written longer and asked to show the
# place populated; a second, slower model call then reads that prose and turns the ordinary
# people it mentions into real, addressable characters while the player is still reading (see
# DM_Improvisation.py's _on_scene_narration_ready). Absent or enabled = false turns the whole
# thing off for a setting.
[narration_population]
enabled         = true
# Which narrations are read: a label kind ("skill_response", "item_interaction") or one item
# intent ("move"). Not just arrivals -- people the narrator introduces mid-scene have to become
# real too, or the player can't address or fight them. max_per_scene bounds the extra calls.
triggers        = [ "scenario_intro", "item_interaction", "skill_response", "clarification", "encounter" ]
max_per_scene   = 4                                        # narrated people alive in one scene
prose_sentences = "5-6"                                    # how long those narrations run

# What the narrator may write freely, and how strong it may make them. Skills, HP, abilities,
# behavior and hostility are never in this list: the engine sets them, so nothing the narrator
# writes can move combat balance. A narrated person is always a non-hostile bystander.
[narration_population.limits]
freeform     = [ "name", "occupation", "description", "race", "gender", "age", "languages", "memories", "voice" ]
max_cr_share = 0.25                                        # of the player's challenge rating

[character_creation]
pool_dice = 15
max_allocation_per_skill = 5

# How hard an UNOPPOSED check is -- a skill use with no creature resisting it, no [entity.test],
# and no difficulty of its own (searching a stall, climbing a wall, reading a sigil). Without
# this every such check rolled against 0 and could never fail: ~800 playtest turns, every one a
# success. DMCore asks the local model to pick one of these tiers from the attempt and the scene
# (AdHoc_Generation.py's rate_difficulty), or "trivial" -- no roll at all, the player just does
# it (picking up a cup). The model only ever picks a name; the number is authored here,
# calibrated to this engine's plain d6 sums (2D untrained, 4D trained, 5D expert) rather than
# WEG's attribute+skill pools -- at WEG's 10/15/20, a 2D skill could never pass a moderate
# check (one playtest: 13 of 20 unopposed checks failed). Success odds, 2D/3D/4D/5D:
# very easy 3 97/100/100/100, easy 6 72/95/100/100, moderate 10 17/62/90/98,
# difficult 15 0/9/44/78, very difficult 18 0/0/16/50, heroic 22 0/0/1/11. If it
# can't be reached or declines, the skill's own default_difficulty (skills.toml, optional) is
# used, else [difficulty].fallback. A setting with no tiers keeps the old always-succeeds roll.
[difficulty]
fallback = "moderate"

[[difficulty_tier]]
name = "very easy"
difficulty = 3
description = "Anyone manages it almost every time, barring real bad luck."

[[difficulty_tier]]
name = "easy"
difficulty = 6
description = "An ordinary person usually manages it; a little care is enough."

[[difficulty_tier]]
name = "moderate"
difficulty = 10
description = "Needs real competence -- an untrained attempt often fails."

[[difficulty_tier]]
name = "difficult"
difficulty = 15
description = "A trained professional can fail it; an amateur rarely succeeds."

[[difficulty_tier]]
name = "very difficult"
difficulty = 18
description = "Only experts succeed with any regularity."

[[difficulty_tier]]
name = "heroic"
difficulty = 22
description = "The stuff of legend -- even a master needs luck."

# Each entry contributes one skill's dice/pips to the combined initiative pool DMCore.roll_initiative
# rolls once per round for turn ordering -- "dodge + observation" today, but a third contributing
# skill later is just another entry, no code change needed (same list-of-terms pattern [[status]]
# already uses).
[[initiative]]
skill = "dodge"

[[initiative]]
skill = "observation"

# Translates a get_attitude() axis value (-150..150, clamped) into prose for narration --
# see DMCore.get_attitude_tier/describe_attitude. Checked in declaration order; a value sitting
# exactly on a shared boundary (ex: -100, between "hostile" and "unfriendly") resolves to
# whichever tier is declared first.
[[attitude_tier]]
name = "hostile"
minimum = -150
maximum = -100
disposition = "wants them gone, one way or another"
threat = "is terrified of them, ready to flee or freeze"
familiarity = "is repulsed by them"

[[attitude_tier]]
name = "unfriendly"
minimum = -100
maximum = -60
disposition = "is openly unfriendly toward them"
threat = "is visibly afraid around them"
familiarity = "finds them distasteful"

[[attitude_tier]]
name = "wary"
minimum = -60
maximum = -20
disposition = "is cold and standoffish around them"
threat = "feels intimidated and uneasy around them"
familiarity = "feels a mild aversion to them"

[[attitude_tier]]
name = "neutral"
minimum = -20
maximum = 20

[[attitude_tier]]
name = "warm"
minimum = 20
maximum = 60
disposition = "is warm and well-disposed toward them"
threat = "feels self-assured dealing with them"
familiarity = "feels a real fondness for them"

[[attitude_tier]]
name = "friendly"
minimum = 60
maximum = 100
disposition = "is genuinely friendly toward them"
threat = "feels bold and confident around them"
familiarity = "feels genuinely enamored with them"

[[attitude_tier]]
name = "devoted"
minimum = 100
maximum = 150
disposition = "adores them and would do almost anything for them"
threat = "feels utterly fearless around them"
familiarity = "is utterly infatuated with them"

# Per-axis attitude deltas for a resolved player action (see DM_Social.py's own
# nudge_attitude_from_event) -- distinct from [[attitude_tier]] above, which only ever renders
# an already-resolved value into prose. Each entry's own axis values are the *full-strength*
# delta, applied at magnitude = 1.0 (ex: combat_hit at a killing blow, or theft/favor against
# items.toml's own single most valuable item) -- an ordinary occurrence scales down from there
# (see nudge_attitude_from_event's own magnitude param, 0..1). A missing axis defaults to 0.
[[attitude_event]]
name = "combat_hit"
disposition = -20
threat = -15
familiarity = -10

# Being attacked by someone you weren't fighting -- applied once, at full strength, hit or miss
# (DM_Core.py's own attack redirect), unlike combat_hit, which measures how badly a fight that's
# already happening is going. Whether it starts a fight is yes-or-no, not a matter of damage, so
# this has to carry anyone past is_hostile's -100: its own "cap" lifts it over the 60 every
# other action event is held to. Even a friendly (60) bystander lands at -140. Only someone
# truly devoted (100) whom the player has also sweet-talked to the talk cap (+40) stays above
# -100 -- they'll take a punch without swinging back.
[[attitude_event]]
name = "assaulted"
disposition = -200
threat = -20
familiarity = -15
cap = 200

[[attitude_event]]
name = "theft"
disposition = -15
threat = 0
familiarity = -12

# Mirrors "theft"'s own magnitude exactly (disposition/familiarity), just positive -- restores
# roughly what this event lost when the six-axis model collapsed to three and "favor" lost its
# own single largest lever (obligation = 20, folded into neither surviving axis at the time).
# Give vs. take are the direct positive/negative mirror of the same mechanic
# (DM_Inventory.py's own "give"/"take" transfer), so there's no principled reason for one to
# carry noticeably less emotional weight than the other.
[[attitude_event]]
name = "favor"
disposition = 15
threat = 0
familiarity = 12

# "Bonds made on the battlefield" -- a small, deliberately modest counterpart to combat_hit
# above, applied not to the entity being struck but to any *other* living entity that already
# considers that same target an enemy (see DM_Core.py's own "shared_enemy" loop). Smaller than
# favor's own deltas on purpose: watching someone fight your enemy is a lighter touch than being
# on the receiving end of a real gift.
[[attitude_event]]
name = "shared_enemy"
disposition = 5
threat = 0
familiarity = 0

# Fired by maneuvers.toml's own "intimidate" universal ability (via its own "attitude" op) --
# a successful intimidation scares the
# target (threat drops hard) without necessarily earning outright hatred; a failed attempt barely
# dents disposition and, if anything, leaves the target slightly more confident (threat up) for
# having stood their ground.
[[attitude_event]]
name = "intimidated"
disposition = -10
threat = -25
familiarity = -5

[[attitude_event]]
name = "failed_intimidation"
disposition = -5
threat = 10
familiarity = -5

# Fired by maneuvers.toml's own "charm" universal ability -- the positive mirror of intimidate's
# own pair above. A successful charm attempt genuinely warms someone up (disposition/familiarity
# both rise, and threat rises too -- charm reads as safe, not threatening); a failed attempt
# reads as a bit awkward, a mild, mostly-harmless dent rather than real offense.
[[attitude_event]]
name = "charmed"
disposition = 15
threat = 5
familiarity = 10

[[attitude_event]]
name = "failed_charm"
disposition = -3
threat = 0
familiarity = -2

# Wordless gestures (nlp/Intent_Classification.py's "gesture" verdict, intents/gesture.py): an
# [[attitude_event]] carrying a "tone" is one the adjudicator may pick for a line like "kiss her" or
# "bow to the captain", its "description" being what the model is told the tone means. Applied once,
# at full strength, to the target alone -- never a bystander. A tone may author "unwelcome_below" (a
# disposition) and "unwelcome_event": below it the target takes that event instead, because the same
# kiss is not the same act from a stranger. A setting authoring no tones has no gestures at all.
[[attitude_event]]
name = "gesture_warm"
tone = "warm"
description = "a kind, friendly or affectionate act: a hug, a pat on the shoulder, a gentle touch, a warm smile"
disposition = 6
threat = 3
familiarity = 4
unwelcome_below = -20
unwelcome_event = "gesture_unwelcome"

[[attitude_event]]
name = "gesture_intimate"
tone = "intimate"
description = "a romantic or physically intimate act: a kiss, an embrace, holding someone close"
disposition = 8
threat = 0
familiarity = 10
unwelcome_below = 20
unwelcome_event = "gesture_unwanted"

[[attitude_event]]
name = "gesture_respectful"
tone = "respectful"
description = "a show of respect or deference: a bow, a curtsy, a salute, doffing a hat, kneeling"
disposition = 5
threat = 0
familiarity = 1

[[attitude_event]]
name = "gesture_mocking"
tone = "mocking"
description = "a derisive or insulting wordless act: a rude gesture, spitting at someone's feet, an exaggerated mocking bow, turning your back on them"
disposition = -8
threat = 2
familiarity = -3

# A wordless act that carries no feeling toward anyone (dancing, juggling, stretching) -- here so
# the model is never forced to call it warm or rude. Moves nothing.
[[attitude_event]]
name = "gesture_neutral"
tone = "neutral"
description = "a wordless act with no feeling aimed at anyone: dancing, juggling, stretching, idle fidgeting"

# What gesture_warm / gesture_intimate become when the target already feels too coldly toward the
# player for them to land.
[[attitude_event]]
name = "gesture_unwelcome"
disposition = -4
threat = -3
familiarity = -2

[[attitude_event]]
name = "gesture_unwanted"
disposition = -12
threat = -10
familiarity = -6

# Which [entity.equipped] slot names are valid for a given kind of entity -- entity_schema.
# toml's own [entity.equipped] comment notes slot names are freeform strings today (nothing in
# DM_*.py validates them against anything); this table is reference data for that validation to
# read from later, not itself enforced by any code yet. Matched the same way get_attitude's
# "name"/"supertype" overrides are: a "subtype" entry beats a "supertype"-only entry for the
# same supertype, checked in declaration order. An animal/elemental has no hands or worn
# clothing, so it lists no slots at all; an undead humanoid keeps just enough to wield the
# weapon/armor it died in.
[[equip_slot]]
supertype = "creature"
subtype = "humanoid"
slots = [ "head", "neck", "chest", "back", "rhand", "lhand", "ring", "feet" ]

[[equip_slot]]
supertype = "creature"
subtype = "undead"
slots = [ "rhand", "chest" ]

[[equip_slot]]
supertype = "creature"
subtype = "animal"
slots = []

[[equip_slot]]
supertype = "creature"
subtype = "elemental"
slots = []
