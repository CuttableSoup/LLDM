[[status]]
name = "bruised"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.81 },
    { field = "hp_per_remain", operator = "<=", value = 0.99 },
]
description = "Absorbed most or all of the attack"

[[status]]
name = "stunned"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.60 },
    { field = "hp_per_remain", operator = "<=", value = 0.80 },
]
apply = { condition = "stunned", duration = "fleeting", dismiss = "" }
description = "Moderate bruise or minor sprain; laceration; muscle tear; minor dislocation of joint."

[[status]]
name = "wounded"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.40 },
    { field = "hp_per_remain", operator = "<=", value = 0.59 },
]
apply = { condition = "wounded", duration = "permanent", dismiss = "" }
description = "Severe abrasion or sprain; deep laceration; torn ligaments; major dislocation or minor break."

[[status]]
name = "severe"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.20 },
    { field = "hp_per_remain", operator = "<=", value = 0.39 },
]
apply = { condition = "severe", duration = "permanent", dismiss = "" }
description = "Broken bone; gaping wound; ripped cartilage and muscle; concussion."

[[status]]
name = "incapacitated"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.10 },
    { field = "hp_per_remain", operator = "<=", value = 0.19 },
]
apply = { condition = "incapacitated", duration = "permanent", dismiss = "" }
description = "Multiple fracture; laceration in vital area; heavy concussion."

[[status]]
name = "mortal"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
    { field = "hp_per_remain", operator = "<=", value = 0.09 },
]
apply = { condition = "unconscious", duration = "scene", dismiss = "" }
description = "Multiple internal injuries."

[[status]]
name = "dead"
trigger = "on_damage"
requirements = [
    { field = "hp_per_remain", operator = "==", value = 0 },
]
apply = { condition = "dead", duration = "permanent", dismiss = "resurrection" }
description = "Broken neck; punctured lung; eviscerated."

