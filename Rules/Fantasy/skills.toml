[[skill]]
name = "athletics"
description = "Physical movement and sports activities."
keywords = ["movement", "exertion", "physical", "climb", "jump", "swim", "run", "sprint"]
opposes = ["athletics", "observation"]
# Combat maneuvers any entity may attempt via athletics, no training implied -- see
# maneuvers.toml's own "Universal (untrained) abilities".
abilities = [ "trip", "disarm", "sunder", "bull rush", "grapple", "pin" ]

[[skill]]
name = "blades"
description = "Using swords and knives in close combat."
# "attack the creature"/"attack the creature with my weapon" -- deliberately fuller phrases,
# not bare words, alongside the single-word keywords below: a plain "attack"/"sword" already
# loses to spells.toml's own "summon spectral wolf" on a sentence naming a live wolf target
# (ex: "I attack the wolf with my sword") purely because that spell's own name/description are
# saturated with the literal word "wolf" -- the same lexical-magnetism risk any ability
# whose name happens to share a word with the scene runs into. A fuller, sentence-shaped phrase mirroring
# real attack-a-creature input structure closes that gap without renaming/thinning the spell's
# own established identity.
keywords = [
    "combat", "melee", "armed", "sword", "dagger", "knife", "blade", "stab", "slash", "cut", "attack",
    "attack the creature", "attack the creature with my weapon",
]
opposes = ["dodge", "blades", "brawling", "axes", "polearms"]
# See maneuvers.toml's own "sunder" -- accessible via any melee weapon skill, not just
# athletics (Pathfinder's own Sunder is a CMB maneuver performed as part of a weapon attack).
abilities = [ "sunder" ]

[[skill]]
name = "throwing"
description = "Hurling weapons or objects at a target."
keywords = ["combat", "ranged", "projectile", "throw", "hurl", "toss"]
opposes = ["dodge", "reflexes"]

[[skill]]
name = "fortitude"
description = "Resisting fatigue, disease, or poison."
keywords = ["defense", "resistance", "passive", "endure", "survive", "toughness"]
opposes = []

[[skill]]
name = "strength"
description = "Feats of raw physical power and lifting."
keywords = ["exertion", "lifting", "force", "power", "push", "pull", "break", "smash"]
opposes = ["strength", "brawling", "fortitude"]

[[skill]]
name = "axes"
description = "Wielding axes in melee combat."
keywords = ["combat", "melee", "armed", "axe", "hatchet", "cleave", "chop"]
opposes = ["dodge", "blades", "axes", "polearms"]
abilities = [ "sunder" ]

[[skill]]
name = "polearms"
description = "Wielding long hafted weapons in combat."
keywords = ["combat", "melee", "reach", "spear", "halberd", "pike", "lance", "thrust"]
opposes = ["dodge", "blades", "axes", "polearms"]
abilities = [ "sunder" ]

[[skill]]
name = "brawling"
description = "Unarmed melee combat."
keywords = ["combat", "melee", "unarmed", "punch", "kick", "unarmed strike", "fight"]
opposes = ["dodge", "brawling", "blades", "axes", "polearms"]
abilities = [ "sunder" ]

[[skill]]
name = "acrobatics"
description = "Tumbling, balancing, and executing flips."
keywords = ["movement", "agility", "balance", "flip", "tumble", "roll", "dodge", "evade"]
opposes = ["observation", "reflexes"]

[[skill]]
