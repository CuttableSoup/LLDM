keywords = ["manipulation", "precision", "covert", "pick", "lock", "steal", "dexterity", "disarm", "trap"]
opposes = ["observation", "reflexes"]
# See maneuvers.toml's own "sleight of hand" -- any entity may attempt to pick a pocket.
abilities = [ "sleight of hand" ]

[[skill]]
name = "escape"
description = "Breaking free from restraints or grapples."
