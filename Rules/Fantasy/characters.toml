[[entity]]
name = "gladstone"
supertype = "creature"
subtype = "humanoid"
description = "A man"
is_player = true

max_hp = 36

currency = 100
max_bulk = 5
weight = 150
exp = 100
# No explicit "speed" -- defaults to 1 band per "advance"/"retreat" action (see
# DM_Movement.py), same as every other entity "unless otherwise specified". Only the player
# actually moves today (creature/ally behavior doesn't choose to close distance -- see
# DM_Movement.py's module notes for why that's a deliberate follow-up, not part of this pass).

inventory = [
    "longsword",
    "chain mail",
    "health potion",
    "health potion",
    "health potion"
]

languages = [ "common" ]
memories = [ "A wife at home" ]
quotes = [ "Hello, world" ]

# Flat list, same shape as "inventory": a string names a shared catalog entity
# (spells.toml/techniques.toml) resolved by name at use time; a table is a one-off innate
# ability with no shared entity to point at.
abilities = [
    "fireball",
    "splash flow",
    "cleave",
    { name = "punch", supertype = "innate", subtype = "weapon", skill = "brawling", damage_tags = [ "bludgeoning" ], damage_value = { dice = 0, pips = 0, bonus = "user.strength_damage" } },
]

[entity.equipped]
rhand = "longsword"
chest = "chain mail"

[entity.attitudes]
default = [ 0, 0, 0, 0, 0, 0 ]
# disposition   Hostile <-> Friendly
# trust         Suspicious <-> Trusting
# confidence    Fearful <-> Confident
# respect       Disdainful <-> Admiring
# obligation    Unfettered <-> Indebted
# intimacy      Disgusted <-> Enamored

[[entity.attitudes.supertype]]
undead = [ -100, -100, 100, -100, -100, -100 ]

[[entity.attitudes.name]]
anne = [ 100, 100, 100, 100, 100, 100 ]

[entity.qualities]
body = "athletic"
eye = "brown"
gender = "male"
hair = "black"
height = "tall"
skin = "fair"
size = "medium"
race = "human"
age = 35

[entity.conditions]

# A full, explicit entry for every skill -- not just the ones gladstone is actually good at --
# is what makes this table something the race/point-buy character-creation system
# (Character_Creation.py, "human" in races.toml) could actually have produced: 2D human
# baseline everywhere, plus a legal 15D allocation (blades +3, finesse +1, dodge +3, stealth
# +2, appraise +2, navigation +2, medicine +2 -- exactly 15D, nothing over the 5D-per-skill
# cap). A skill left off entirely would default to untrained 0D (DM_Combat.py's
# resolve_action), not the race's own 2D baseline -- unable to clear anything but an
# auto-success (difficulty 0) check, which is exactly why every skill needs its own line here
# rather than only the "trained" ones. observation stays at the plain 2D human baseline
# (deliberately not boosted further) so items.toml's dart trap/scythe trap [entity.notice]
# checks -- rolled the moment either is instanced, DM_Rules.py's _auto_roll_notice -- stay a
# real, uncertain roll rather than a foregone conclusion either way.
[entity.skills]
acrobatics = { dice = 2, pips = 0 }
appraise = { dice = 4, pips = 0 }
arcane = { dice = 2, pips = 0 }
artistry = { dice = 2, pips = 0 }
athletics = { dice = 2, pips = 2 }
axes = { dice = 2, pips = 0 }
blades = { dice = 5, pips = 0 }
brawling = { dice = 2, pips = 0 }
charisma = { dice = 2, pips = 0 }
deception = { dice = 2, pips = 0 }
disguise = { dice = 2, pips = 0 }
dodge = { dice = 5, pips = 0 }
escape = { dice = 2, pips = 0 }
finesse = { dice = 3, pips = 0 }
fly = { dice = 2, pips = 0 }
forgery = { dice = 2, pips = 0 }
fortitude = { dice = 2, pips = 0 }
gambling = { dice = 2, pips = 0 }
husbandry = { dice = 2, pips = 0 }
intimidation = { dice = 2, pips = 0 }
linguistics = { dice = 2, pips = 0 }
medicine = { dice = 4, pips = 0 }
miracles = { dice = 2, pips = 0 }
missiles = { dice = 2, pips = 0 }
navigation = { dice = 4, pips = 0 }
observation = { dice = 2, pips = 0 }
polearms = { dice = 2, pips = 0 }
psionics = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
stealth = { dice = 4, pips = 0 }
streetwise = { dice = 2, pips = 0 }
strength = { dice = 2, pips = 0 }
survival = { dice = 2, pips = 0 }
throwing = { dice = 2, pips = 0 }
trickery = { dice = 2, pips = 0 }
willpower = { dice = 2, pips = 0 }

[[entity]]
name = "thane"
supertype = "creature"
subtype = "humanoid"
description = "A grizzled mercenary who fights at gladstone's side."
is_party = true                            # Shows thane on GUICore's Party tab alongside
                                            # gladstone -- see entity_schema.toml's is_party.
follow_offset = 0                          # Walks abreast of gladstone -- a melee fighter
                                            # has no reason to hang back (see
                                            # DM_Movement.py's _apply_party_formation).

max_hp = 24

# Positive default disposition toward everyone is what makes is_hostile(thane, gladstone)
# false -- combined with having its own [[entity.behavior]], that's what makes it act as an
# ally rather than an enemy once combat starts (see DMCore._on_action_detected).
[entity.attitudes]
default = [ 40, 40, 40, 40, 40, 40 ]

[entity.qualities]
race = "human"

# Every skill explicit, same reasoning as gladstone's own [entity.skills] comment above --
# human 2D baseline everywhere, plus a legal 15D allocation (blades +2, fortitude +1, dodge
# +1, brawling +2, athletics +2, strength +2, intimidation +2, streetwise +1, survival +2 --
# exactly 15D, nothing over the 5D cap).
[entity.skills]
acrobatics = { dice = 2, pips = 0 }
appraise = { dice = 2, pips = 0 }
arcane = { dice = 2, pips = 0 }
artistry = { dice = 2, pips = 0 }
athletics = { dice = 4, pips = 0 }
axes = { dice = 2, pips = 0 }
blades = { dice = 4, pips = 0 }
brawling = { dice = 4, pips = 0 }
charisma = { dice = 2, pips = 0 }
deception = { dice = 2, pips = 0 }
disguise = { dice = 2, pips = 0 }
dodge = { dice = 3, pips = 0 }
escape = { dice = 2, pips = 0 }
finesse = { dice = 2, pips = 0 }
fly = { dice = 2, pips = 0 }
forgery = { dice = 2, pips = 0 }
fortitude = { dice = 3, pips = 0 }
gambling = { dice = 2, pips = 0 }
husbandry = { dice = 2, pips = 0 }
intimidation = { dice = 4, pips = 0 }
linguistics = { dice = 2, pips = 0 }
medicine = { dice = 2, pips = 0 }
miracles = { dice = 2, pips = 0 }
missiles = { dice = 2, pips = 0 }
navigation = { dice = 2, pips = 0 }
observation = { dice = 2, pips = 0 }
polearms = { dice = 2, pips = 0 }
psionics = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
stealth = { dice = 2, pips = 0 }
streetwise = { dice = 3, pips = 0 }
strength = { dice = 4, pips = 0 }
survival = { dice = 4, pips = 0 }
throwing = { dice = 2, pips = 0 }
trickery = { dice = 2, pips = 0 }
willpower = { dice = 2, pips = 0 }

[[entity.abilities]]
name = "shortsword strike"
supertype = "innate"
subtype = "weapon"
skill = "blades"
damage_tags = [ "slashing" ]
damage_value = { dice = 2, pips = 0, bonus = "user.strength_damage" }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "shortsword strike"

[[entity]]
name = "anne"
supertype = "creature"
subtype = "humanoid"
description = "A sharp-eyed battle mage, quick with a ward and quicker with a curse."
is_party = true                            # See thane's own is_party note above.
follow_offset = -1                         # Trails one band behind gladstone rather than
                                            # walking abreast -- a mage favors her own
                                            # ranged spellwork (splash flow, range = 5, see
                                            # spells.toml) over standing at the front line
                                            # (see DM_Movement.py's _apply_party_formation).
                                            # Clamped to band 1 like anything else, so she's
                                            # still shoulder to shoulder with the party right
                                            # at a room's own doorway.

max_hp = 18

# Flat list, same convention as gladstone's own "abilities" -- must stay above every
# [entity.xxx] sub-table below, or TOML would fold it into whichever one came last instead
# of the top-level [[entity]] table.
abilities = [ "splash flow" ]

# Same reasoning as thane's own attitudes -- see gladstone's own [[entity.attitudes.name]]
# override for "anne" above, which already returns this in kind.
[entity.attitudes]
default = [ 30, 30, 30, 30, 30, 30 ]

[[entity.attitudes.name]]
gladstone = [ 100, 100, 100, 100, 100, 100 ]

[entity.qualities]
race = "elf"

# Every skill explicit, same reasoning as gladstone's own [entity.skills] comment above --
# note this starts from *elf's* own baseline (races.toml), not a flat 2D: arcane/stealth/
# acrobatics/observation are 3D before any allocation, strength/brawling/fortitude/
# intimidation are 1D. Allocation on top (arcane +1, willpower +1, fortitude +1, acrobatics
# +2, stealth +2, observation +2, charisma +2, medicine +2, linguistics +2) is exactly 15D,
# nothing over the 5D cap.
[entity.skills]
acrobatics = { dice = 5, pips = 0 }
appraise = { dice = 2, pips = 0 }
arcane = { dice = 4, pips = 0 }
artistry = { dice = 2, pips = 0 }
athletics = { dice = 2, pips = 0 }
axes = { dice = 2, pips = 0 }
blades = { dice = 2, pips = 0 }
brawling = { dice = 1, pips = 0 }
charisma = { dice = 4, pips = 0 }
deception = { dice = 2, pips = 0 }
disguise = { dice = 2, pips = 0 }
dodge = { dice = 2, pips = 1 }
escape = { dice = 2, pips = 0 }
finesse = { dice = 2, pips = 0 }
fly = { dice = 2, pips = 0 }
forgery = { dice = 2, pips = 0 }
fortitude = { dice = 2, pips = 0 }
gambling = { dice = 2, pips = 0 }
husbandry = { dice = 2, pips = 0 }
intimidation = { dice = 1, pips = 0 }
linguistics = { dice = 4, pips = 0 }
medicine = { dice = 4, pips = 0 }
miracles = { dice = 2, pips = 0 }
missiles = { dice = 2, pips = 0 }
navigation = { dice = 2, pips = 0 }
observation = { dice = 5, pips = 0 }
polearms = { dice = 2, pips = 0 }
psionics = { dice = 2, pips = 0 }
reflexes = { dice = 2, pips = 0 }
stealth = { dice = 5, pips = 0 }
streetwise = { dice = 2, pips = 0 }
strength = { dice = 1, pips = 0 }
survival = { dice = 2, pips = 0 }
throwing = { dice = 2, pips = 0 }
trickery = { dice = 2, pips = 0 }
willpower = { dice = 3, pips = 0 }

[[entity.behavior]]
requirements = [
    { field = "hp_per_remain", operator = ">=", value = 0.01 },
]
action = "splash flow"