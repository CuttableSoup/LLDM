[[entity]]
name = "fireball"
supertype = "spell"
subtype = "evocation"
description = "Hurl a bolt of arcane fire that bursts into flame on impact."
skill = "arcane"
difficulty = 10
# In bands now, not meters -- same single-number range every weapon/ability uses (see
# DM_Movement.py's "Movement and range").
range = 5
# Indiscriminate blast -- side = "all" hits everyone within 5 bands of the target regardless
# of hostility (fire doesn't care who it burns), number = 0 (unlimited) so the blast radius
# alone decides the casualty count, not an arbitrary cap.
targets = { number = 0, aoe = 5, side = "all" }
damage_value = { dice = 5, pips = 0, bonus = 0 }
damage_tags = [ "fire" ]

[[entity]]
name = "splash flow"
supertype = "spell"
subtype = "evocation"
description = "Conjure a sudden torrent of water and slam it into a single target."
skill = "arcane"
difficulty = 10
range = 5
targets = { number = 1, aoe = 0 }
damage_value = { dice = 4, pips = 0, bonus = 0 }
damage_tags = [ "water" ]

[[entity]]
name = "arc lance"
supertype = "spell"
subtype = "evocation"
description = "Channel a crackling lance of lightning through a pinch of iron filings."
skill = "arcane"
difficulty = 10
range = 5
targets = { number = 1, aoe = 0 }
damage_value = { dice = 4, pips = 1, bonus = 0 }
damage_tags = [ "lightning" ]
# Same {item, quantity} shape a craft recipe's own "materials" uses (DM_Crafting.py's
# _has_materials/_consume_materials, reused directly by _resolve_roll's own gate) -- gates the
# cast outright if missing (no roll, "missing_spell_materials"), and is consumed from the
# caster's inventory unconditionally once a real roll happens, success or failure alike, same
# as a craft attempt's own materials.
materials = [ { item = "iron filings", quantity = 1 } ]

[[entity]]
name = "suggestion"
supertype = "spell"
subtype = "enchantment"
description = "Plant a single, reasonable-sounding course of action in a listener's mind -- a successful working leaves them quietly convinced it was their own idea."
skill = "arcane"
difficulty = 10
range = 5
# Enchantment (Compulsion), Language-Dependent, Mind-Affecting (Pathfinder 1e) -- the words
# themselves are the whole mechanism, so a target who can't understand them can't be swayed at
# all. See entity_schema.toml's own "language_dependent" note and DM_Combat.py's
# _ability_requires_language: no shared language means no roll attempted, not a penalized one.
language_dependent = true
# No materials -- Suggestion is verbal/somatic only, no material component in the source rule.
# No on_fail -- a resisted suggestion is just a failed roll, no separate consequence to author.
# "text" is deliberately omitted here -- Program_Interpreter.py's own inject_directive op falls
# back to ctx's own "input" (the caster's raw turn text) when absent, so the actual suggested
# course of action is always whatever the player actually typed, never a fixed scripted line.
# "duration" (in block-clock blocks, DM_Time.py) is this op's own optional expiry -- one block
# (8 hours by rules.toml's own default [time] table) matching the source rule's own "a short
# while" flavor much better than the old no-expiry-at-all default (persisting for the rest of
# the playthrough) did.
on_pass = { do = "inject_directive", entity = "target", duration = 1 }

[[entity]]
name = "summon spectral wolf"
supertype = "spell"
subtype = "conjuration"
description = "Pull a translucent, silver-limned wolf out of raw magic to fight at your side for a short time."
skill = "arcane"
difficulty = 10
# No damage_value/damage_tags at all -- this spell's whole effect is the summon (see "summon"
# below), so _apply_damage_if_hit's own "damage_value" gate (DM_Core.py) correctly skips
# rolling any bonus damage for it. Cast with no current_target at all (no hostile creature
# present), this resolves as a flat, automatic difficulty-0 check (_resolve_roll's own
# no-target branch) -- summoning before a fight starts is trivial. Cast against a live hostile
# current_target, it's an ordinary opposed roll instead: the caster's own arcane vs. the
# target's willpower/arcane, framed as the target's presence disrupting the working -- range is
# set generously high (well past any real scene's own band count) purely so is_in_range never
# blocks the cast on distance alone; a summon isn't "aimed" at the target the way a damaging
# spell is.
range = 10
summon = { name = "spectral wolf", duration = 4 }