# Weapons and consumables for the Zombie setting. Same [[entity]] shape Rules/Fantasy/
# items.toml uses (skill/equip_slot/damage_value/damage_tags/bulk/value/usable/...) --
# nothing here is a new engine mechanism, just new data. Deliberately no ammo/charge
# tracking on any weapon (charges is reserved for a consumable's own limited uses -- see
# health potion's own [entity.skills] comment in Rules/Fantasy/items.toml) -- the engine has
# no ammo mechanic for any setting today, so a firearm here is exactly as "unlimited" as
# Fantasy's own longbow/short bow are with their own arrows.
#
# "car" (below) is the Zombie counterpart to Rules/Fantasy/creatures.toml's own "horse" --
# both author "travel_speed" (nothing else in either setting does but those two), the
# still-unwired field a mounted/driven party member's own effective overland pace would read
# instead of rules.toml's [travel] default_speed, once that wiring exists (see the horse's own
# comment). A car has no team to be paced by the way a carriage's horses would be -- its own
# engine is the whole story -- so it authors travel_speed directly, same as the horse does.
# Unlike the horse, it also authors "max_bulk" directly rather than deriving one from a
# strength skill (Rules/Fantasy's [bulk] formula) -- matching characters.toml's own riley
# (max_bulk = 5), not Fantasy's convention; Rules/Zombie/rules.toml authors no [bulk] table at
# all, so this is the only way either entity's own carrying capacity is enforced in this
# setting (get_max_bulk checks for an authored "max_bulk" override before ever falling back to
# a [bulk]-table formula -- see DM_Rules.py).

