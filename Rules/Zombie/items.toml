[[entity]]
name = "car"
supertype = "object"
subtype = "vehicle"
description = "A dented sedan abandoned half up on the curb, one door hanging open. No keys in the ignition -- whoever left it in a hurry took those with them."

# A structure, not a wound track -- what it takes to actually disable it (a Tank's fists, a
# molotov, sustained gunfire), not damage a person could shrug off. No [entity.abilities]/
# [entity.behavior]/[entity.attitudes] -- an object never acts on its own turn or has a
# disposition of its own (entity_schema.toml's supertype comment: "object" is never treated as
# hostile regardless).
max_hp = 40

# See this file's header comment above.
travel_speed = 20
max_bulk = 20

[entity.skills]
fortitude = { dice = 4, pips = 0 }

# No key in the ignition -- needs mechanics (skills.toml's own "hotwire" keyword) to get
# moving. Same [entity.test]/requires_condition shape items.toml's own chest lock uses, just
# gating "drive" instead of "open": "no_keys" starts active, a pass dismisses it permanently,
# a fail floods the engine (mirroring the chest's own "jammed") so a botched attempt can't just
# be retried forever in place.
[entity.conditions.no_keys]
duration = "permanent"

[entity.test]
difficulty = 11
skill = [ "mechanics" ]
requires_condition = "no_keys"
blocks_if_condition = "flooded"

[entity.test.pass]
dismiss_condition = "no_keys"

[entity.test.fail]
condition = "flooded"
duration = "permanent"
