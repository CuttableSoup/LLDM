# Weapons and consumables for the Zombie setting. Same [[entity]] shape Rules/Fantasy/
# items.toml uses (skill/equip_slot/damage_value/damage_tags/bulk/value/usable/...) --
# nothing here is a new engine mechanism, just new data. Deliberately no ammo/charge
# tracking on any weapon (charges is reserved for a consumable's own limited uses -- see
# health potion's own [entity.skills] comment in Rules/Fantasy/items.toml) -- the engine has
# no ammo mechanic for any setting today, so a firearm here is exactly as "unlimited" as
# Fantasy's own longbow/short bow are with their own arrows.

[[entity]]
name = "pistol"
supertype = "object"
subtype = "weapon"
skill = "firearms"
description = "A worn semi-auto pistol, slide scratched from hard use but still reliable."
equip_slot = "secondary"
max_hp = 8
range = 5
damage_value = { dice = 1, pips = 2, bonus = 0 }
damage_tags = [ "ballistic" ]
bulk = 1
value = 5
[entity.skills]
fortitude = { dice = 1, pips = 0 }

