# Same shape as Rules/Fantasy/rules.toml (with [[condition]] and [[status]] split out into conditions.toml/statuses.toml) -- [[status]] wound ladder,
# [strength_damage], [character_creation], [[initiative]], [[attitude_tier]], [[equip_slot]]
# are all generic engine mechanisms (DM_Status.py/DM_Combat.py/Character_Creation.py read
# these fields the same way regardless of setting); only the flavor text and which skills/
# subtypes get named actually differ from the Fantasy version.

[strength_damage]
skill = "strength"
divisor = 2

# Same point-buy constants as Fantasy's -- a generic character-creation mechanism, not a
# setting-specific balance choice (see Character_Creation.py).
[character_creation]
pool_dice = 15
max_allocation_per_skill = 5

# reflexes (reacting to a lunge/ambush) + observation (spotting trouble before it's on top
# of you) -- the zombie-survival equivalent of Fantasy's dodge + observation pairing.
[[initiative]]
skill = "reflexes"

[[initiative]]
skill = "observation"

# Same seven bands/phrasing as Fantasy's -- these describe a relationship's own sentiment in
# purely generic terms ("wants them gone", "trusts them readily"), which reads just as well
# for a fellow survivor as for a tavern innkeeper.
[[attitude_tier]]
name = "hostile"
minimum = -150
maximum = -100
disposition = "wants them gone, one way or another"
threat = "is terrified of them, ready to flee or freeze"
familiarity = "is repulsed by them"

[[attitude_tier]]
name = "unfriendly"
minimum = -100
maximum = -60
disposition = "is openly unfriendly toward them"
threat = "is visibly afraid around them"
familiarity = "finds them distasteful"

[[attitude_tier]]
name = "wary"
minimum = -60
maximum = -20
disposition = "is cold and standoffish around them"
threat = "feels intimidated and uneasy around them"
familiarity = "feels a mild aversion to them"

[[attitude_tier]]
name = "neutral"
minimum = -20
maximum = 20

[[attitude_tier]]
name = "warm"
minimum = 20
maximum = 60
disposition = "is warm and well-disposed toward them"
threat = "feels self-assured dealing with them"
familiarity = "feels a real fondness for them"

[[attitude_tier]]
name = "friendly"
minimum = 60
maximum = 100
disposition = "is genuinely friendly toward them"
threat = "feels bold and confident around them"
familiarity = "feels genuinely enamored with them"

[[attitude_tier]]
name = "devoted"
minimum = 100
maximum = 150
disposition = "would put themselves between danger and them without a second thought"
threat = "feels utterly fearless around them"
familiarity = "is utterly devoted to them"

# A survivor carries a real loadout (primary/secondary/melee/throwable/medkit); an infected
# carries nothing at all -- it fights with what it was turned with (see creatures.toml),
# same reasoning Fantasy's own animal/elemental subtype gets an empty slot list.
[[equip_slot]]
supertype = "creature"
subtype = "survivor"
slots = [ "primary", "secondary", "melee", "throwable", "medkit" ]

[[equip_slot]]
supertype = "creature"
subtype = "infected"
slots = []
