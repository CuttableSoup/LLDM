# Labeled player-input corpus -- the ground truth behind test_unit.py's TestPlayerInputCorpus,
# which runs every entry against every setting under Rules/. So nothing here may lean on one
# setting: no proper nouns, no genre props (swords, spells, guns), no scenario locations -- only
# what a player could plausibly type in any of them.
#
# source says where a line came from:
#   log     adapted from a real play log (tools/playtest.py personas and human play), with
#           setting-specific nouns swapped for generic ones ("the dockmaster" -> "the foreman")
#   action / social / speech+action / banter / ooc
#           written to probe one failure mode
# No single source or persona should dominate -- the test's rates are only as general as the
# mix behind them. Add a new family rather than more of an existing one.
#
# label is the IDEAL outcome, independent of which pipeline stage produces it:
#   A  a genuine in-world action -- must never be answered with action_not_understood
#   S  a social-skill attempt phrased as an action (bargain, persuade, threaten) -- should roll
#   N  must NOT roll a skill: banter, flirtation, in-character talk, out-of-character questions

